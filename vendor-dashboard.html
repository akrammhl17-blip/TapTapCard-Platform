<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - TapTapCard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f6f6f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .seller {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .logout {
      border: none;
      background: #eee;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .count-box {
      margin-top: 20px;
      background: #f4f4f5;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .count-label {
      color: #777;
      font-size: 14px;
    }

    .count {
      font-size: 35px;
      font-weight: bold;
      margin-top: 5px;
    }

    .add-button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* SEARCH */

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .search-input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: #222;
    }

    .search-result-count {
      margin-top: 9px;
      font-size: 13px;
      color: #777;
    }

    /* CLIENT CARD */

    .client-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .client-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .client-image {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .client-info {
      min-width: 0;
      flex: 1;
    }

    .client-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .client-description {
      color: #777;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* BUTTONS */

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .action-button {
      border: none;
      padding: 11px 5px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .open-button {
      background: #111;
      color: white;
    }

    .edit-button {
      background: #e9e9eb;
      color: #222;
    }

    .delete-button {
      background: #ffe8e8;
      color: #c62828;
    }

    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* STATES */

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 16px;
      color: #777;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .error {
      background: #fdeaea;
      color: #b42318;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
      word-break: break-word;
    }

    @media (max-width: 420px) {

      .actions {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
      }

      .logout {
        padding: 9px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ERROR -->

    <div
      id="errorMessage"
      class="error"
    ></div>


    <!-- HEADER -->

    <div class="header">

      <div class="top">

        <div>

          <h1>
            Mon Dashboard
          </h1>

          <div
            class="seller"
            id="sellerName"
          >
            Chargement...
          </div>

        </div>


        <button
          class="logout"
          onclick="logout()"
        >
          Déconnexion
        </button>

      </div>


      <!-- COUNT -->

      <div class="count-box">

        <div class="count-label">
          Mes clients
        </div>

        <div
          class="count"
          id="clientCount"
        >
          0
        </div>

      </div>


      <!-- ADD -->

      <button
        class="add-button"
        onclick="addClient()"
      >
        + Ajouter un client
      </button>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="🔎 Rechercher un client..."
        autocomplete="off"
      >

      <div
        id="searchResultCount"
        class="search-result-count"
      >
        Tous les clients
      </div>

    </div>


    <!-- CLIENTS -->

    <div id="clientsContainer">

      <div class="loading">
        Chargement des clients...
      </div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="supabase.js"></script>


  <script>

    /* =========================================
       SESSION
    ========================================= */

    const sessionData =
      localStorage.getItem(
        "vendor_session"
      );


    if (!sessionData) {

      window.location.href =
        "vendor.html";

    }


    let vendorSession;


    try {

      vendorSession =
        JSON.parse(sessionData);

    } catch (error) {

      localStorage.removeItem(
        "vendor_session"
      );

      window.location.href =
        "vendor.html";

    }


    /* =========================================
       ELEMENTS
    ========================================= */

    const sellerName =
      document.getElementById(
        "sellerName"
      );

    const clientCount =
      document.getElementById(
        "clientCount"
      );

    const clientsContainer =
      document.getElementById(
        "clientsContainer"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const searchResultCount =
      document.getElementById(
        "searchResultCount"
      );


    /* =========================================
       DATA
    ========================================= */

    let allClients = [];


    /* =========================================
       ERROR
    ========================================= */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";
    }


    function hideError() {

      errorMessage.style.display =
        "none";
    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================
       VERIFY SESSION
    ========================================= */

    async function verifySession() {

      if (
        !vendorSession ||
        !vendorSession.session_token
      ) {

        window.location.href =
          "vendor.html";

        return false;
      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "verify_vendor_session",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (
        error ||
        !data ||
        data.length === 0
      ) {

        localStorage.removeItem(
          "vendor_session"
        );

        window.location.href =
          "vendor.html";

        return false;
      }


      sellerName.textContent =
        "Vendeur : " +
        data[0].vendor_name;


      return true;
    }


    /* =========================================
       ADD CLIENT
    ========================================= */

    function addClient() {

      window.location.href =
        "vendor-add-client.html";
    }


    /* =========================================
       OPEN CLIENT
    ========================================= */

    function openClient(clientId) {

      window.open(
        "client.html?id=" +
        encodeURIComponent(clientId),
        "_blank"
      );
    }


    /* =========================================
       EDIT CLIENT
    ========================================= */

    function editClient(clientId) {

      window.location.href =
        "vendor-edit-client.html?id=" +
        encodeURIComponent(clientId);
    }


    /* =========================================
       DELETE CLIENT
    ========================================= */

    async function deleteClient(
      clientId,
      clientName,
      button
    ) {

      const confirmed =
        confirm(
          'Voulez-vous vraiment supprimer "' +
          clientName +
          '" ?\n\nCette action est irréversible.'
        );


      if (!confirmed) {

        return;
      }


      hideError();


      button.disabled =
        true;

      button.textContent =
        "Suppression...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "delete_vendor_client",
            {
              p_session_token:
                vendorSession.session_token,

              p_client_id:
                clientId
            }
          );


        if (error) {

          console.error(
            "Delete error:",
            error
          );

          throw new Error(
            error.message ||
            "Impossible de supprimer le client."
          );
        }


        /*
          نحذف من القائمة المحلية
          مباشرة
        */

        allClients =
          allClients.filter(
            function(client) {

              return Number(client.id) !==
                Number(clientId);

            }
          );


        clientCount.textContent =
          allClients.length;


        renderClients(
          searchInput.value
        );


      } catch (error) {

        console.error(error);


        showError(
          "Erreur lors de la suppression : " +
          error.message
        );


        button.disabled =
          false;

        button.textContent =
          "Supprimer";
      }
    }


    /* =========================================
       LOAD CLIENTS
    ========================================= */

    async function loadClients() {

      hideError();


      clientsContainer.innerHTML =
        `
        <div class="loading">
          Chargement des clients...
        </div>
        `;


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_vendor_clients",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (error) {

        console.error(
          "Load clients error:",
          error
        );


        showError(
          error.message ||
          "Impossible de charger les clients."
        );


        clientsContainer.innerHTML =
          `
          <div class="empty">
            Impossible de charger les clients.
          </div>
          `;

        return;
      }


      allClients =
        data || [];


      clientCount.textContent =
        allClients.length;


      renderClients(
        searchInput.value
      );
    }


    /* =========================================
       RENDER CLIENTS
    ========================================= */

    function renderClients(
      searchTerm = ""
    ) {

      const term =
        searchTerm
          .trim()
          .toLowerCase();


      let filteredClients;


      if (!term) {

        filteredClients =
          allClients;

      } else {

        filteredClients =
          allClients.filter(
            function(client) {

              return (
                (client.name || "")
                  .toLowerCase()
                  .includes(term)
              );

            }
          );
      }


      /*
        Search counter
      */

      if (!term) {

        searchResultCount.textContent =
          allClients.length +
          " client" +
          (
            allClients.length > 1
              ? "s"
              : ""
          );

      } else {

        searchResultCount.textContent =
          filteredClients.length +
          " résultat" +
          (
            filteredClients.length > 1
              ? "s"
              : ""
          );
      }


      /*
        Aucun résultat
      */

      if (
        filteredClients.length === 0
      ) {

        if (term) {

          clientsContainer.innerHTML =
            `
            <div class="empty">
              Aucun client trouvé pour
              <strong>
                "${escapeHtml(searchTerm)}"
              </strong>
            </div>
            `;

        } else {

          clientsContainer.innerHTML =
            `
            <div class="empty">
              Aucun client pour le moment.
              <br><br>
              Cliquez sur « Ajouter un client ».
            </div>
            `;
        }


        return;
      }


      /*
        Afficher les clients
      */

      clientsContainer.innerHTML =
        "";


      filteredClients.forEach(
        function(client) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "client-card";


          /*
            IMAGE
          */

          const image =
            client.profile_image &&
            client.profile_image.trim() !== ""
              ? client.profile_image
              : "https://placehold.co/150x150?text=Client";


          /*
            DESCRIPTION
          */

          const description =
            client.description ||
            "Aucune description";


          /*
            CARD
          */

          card.innerHTML =
            `
            <div class="client-top">

              <img
                class="client-image"
                src="${escapeHtml(image)}"
                alt=""
                onerror="this.src='https://placehold.co/150x150?text=Client'"
              >


              <div class="client-info">

                <div class="client-name">
                  ${escapeHtml(
                    client.name ||
                    "Sans nom"
                  )}
                </div>


                <div class="client-description">
                  ${escapeHtml(
                    description
                  )}
                </div>

              </div>

            </div>


            <div class="actions">

              <button
                class="action-button open-button"
                data-action="open"
              >
                Ouvrir
              </button>


              <button
                class="action-button edit-button"
                data-action="edit"
              >
                Modifier
              </button>


              <button
                class="action-button delete-button"
                data-action="delete"
              >
                Supprimer
              </button>

            </div>
            `;


          /*
            OUVRIR
          */

          card
            .querySelector(
              '[data-action="open"]'
            )
            .addEventListener(
              "click",
              function() {

                openClient(
                  client.id
                );

              }
            );


          /*
            MODIFIER
          */

          card
            .querySelector(
              '[data-action="edit"]'
            )
            .addEventListener(
              "click",
              function() {

                editClient(
                  client.id
                );

              }
            );


          /*
            SUPPRIMER
          */

          card
            .querySelector(
              '[data-action="delete"]'
            )
            .addEventListener(
              "click",
              function(event) {

                deleteClient(
                  client.id,
                  client.name ||
                    "ce client",
                  event.currentTarget
                );

              }
            );


          clientsContainer.appendChild(
            card
          );

        }
      );
    }


    /* =========================================
       SEARCH
    ========================================= */

    searchInput.addEventListener(
      "input",
      function() {

        renderClients(
          searchInput.value
        );

      }
    );


    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {

      localStorage.removeItem(
        "vendor_session"
      );

      window.location.href =
        "vendor.html";
    }


    /* =========================================
       INIT
    ========================================= */

    async function init() {

      const valid =
        await verifySession();


      if (!valid) {

        return;
      }


      await loadClients();
    }


    init();

  </script>

</body>
</html>
