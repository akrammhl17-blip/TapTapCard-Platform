<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard - TapTapCard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f6f6f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .seller {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .logout {
      border: none;
      background: #eee;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    /* COUNTS */

    .counts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .count-box {
      background: #f4f4f5;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .count-label {
      color: #777;
      font-size: 14px;
    }

    .count {
      font-size: 35px;
      font-weight: bold;
      margin-top: 5px;
    }

    /* ADD QR */

    .add-button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* BACK */

    .back-button {
      width: 100%;
      margin-bottom: 15px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #222;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
      text-align: left;
    }

    /* SEARCH */

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .search-input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: #222;
    }

    .search-result-count {
      margin-top: 9px;
      font-size: 13px;
      color: #777;
    }

    /* CARDS */

    .client-card,
    .qr-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .client-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .client-image {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .client-info {
      min-width: 0;
      flex: 1;
    }

    .client-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .client-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
      min-width: 0;
      flex: 1;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .quick-button {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
    }

    .copy-link-button {
      background: #eef2ff;
      color: #3448c5;
    }

    .qr-button {
      background: #f0f0f0;
      color: #222;
    }

    .client-description {
      color: #777;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .action-button {
      border: none;
      padding: 11px 5px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .open-button {
      background: #111;
      color: white;
    }

    .edit-button {
      background: #e9e9eb;
      color: #222;
    }

    .delete-button {
      background: #ffe8e8;
      color: #c62828;
    }

    /* QR */

    .qr-section {
      display: none;
    }

    .qr-section.active {
      display: block;
    }

    .qr-title {
      font-size: 22px;
      font-weight: bold;
      margin: 5px 0 20px;
    }

    .form-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: #222;
    }

    .generate-button {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* QR LIST */

    .section-heading {
      font-size: 19px;
      font-weight: bold;
      margin: 20px 0 15px;
    }

    .qr-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .qr-card-title {
      font-size: 16px;
      font-weight: bold;
      word-break: break-word;
    }

    .qr-destination {
      margin-top: 7px;
      color: #777;
      font-size: 13px;
    }

    .qr-actions {
      display: flex;
      gap: 7px;
      margin-top: 14px;
    }

    .qr-action {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .qr-download {
      background: #111;
      color: white;
    }

    .qr-delete {
      background: #ffe8e8;
      color: #c62828;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 16px;
      color: #777;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .error {
      background: #fdeaea;
      color: #b42318;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
      word-break: break-word;
    }

    /* MODALS */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10000;
      backdrop-filter: blur(4px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.20);
      text-align: center;
    }

    .modal-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .modal-text {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-button {
      border: none;
      padding: 13px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel-button {
      background: #eee;
      color: #222;
    }

    .danger-button {
      background: #d32f2f;
      color: white;
    }

    #qrGenerator {
      position: absolute;
      left: -99999px;
      top: -99999px;
      width: 900px;
      height: 900px;
      background: white;
    }

    @media (max-width: 420px) {

      body {
        padding: 12px;
      }

      .counts {
        gap: 8px;
      }

      .count {
        font-size: 30px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <div
    id="errorMessage"
    class="error"
  ></div>


  <!-- HEADER -->

  <div class="header">

    <div class="top">

      <div>

        <h1>
          Mon Dashboard
        </h1>

        <div
          class="seller"
          id="sellerName"
        >
          Chargement...
        </div>

      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Déconnexion
      </button>

    </div>


    <!-- COUNTS -->

    <div class="counts">

      <div class="count-box">

        <div class="count-label">
          Mes clients
        </div>

        <div
          class="count"
          id="clientCount"
        >
          0
        </div>

      </div>


      <div class="count-box">

        <div class="count-label">
          QR Codes
        </div>

        <div
          class="count"
          id="qrCount"
        >
          0
        </div>

      </div>

    </div>


    <!-- QR BUTTON -->

    <button
      id="addQrButton"
      class="add-button"
      onclick="showQrView()"
    >
      + Ajouter QR Code
    </button>

  </div>


  <!-- =====================================
       CLIENT VIEW
  ====================================== -->

  <div id="clientView">

    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="🔎 Rechercher un client..."
        autocomplete="off"
      >

      <div
        id="searchResultCount"
        class="search-result-count"
      >
        Tous les clients
      </div>

    </div>


    <div id="clientsContainer">

      <div class="loading">
        Chargement des clients...
      </div>

    </div>

  </div>


  <!-- =====================================
       QR VIEW
  ====================================== -->

  <div
    id="qrView"
    class="qr-section"
  >

    <!-- BACK TOP -->

    <button
      class="back-button"
      onclick="showClientView()"
    >
      ← Retour à mes clients
    </button>


    <div class="form-card">

      <div class="qr-title">
        QR CODE DYNAMIQUE
      </div>


      <!-- TITLE -->

      <div class="form-group">

        <label class="form-label">
          Titre du QR Code
        </label>

        <input
          id="qrTitleInput"
          class="form-input"
          type="text"
          placeholder="Instagram Boutique"
          autocomplete="off"
        >

      </div>


      <!-- DESTINATION -->

      <div class="form-group">

        <label class="form-label">
          Destination
        </label>

        <select
          id="qrDestination"
          class="form-select"
        >

          <option value="instagram">
            Instagram
          </option>

          <option value="facebook">
            Facebook
          </option>

          <option value="tiktok">
            TikTok
          </option>

          <option value="snapchat">
            Snapchat
          </option>

          <option value="website">
            Website
          </option>

          <option value="telephone">
            Téléphone
          </option>

          <option value="whatsapp">
            WhatsApp
          </option>

        </select>

      </div>


      <!-- LINK -->

      <div class="form-group">

        <label
          id="qrLinkLabel"
          class="form-label"
        >
          Lien
        </label>

        <input
          id="qrLinkInput"
          class="form-input"
          type="url"
          placeholder="https://instagram.com/..."
          autocomplete="off"
        >

      </div>


      <button
        id="generateQrButton"
        class="generate-button"
        onclick="generateDynamicQr()"
      >
        Générer le QR Code
      </button>

    </div>


    <!-- QR LIST -->

    <div class="section-heading">
      Mes QR Codes
    </div>


    <div id="qrContainer">

      <div class="loading">
        Chargement des QR Codes...
      </div>

    </div>

  </div>

</div>


<!-- DELETE QR MODAL -->

<div
  id="qrDeleteModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-title">
      Supprimer le QR Code ?
    </div>

    <div class="modal-text">

      Voulez-vous vraiment supprimer

      <strong id="qrDeleteName"></strong>

      ?

      <br><br>

      Cette action est irréversible.

    </div>

    <div class="modal-actions">

      <button
        class="modal-button cancel-button"
        onclick="closeQrDeleteModal()"
      >
        Annuler
      </button>

      <button
        id="confirmQrDeleteButton"
        class="modal-button danger-button"
        onclick="confirmQrDelete()"
      >
        Supprimer
      </button>

    </div>

  </div>

</div>


<div id="qrGenerator"></div>


<script src="supabase.js"></script>


<script>

  /* =========================================
     TOKEN
  ========================================= */

  const dashboardParams =
    new URLSearchParams(
      window.location.search
    );


  const urlLoginToken =
    dashboardParams.get("token");


  if (urlLoginToken) {

    sessionStorage.setItem(
      "vendor_login_token",
      urlLoginToken
    );

  }


  /* =========================================
     SESSION
  ========================================= */

  const sessionData =
    localStorage.getItem(
      "vendor_session"
    );


  if (!sessionData) {

    window.location.href =
      urlLoginToken
        ? "vendor.html?token=" +
          encodeURIComponent(
            urlLoginToken
          )
        : "vendor.html";

  }


  let vendorSession;


  try {

    vendorSession =
      JSON.parse(
        sessionData
      );

  } catch (error) {

    localStorage.removeItem(
      "vendor_session"
    );

    window.location.href =
      urlLoginToken
        ? "vendor.html?token=" +
          encodeURIComponent(
            urlLoginToken
          )
        : "vendor.html";

  }


  /* =========================================
     ELEMENTS
  ========================================= */

  const sellerName =
    document.getElementById(
      "sellerName"
    );


  const clientCount =
    document.getElementById(
      "clientCount"
    );


  const qrCount =
    document.getElementById(
      "qrCount"
    );


  const clientsContainer =
    document.getElementById(
      "clientsContainer"
    );


  const qrContainer =
    document.getElementById(
      "qrContainer"
    );


  const errorMessage =
    document.getElementById(
      "errorMessage"
    );


  const searchInput =
    document.getElementById(
      "searchInput"
    );


  const searchResultCount =
    document.getElementById(
      "searchResultCount"
    );


  const clientView =
    document.getElementById(
      "clientView"
    );


  const qrView =
    document.getElementById(
      "qrView"
    );


  const addQrButton =
    document.getElementById(
      "addQrButton"
    );


  const qrTitleInput =
    document.getElementById(
      "qrTitleInput"
    );


  const qrDestination =
    document.getElementById(
      "qrDestination"
    );


  const qrLinkInput =
    document.getElementById(
      "qrLinkInput"
    );


  const qrLinkLabel =
    document.getElementById(
      "qrLinkLabel"
    );


  const generateQrButton =
    document.getElementById(
      "generateQrButton"
    );


  const qrDeleteModal =
    document.getElementById(
      "qrDeleteModal"
    );


  const qrDeleteName =
    document.getElementById(
      "qrDeleteName"
    );


  const confirmQrDeleteButton =
    document.getElementById(
      "confirmQrDeleteButton"
    );


  /* =========================================
     DATA
  ========================================= */

  let allClients = [];

  let allQrCodes = [];

  let qrToDelete = null;


  /* =========================================
     ERROR
  ========================================= */

  function showError(message) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

  }


  function hideError() {

    errorMessage.style.display =
      "none";

  }


  /* =========================================
     ESCAPE
  ========================================= */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================
     SESSION VERIFY
  ========================================= */

  async function verifySession() {

    if (
      !vendorSession ||
      !vendorSession.session_token
    ) {

      window.location.href =
        "vendor.html";

      return false;

    }


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "verify_vendor_session",
        {
          p_session_token:
            vendorSession.session_token
        }
      );


    if (
      error ||
      !data ||
      data.length === 0
    ) {

      localStorage.removeItem(
        "vendor_session"
      );


      const loginToken =
        sessionStorage.getItem(
          "vendor_login_token"
        );


      window.location.href =
        loginToken
          ? "vendor.html?token=" +
            encodeURIComponent(
              loginToken
            )
          : "vendor.html";


      return false;

    }


    sellerName.textContent =
      "Vendeur : " +
      data[0].vendor_name;


    return true;

  }


  /* =========================================
     VIEWS
  ========================================= */

  function showClientView() {

    clientView.style.display =
      "block";

    qrView.classList.remove(
      "active"
    );

    addQrButton.style.display =
      "block";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function showQrView() {

    clientView.style.display =
      "none";

    qrView.classList.add(
      "active"
    );

    addQrButton.style.display =
      "none";

    loadQrCodes();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* =========================================
     DESTINATION CHANGE
  ========================================= */

  qrDestination.addEventListener(
    "change",
    updateQrLinkField
  );


  function updateQrLinkField() {

    const destination =
      qrDestination.value;


    /*
      Instagram
    */

    if (
      destination ===
      "instagram"
    ) {

      qrLinkLabel.textContent =
        "Lien";

      qrLinkInput.type =
        "url";

      qrLinkInput.placeholder =
        "https://instagram.com/...";

      qrLinkInput.inputMode =
        "url";

      return;

    }


    /*
      Facebook
    */

    if (
      destination ===
      "facebook"
    ) {

      qrLinkLabel.textContent =
        "Lien";

      qrLinkInput.type =
        "url";

      qrLinkInput.placeholder =
        "https://facebook.com/...";

      qrLinkInput.inputMode =
        "url";

      return;

    }


    /*
      TikTok
    */

    if (
      destination ===
      "tiktok"
    ) {

      qrLinkLabel.textContent =
        "Lien";

      qrLinkInput.type =
        "url";

      qrLinkInput.placeholder =
        "https://tiktok.com/@...";

      qrLinkInput.inputMode =
        "url";

      return;

    }


    /*
      Snapchat
    */

    if (
      destination ===
      "snapchat"
    ) {

      qrLinkLabel.textContent =
        "Lien";

      qrLinkInput.type =
        "text";

      qrLinkInput.placeholder =
        "@username";

      qrLinkInput.inputMode =
        "text";

      return;

    }


    /*
      Website
    */

    if (
      destination ===
      "website"
    ) {

      qrLinkLabel.textContent =
        "Lien";

      qrLinkInput.type =
        "url";

      qrLinkInput.placeholder =
        "https://example.com";

      qrLinkInput.inputMode =
        "url";

      return;

    }


    /*
      Téléphone
    */

    if (
      destination ===
      "telephone"
    ) {

      qrLinkLabel.textContent =
        "Numéro de téléphone";

      qrLinkInput.type =
        "tel";

      qrLinkInput.placeholder =
        "0550 00 00 00";

      qrLinkInput.inputMode =
        "tel";

      return;

    }


    /*
      WhatsApp
    */

    if (
      destination ===
      "whatsapp"
    ) {

      qrLinkLabel.textContent =
        "Numéro WhatsApp";

      qrLinkInput.type =
        "tel";

      qrLinkInput.placeholder =
        "0550 00 00 00";

      qrLinkInput.inputMode =
        "tel";

      return;

    }

  }


  /* =========================================
     NORMALIZE LINK
  ========================================= */

  function normalizeQrLink(
    destination,
    value
  ) {

    let link =
      String(value || "").trim();


    if (!link) {

      return "";

    }


    /*
      TELEPHONE
    */

    if (
      destination ===
      "telephone"
    ) {

      let phone =
        link.replace(
          /[\s\-().]/g,
          ""
        );


      if (
        phone.startsWith("0")
      ) {

        phone =
          "+213" +
          phone.substring(1);

      }


      if (
        !phone.startsWith("+")
      ) {

        phone =
          "+" +
          phone;

      }


      return "tel:" + phone;

    }


    /*
      WHATSAPP
    */

    if (
      destination ===
      "whatsapp"
    ) {

      let phone =
        link.replace(
          /[\s\-().+]/g,
          ""
        );


      if (
        phone.startsWith("0")
      ) {

        phone =
          "213" +
          phone.substring(1);

      }


      return (
        "https://wa.me/" +
        phone
      );

    }


    /*
      SNAPCHAT
    */

    if (
      destination ===
      "snapchat"
    ) {

      link =
        link.replace(
          /^@/,
          ""
        );


      if (
        link.startsWith(
          "http://"
        ) ||
        link.startsWith(
          "https://"
        )
      ) {

        return link;

      }


      return (
        "https://www.snapchat.com/add/" +
        encodeURIComponent(link)
      );

    }


    /*
      SOCIAL / WEBSITE
    */

    if (
      !link.startsWith(
        "http://"
      ) &&
      !link.startsWith(
        "https://"
      )
    ) {

      link =
        "https://" +
        link;

    }


    return link;

  }


  /* =========================================
     CREATE QR
  ========================================= */

  async function generateDynamicQr() {

    hideError();


    const title =
      qrTitleInput.value.trim();


    const destination =
      qrDestination.value;


    const rawLink =
      qrLinkInput.value.trim();


    if (!title) {

      showError(
        "Veuillez saisir un titre pour le QR Code."
      );

      qrTitleInput.focus();

      return;

    }


    if (!rawLink) {

      showError(
        "Veuillez saisir le lien ou le numéro."
      );

      qrLinkInput.focus();

      return;

    }


    const finalLink =
      normalizeQrLink(
        destination,
        rawLink
      );


    if (!finalLink) {

      showError(
        "Lien invalide."
      );

      return;

    }


    generateQrButton.disabled =
      true;

    generateQrButton.textContent =
      "Création...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "create_vendor_qr_code",
          {

            p_session_token:
              vendorSession.session_token,

            p_title:
              title,

            p_destination:
              destination,

            p_link:
              finalLink

          }
        );


      if (error) {

        throw error;

      }


      /*
        Nettoyer le formulaire
      */

      qrTitleInput.value =
        "";

      qrLinkInput.value =
        "";


      /*
        Recharger la liste
      */

      await loadQrCodes();


      alert(
        "QR Code créé avec succès."
      );

    } catch (error) {

      console.error(
        "Create QR error:",
        error
      );


      showError(
        error.message ||
        "Impossible de créer le QR Code."
      );

    }


    generateQrButton.disabled =
      false;

    generateQrButton.textContent =
      "Générer le QR Code";

  }


  /* =========================================
     QR URL
  ========================================= */

  function getDynamicQrUrl(
    qrId
  ) {

    return new URL(
      "qr.html?id=" +
      encodeURIComponent(
        qrId
      ),
      window.location.href
    ).href;

  }


  /* =========================================
     LOAD QR
  ========================================= */

  async function loadQrCodes() {

    qrContainer.innerHTML =
      `
      <div class="loading">
        Chargement des QR Codes...
      </div>
      `;


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_vendor_qr_codes",
        {

          p_session_token:
            vendorSession.session_token

        }
      );


    if (error) {

      console.error(
        "QR load error:",
        error
      );


      showError(
        error.message ||
        "Impossible de charger les QR Codes."
      );


      qrContainer.innerHTML =
        `
        <div class="empty">
          Impossible de charger les QR Codes.
        </div>
        `;

      return;

    }


    allQrCodes =
      data || [];


    qrCount.textContent =
      allQrCodes.length;


    renderQrCodes();

  }


  /* =========================================
     RENDER QR
  ========================================= */

  function renderQrCodes() {

    if (
      allQrCodes.length ===
      0
    ) {

      qrContainer.innerHTML =
        `
        <div class="empty">

          Aucun QR Code pour le moment.

          <br><br>

          Cliquez sur
          « + Ajouter QR Code ».

        </div>
        `;

      return;

    }


    qrContainer.innerHTML =
      "";


    allQrCodes.forEach(
      function(qr) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "qr-card";


        const destinationName =
          getDestinationName(
            qr.destination
          );


        card.innerHTML =
          `
          <div class="qr-card-top">

            <div>

              <div class="qr-card-title">

                ${escapeHtml(
                  qr.title
                )}

              </div>

              <div class="qr-destination">

                ${escapeHtml(
                  destinationName
                )}

              </div>

            </div>

          </div>


          <div class="qr-actions">

            <button
              class="qr-action qr-download"
              onclick="downloadDynamicQr(
                ${Number(qr.id)},
                '${escapeHtml(
                  qr.title
                )}'
              )"
            >
              Télécharger QR
            </button>

            <button
              class="qr-action qr-delete"
              onclick="openQrDeleteModal(
                ${Number(qr.id)},
                '${escapeHtml(
                  qr.title
                )}'
              )"
            >
              Supprimer
            </button>

          </div>
          `;


        qrContainer.appendChild(
          card
        );

      }
    );

  }


  /* =========================================
     DESTINATION NAME
  ========================================= */

  function getDestinationName(
    destination
  ) {

    const names = {

      instagram:
        "Instagram",

      facebook:
        "Facebook",

      tiktok:
        "TikTok",

      snapchat:
        "Snapchat",

      website:
        "Website",

      telephone:
        "Téléphone",

      whatsapp:
        "WhatsApp"

    };


    return (
      names[destination] ||
      destination
    );

  }


  /* =========================================
     DOWNLOAD DYNAMIC QR
  ========================================= */

  async function downloadDynamicQr(
    qrId,
    qrTitle
  ) {

    const qrContainer =
      document.getElementById(
        "qrGenerator"
      );


    qrContainer.innerHTML =
      "";


    const url =
      getDynamicQrUrl(
        qrId
      );


    new QRCode(
      qrContainer,
      {

        text: url,

        width: 900,

        height: 900,

        colorDark:
          "#000000",

        colorLight:
          "#ffffff",

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );


    await new Promise(
      function(resolve) {

        setTimeout(
          resolve,
          300
        );

      }
    );


    const qrCanvas =
      qrContainer.querySelector(
        "canvas"
      );


    if (!qrCanvas) {

      throw new Error(
        "Impossible de créer le QR Code."
      );

    }


    const finalCanvas =
      document.createElement(
        "canvas"
      );


    finalCanvas.width =
      1000;

    finalCanvas.height =
      1000;


    const ctx =
      finalCanvas.getContext(
        "2d"
      );


    ctx.fillStyle =
      "#ffffff";


    ctx.fillRect(
      0,
      0,
      1000,
      1000
    );


    ctx.drawImage(
      qrCanvas,
      50,
      50,
      900,
      900
    );


    const safeName =
      String(
        qrTitle ||
        "QR"
      )
        .replace(
          /[^a-zA-Z0-9À-ÿ_-]+/g,
          "_"
        )
        .replace(
          /^_+|_+$/g,
          ""
        ) ||
      "QR";


    const link =
      document.createElement(
        "a"
      );


    link.href =
      finalCanvas.toDataURL(
        "image/png"
      );


    link.download =
      "TAPTAPCARD_" +
      safeName +
      "_QR.png";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    qrContainer.innerHTML =
      "";

  }


  /* =========================================
     DELETE QR
  ========================================= */

  function openQrDeleteModal(
    qrId,
    qrTitle
  ) {

    qrToDelete =
      qrId;


    qrDeleteName.textContent =
      qrTitle;


    confirmQrDeleteButton.disabled =
      false;


    confirmQrDeleteButton.textContent =
      "Supprimer";


    qrDeleteModal.classList.add(
      "show"
    );

  }


  function closeQrDeleteModal() {

    qrDeleteModal.classList.remove(
      "show"
    );


    qrToDelete =
      null;

  }


  async function confirmQrDelete() {

    if (!qrToDelete) {

      return;

    }


    confirmQrDeleteButton.disabled =
      true;


    confirmQrDeleteButton.textContent =
      "Suppression...";


    try {

      const {
        error
      } =
        await supabaseClient.rpc(
          "delete_vendor_qr_code",
          {

            p_session_token:
              vendorSession.session_token,

            p_qr_id:
              qrToDelete

          }
        );


      if (error) {

        throw error;

      }


      closeQrDeleteModal();


      await loadQrCodes();

    } catch (error) {

      console.error(
        error
      );


      closeQrDeleteModal();


      showError(
        error.message ||
        "Impossible de supprimer le QR Code."
      );

    }

  }


  /* =========================================
     MODAL CLICK
  ========================================= */

  qrDeleteModal.addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        qrDeleteModal
      ) {

        closeQrDeleteModal();

      }

    }
  );


  /* =========================================
     CLIENT
  ========================================= */

  function addClient() {

    window.location.href =
      "vendor-add-client.html";

  }


  function getClientUrl(
    clientId
  ) {

    return new URL(
      "client.html?id=" +
      encodeURIComponent(
        clientId
      ),
      window.location.href
    ).href;

  }


  function openClient(
    clientId
  ) {

    window.open(
      getClientUrl(
        clientId
      ),
      "_blank"
    );

  }


  async function copyClientLink(
    clientId
  ) {

    const url =
      getClientUrl(
        clientId
      );


    await navigator.clipboard.writeText(
      url
    );

  }


  function editClient(
    clientId
  ) {

    window.location.href =
      "vendor-edit-client.html?id=" +
      encodeURIComponent(
        clientId
      );

  }


  /* =========================================
     LOAD CLIENTS
  ========================================= */

  async function loadClients() {

    clientsContainer.innerHTML =
      `
      <div class="loading">
        Chargement des clients...
      </div>
      `;


    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_vendor_clients",
        {

          p_session_token:
            vendorSession.session_token

        }
      );


    if (error) {

      console.error(
        error
      );


      showError(
        error.message ||
        "Impossible de charger les clients."
      );


      return;

    }


    allClients =
      data || [];


    clientCount.textContent =
      allClients.length;


    renderClients(
      searchInput.value
    );

  }


  /* =========================================
     RENDER CLIENTS
  ========================================= */

  function renderClients(
    searchTerm = ""
  ) {

    const term =
      searchTerm
        .trim()
        .toLowerCase();


    const filtered =
      !term
        ? allClients
        : allClients.filter(
            function(client) {

              return (
                client.name ||
                ""
              )
                .toLowerCase()
                .includes(
                  term
                );

            }
          );


    if (!term) {

      searchResultCount.textContent =
        allClients.length +
        " client" +
        (
          allClients.length > 1
            ? "s"
            : ""
        );

    } else {

      searchResultCount.textContent =
        filtered.length +
        " résultat" +
        (
          filtered.length > 1
            ? "s"
            : ""
        );

    }


    if (
      filtered.length ===
      0
    ) {

      clientsContainer.innerHTML =
        `
        <div class="empty">

          ${
            term
              ? "Aucun client trouvé."
              : "Aucun client pour le moment."
          }

        </div>
        `;

      return;

    }


    clientsContainer.innerHTML =
      "";


    filtered.forEach(
      function(client) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "client-card";


        const image =
          client.profile_image &&
          client.profile_image.trim()
            ? client.profile_image
            : "https://placehold.co/150x150?text=Client";


        card.innerHTML =
          `
          <div class="client-top">

            <img
              class="client-image"
              src="${escapeHtml(
                image
              )}"
              alt=""
            >


            <div class="client-info">

              <div class="client-name-row">

                <div class="client-name">

                  ${escapeHtml(
                    client.name ||
                    "Sans nom"
                  )}

                </div>

                <div class="quick-actions">

                  <button
                    class="quick-button copy-link-button"
                    title="Copier le lien"
                  >
                    🔗
                  </button>

                  <button
                    class="quick-button qr-button"
                    title="QR Code"
                  >
                    ▣
                  </button>

                </div>

              </div>


              <div class="client-description">

                ${escapeHtml(
                  client.description ||
                  "Aucune description"
                )}

              </div>

            </div>

          </div>


          <div class="actions">

            <button
              class="action-button open-button"
            >
              Ouvrir
            </button>

            <button
              class="action-button edit-button"
            >
              Modifier
            </button>

            <button
              class="action-button delete-button"
            >
              Supprimer
            </button>

          </div>
          `;


        card
          .querySelector(
            ".copy-link-button"
          )
          .onclick =
          function() {

            copyClientLink(
              client.id
            );

          };


        card
          .querySelector(
            ".qr-button"
          )
          .onclick =
          function() {

            /*
              QR client القديم
              reste disponible.
            */

            window.open(
              getClientUrl(
                client.id
              ),
              "_blank"
            );

          };


        card
          .querySelector(
            ".open-button"
          )
          .onclick =
          function() {

            openClient(
              client.id
            );

          };


        card
          .querySelector(
            ".edit-button"
          )
          .onclick =
          function() {

            editClient(
              client.id
            );

          };


        card
          .querySelector(
            ".delete-button"
          )
          .onclick =
          function() {

            deleteClient(
              client.id,
              client.name
            );

          };


        clientsContainer.appendChild(
          card
        );

      }
    );

  }


  /* =========================================
     DELETE CLIENT
  ========================================= */

  async function deleteClient(
    clientId,
    clientName
  ) {

    const confirmed =
      confirm(
        "Supprimer " +
        (
          clientName ||
          "ce client"
        ) +
        " ?"
      );


    if (!confirmed) {

      return;

    }


    const {
      error
    } =
      await supabaseClient.rpc(
        "delete_vendor_client",
        {

          p_session_token:
            vendorSession.session_token,

          p_client_id:
            clientId

        }
      );


    if (error) {

      showError(
        error.message ||
        "Impossible de supprimer le client."
      );

      return;

    }


    await loadClients();

  }


  /* =========================================
     SEARCH
  ========================================= */

  searchInput.addEventListener(
    "input",
    function() {

      renderClients(
        searchInput.value
      );

    }
  );


  /* =========================================
     LOGOUT
  ========================================= */

  function logout() {

    const loginToken =
      sessionStorage.getItem(
        "vendor_login_token"
      );


    localStorage.removeItem(
      "vendor_session"
    );


    window.location.href =
      loginToken
        ? "vendor.html?token=" +
          encodeURIComponent(
            loginToken
          )
        : "vendor.html";

  }


  /* =========================================
     INIT
  ========================================= */

  async function init() {

    const valid =
      await verifySession();


    if (!valid) {

      return;

    }


    await loadClients();

    await loadQrCodes();

    updateQrLinkField();

  }


  init();

</script>
