<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard - TapTapCard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f6f6f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .seller {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .logout {
      border: none;
      background: #eee;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    /* ================================
       COUNTS
    ================================= */

    .count-box {
      margin-top: 20px;
      background: #f4f4f5;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .count-boxes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .single-count {
      min-width: 0;
    }

    .count-label {
      color: #777;
      font-size: 14px;
    }

    .count {
      font-size: 35px;
      font-weight: bold;
      margin-top: 5px;
    }

    /* ================================
       MAIN BUTTONS
    ================================= */

    .add-button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-button:hover {
      opacity: 0.9;
    }

    .qr-main-button {
      background: #222;
    }

    /* ================================
       SEARCH
    ================================= */

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .search-input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: #222;
    }

    .search-result-count {
      margin-top: 9px;
      font-size: 13px;
      color: #777;
    }

    /* ================================
       CLIENT CARDS
    ================================= */

    .client-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .client-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .client-image {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .client-info {
      min-width: 0;
      flex: 1;
    }

    .client-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .client-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
      min-width: 0;
      flex: 1;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .quick-button {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 17px;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .quick-button:hover {
      transform: translateY(-1px);
      opacity: 0.85;
    }

    .copy-link-button {
      background: #eef2ff;
      color: #3448c5;
    }

    .qr-button {
      background: #f0f0f0;
      color: #222;
    }

    .client-description {
      color: #777;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .action-button {
      border: none;
      padding: 11px 5px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .open-button {
      background: #111;
      color: white;
    }

    .edit-button {
      background: #e9e9eb;
      color: #222;
    }

    .delete-button {
      background: #ffe8e8;
      color: #c62828;
    }

    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ================================
       EMPTY / LOADING / ERROR
    ================================= */

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 16px;
      color: #777;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .error {
      background: #fdeaea;
      color: #b42318;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
      word-break: break-word;
    }

    /* ================================
       QR VIEW
    ================================= */

    #qrView {
      margin-bottom: 20px;
    }

    .back-button {
      width: 100%;
      border: none;
      background: white;
      color: #222;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .back-button:hover {
      background: #f1f1f1;
    }

    .qr-form-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .qr-form-title {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 22px;
    }

    .qr-label {
      display: block;
      font-size: 13px;
      color: #555;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 7px;
    }

    .qr-input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .qr-input:focus {
      border-color: #222;
    }

    .form-back-button {
      margin-top: 10px;
      background: #eee;
      box-shadow: none;
    }

    .section-title {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    /* ================================
       QR CARDS
    ================================= */

    .qr-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .qr-card-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .qr-card-destination {
      font-size: 13px;
      color: #777;
      margin-bottom: 15px;
    }

    .qr-image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      min-height: 220px;
    }

    .qr-image-container img,
    .qr-image-container canvas {
      width: 220px !important;
      height: 220px !important;
      max-width: 100%;
    }

    .qr-card-link {
      font-size: 12px;
      color: #777;
      word-break: break-all;
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 9px;
    }

    .qr-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .qr-action-button {
      border: none;
      padding: 11px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .qr-edit-button {
      background: #e9e9eb;
      color: #222;
    }

    .qr-delete-button {
      background: #ffe8e8;
      color: #c62828;
    }

    .qr-download-button {
      background: #111;
      color: white;
    }

    .qr-empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 16px;
      color: #777;
    }

    /* ================================
       MODALS
    ================================= */

    .confirm-modal,
    .delete-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10000;
      backdrop-filter: blur(4px);
    }

    .confirm-modal.show,
    .delete-modal.show {
      display: flex;
    }

    .confirm-box,
    .delete-box {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.20);
      text-align: center;
      animation: modalIn 0.18s ease;
    }

    @keyframes modalIn {

      from {
        opacity: 0;
        transform: scale(0.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }

    .confirm-icon,
    .delete-icon {
      width: 55px;
      height: 55px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .confirm-icon {
      background: #f1f3f5;
    }

    .delete-icon {
      background: #ffe8e8;
    }

    .confirm-title,
    .delete-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .confirm-text,
    .delete-text {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .confirm-client-name,
    .delete-client-name {
      color: #222;
      font-weight: bold;
    }

    .confirm-actions,
    .delete-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-button {
      border: none;
      padding: 13px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .cancel-confirm,
    .cancel-delete {
      background: #eee;
      color: #222;
    }

    .confirm-action {
      background: #111;
      color: white;
    }

    .confirm-delete {
      background: #d32f2f;
      color: white;
    }

    .modal-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ================================
       HIDDEN QR GENERATOR
    ================================= */

    #qrGenerator {
      position: absolute;
      left: -99999px;
      top: -99999px;
      width: 900px;
      height: 900px;
      background: white;
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 420px) {

      .actions {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
      }

      .logout {
        padding: 9px 10px;
      }

      .client-name-row {
        gap: 7px;
      }

      .quick-actions {
        gap: 5px;
      }

      .quick-button {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }

      .count-boxes {
        grid-template-columns: 1fr 1fr;
      }

      .qr-image-container img,
      .qr-image-container canvas {
        width: 190px !important;
        height: 190px !important;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <!-- ERROR -->

    <div
      id="errorMessage"
      class="error"
    ></div>


    <!-- HEADER -->

    <div class="header">

      <div class="top">

        <div>

          <h1>
            Mon Dashboard
          </h1>

          <div
            class="seller"
            id="sellerName"
          >
            Chargement...
          </div>

        </div>


        <button
          class="logout"
          onclick="logout()"
        >
          Déconnexion
        </button>

      </div>


      <!-- COUNTS -->

      <div class="count-box count-boxes">

        <div class="single-count">

          <div class="count-label">
            Mes clients
          </div>

          <div
            class="count"
            id="clientCount"
          >
            0
          </div>

        </div>


        <div class="single-count">

          <div class="count-label">
            QR Codes
          </div>

          <div
            class="count"
            id="qrCount"
          >
            0
          </div>

        </div>

      </div>


      <!-- ADD CLIENT -->

      <button
        class="add-button"
        onclick="addClient()"
      >
        + Ajouter un client
      </button>


      <!-- QR BUTTON -->

      <button
        class="add-button qr-main-button"
        onclick="showQrView()"
      >
        🔲 QR Code dynamic
      </button>

    </div>


    <!-- ================================
         CLIENT VIEW
    ================================= -->

    <div id="clientView">

      <div class="search-box">

        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="🔎 Rechercher un client..."
          autocomplete="off"
        >

        <div
          id="searchResultCount"
          class="search-result-count"
        >
          Tous les clients
        </div>

      </div>


      <div id="clientsContainer">

        <div class="loading">
          Chargement des clients...
        </div>

      </div>

    </div>


    <!-- ================================
         QR VIEW
    ================================= -->

    <div
      id="qrView"
      style="display:none;"
    >

      <button
        class="back-button"
        onclick="showClientsView()"
      >
        ← Retour à mes clients
      </button>


      <button
        class="add-button"
        onclick="showQrForm()"
      >
        + Ajouter QR Code
      </button>


      <div
        id="qrForm"
        class="qr-form-card"
        style="display:none;"
      >

        <div class="qr-form-title">
          QR CODE DYNAMIQUE
        </div>


        <label class="qr-label">
          Titre du QR Code
        </label>

        <input
          type="text"
          id="qrTitleInput"
          class="qr-input"
          placeholder="Titre du QR Code"
          autocomplete="off"
        >


        <label class="qr-label">
          Destination
        </label>

        <select
          id="qrDestinationInput"
          class="qr-input"
        >

          <option value="Instagram">
            Instagram
          </option>

          <option value="Facebook">
            Facebook
          </option>

          <option value="TikTok">
            TikTok
          </option>

          <option value="Snapchat">
            Snapchat
          </option>

          <option value="Website">
            Website
          </option>

          <option value="WhatsApp">
            WhatsApp
          </option>

          <option value="Téléphone">
            Téléphone
          </option>

          <option value="Google Maps">
            Google Maps
          </option>

        </select>


        <label
          class="qr-label"
          id="qrLinkLabel"
        >
          Lien
        </label>

        <input
          type="url"
          id="qrLinkInput"
          class="qr-input"
          placeholder="https://instagram.com/..."
          autocomplete="off"
        >


        <button
          id="generateQrButton"
          class="add-button"
          onclick="createDynamicQr()"
        >
          Générer le QR Code
        </button>


        <button
          class="back-button form-back-button"
          onclick="hideQrForm()"
        >
          ← Retour aux QR Codes
        </button>

      </div>


      <div
        id="qrListSection"
      >

        <div class="section-title">
          Mes QR Codes
        </div>


        <div
          id="qrCodesContainer"
        >

          <div class="loading">
            Chargement des QR Codes...
          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- ================================
       CONFIRM CLIENT MODAL
  ================================= -->

  <div
    id="confirmModal"
    class="confirm-modal"
  >

    <div class="confirm-box">

      <div
        id="confirmIcon"
        class="confirm-icon"
      >
        🔗
      </div>

      <div
        id="confirmTitle"
        class="confirm-title"
      >
        Copier le lien ?
      </div>

      <div class="confirm-text">

        Voulez-vous copier le lien de

        <span
          id="confirmClientName"
          class="confirm-client-name"
        ></span>

        ?

      </div>

      <div class="confirm-actions">

        <button
          id="cancelConfirmButton"
          class="modal-button cancel-confirm"
          onclick="closeConfirmModal()"
        >
          Annuler
        </button>

        <button
          id="confirmActionButton"
          class="modal-button confirm-action"
          onclick="confirmAction()"
        >
          Confirmer
        </button>

      </div>

    </div>

  </div>


  <!-- ================================
       DELETE CLIENT MODAL
  ================================= -->

  <div
    id="deleteModal"
    class="delete-modal"
  >

    <div class="delete-box">

      <div class="delete-icon">
        🗑️
      </div>

      <div class="delete-title">
        Supprimer le client ?
      </div>

      <div class="delete-text">

        Voulez-vous vraiment supprimer

        <span
          id="deleteClientName"
          class="delete-client-name"
        ></span>

        ?

        <br>

        Cette action est irréversible.

      </div>

      <div class="delete-actions">

        <button
          id="cancelDeleteButton"
          class="modal-button cancel-delete"
          onclick="closeDeleteModal()"
        >
          Annuler
        </button>

        <button
          id="confirmDeleteButton"
          class="modal-button confirm-delete"
          onclick="confirmDelete()"
        >
          Supprimer
        </button>

      </div>

    </div>

  </div>


  <!-- HIDDEN QR GENERATOR -->

  <div id="qrGenerator"></div>


  <!-- SUPABASE -->

  <script src="supabase.js"></script>


  <script>

    /* =========================================
       TOKEN FROM URL
    ========================================= */

    const dashboardParams =
      new URLSearchParams(
        window.location.search
      );


    const urlLoginToken =
      dashboardParams.get(
        "token"
      );


    if (urlLoginToken) {

      sessionStorage.setItem(
        "vendor_login_token",
        urlLoginToken
      );

    }


    /* =========================================
       SESSION
    ========================================= */

    const sessionData =
      localStorage.getItem(
        "vendor_session"
      );


    let vendorSession = null;


    /*
      إذا ماكانتش session محلية
      نرجع لصفحة تسجيل الدخول.
    */

    if (!sessionData) {

      const loginToken =
        sessionStorage.getItem(
          "vendor_login_token"
        ) || urlLoginToken;


      window.location.href =
        loginToken
          ? "vendor.html?token=" +
            encodeURIComponent(
              loginToken
            )
          : "vendor.html";

    } else {

      try {

        vendorSession =
          JSON.parse(
            sessionData
          );

      } catch (error) {

        console.error(
          "Erreur lecture session:",
          error
        );


        localStorage.removeItem(
          "vendor_session"
        );


        const loginToken =
          sessionStorage.getItem(
            "vendor_login_token"
          ) || urlLoginToken;


        window.location.href =
          loginToken
            ? "vendor.html?token=" +
              encodeURIComponent(
                loginToken
              )
            : "vendor.html";

      }

    }


    /* =========================================
       ELEMENTS
    ========================================= */

    const sellerName =
      document.getElementById(
        "sellerName"
      );


    const clientCount =
      document.getElementById(
        "clientCount"
      );


    const qrCount =
      document.getElementById(
        "qrCount"
      );


    const clientView =
      document.getElementById(
        "clientView"
      );


    const qrView =
      document.getElementById(
        "qrView"
      );


    const qrForm =
      document.getElementById(
        "qrForm"
      );


    const qrListSection =
      document.getElementById(
        "qrListSection"
      );


    const qrCodesContainer =
      document.getElementById(
        "qrCodesContainer"
      );


    const qrTitleInput =
      document.getElementById(
        "qrTitleInput"
      );


    const qrDestinationInput =
      document.getElementById(
        "qrDestinationInput"
      );


    const qrLinkInput =
      document.getElementById(
        "qrLinkInput"
      );


    const qrLinkLabel =
      document.getElementById(
        "qrLinkLabel"
      );


    const generateQrButton =
      document.getElementById(
        "generateQrButton"
      );


    const clientsContainer =
      document.getElementById(
        "clientsContainer"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchResultCount =
      document.getElementById(
        "searchResultCount"
      );


    const confirmModal =
      document.getElementById(
        "confirmModal"
      );


    const confirmIcon =
      document.getElementById(
        "confirmIcon"
      );


    const confirmTitle =
      document.getElementById(
        "confirmTitle"
      );


    const confirmClientName =
      document.getElementById(
        "confirmClientName"
      );


    const confirmActionButton =
      document.getElementById(
        "confirmActionButton"
      );


    const cancelConfirmButton =
      document.getElementById(
        "cancelConfirmButton"
      );


    const deleteModal =
      document.getElementById(
        "deleteModal"
      );


    const deleteClientName =
      document.getElementById(
        "deleteClientName"
      );


    const confirmDeleteButton =
      document.getElementById(
        "confirmDeleteButton"
      );


    const cancelDeleteButton =
      document.getElementById(
        "cancelDeleteButton"
      );


    /* =========================================
       DATA
    ========================================= */

    let allClients = [];

    let allQrCodes = [];

    let clientToDelete = null;

    let confirmActionType = null;

    let clientForAction = null;

    let editingQrId = null;


    /* =========================================
       ERROR
    ========================================= */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

    }


    function hideError() {

      errorMessage.style.display =
        "none";

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================
       VERIFY SESSION
    ========================================= */

    async function verifySession() {

      if (
        !vendorSession ||
        !vendorSession.session_token
      ) {

        console.error(
          "Session introuvable:",
          vendorSession
        );

        return false;

      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "verify_vendor_session",
            {
              p_session_token:
                vendorSession.session_token
            }
          );


        console.log(
          "verify_vendor_session:",
          data,
          error
        );


        /*
          خطأ RPC أو مشكلة اتصال:
          ما نمسحوش session.
        */

        if (error) {

          console.error(
            "Erreur verification session:",
            error
          );


          showError(
            "Impossible de vérifier la session. Vérifiez votre connexion."
          );


          return false;

        }


        /*
          Supabase أكد أن session غير موجودة.
        */

        if (
          !data ||
          data.length === 0
        ) {

          console.error(
            "Session invalide ou expirée."
          );


          localStorage.removeItem(
            "vendor_session"
          );


          const loginToken =
            sessionStorage.getItem(
              "vendor_login_token"
            ) || urlLoginToken;


          window.location.href =
            loginToken
              ? "vendor.html?token=" +
                encodeURIComponent(
                  loginToken
                )
              : "vendor.html";


          return false;

        }


        sellerName.textContent =
          "Vendeur : " +
          data[0].vendor_name;


        return true;


      } catch (error) {

        console.error(
          "Erreur inattendue:",
          error
        );


        showError(
          "Erreur de connexion. Veuillez vérifier votre connexion Internet."
        );


        return false;

      }

    }

    /* =========================================
       COPY CLIENT LINK
    ========================================= */

    async function copyClientLink(
      clientId
    ) {

      const url =
        getClientUrl(
          clientId
        );


      if (
        navigator.clipboard &&
        navigator.clipboard.writeText
      ) {

        await navigator.clipboard.writeText(
          url
        );

        return;

      }


      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        url;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.focus();


      textarea.select();


      const success =
        document.execCommand(
          "copy"
        );


      document.body.removeChild(
        textarea
      );


      if (!success) {

        throw new Error(
          "Impossible de copier le lien."
        );

      }

    }


    /* =========================================
       DOWNLOAD CLIENT QR
    ========================================= */

    async function downloadClientQr(
      clientId,
      clientName
    ) {

      const qrContainer =
        document.getElementById(
          "qrGenerator"
        );


      qrContainer.innerHTML =
        "";


      const url =
        getClientUrl(
          clientId
        );


      const qrSize =
        900;


      new QRCode(
        qrContainer,
        {

          text: url,

          width: qrSize,

          height: qrSize,

          colorDark:
            "#000000",

          colorLight:
            "#ffffff",

          correctLevel:
            QRCode.CorrectLevel.H

        }
      );


      await new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            300
          );

        }
      );


      const qrCanvas =
        qrContainer.querySelector(
          "canvas"
        );


      if (!qrCanvas) {

        throw new Error(
          "Impossible de créer le QR Code."
        );

      }


      const finalCanvas =
        document.createElement(
          "canvas"
        );


      finalCanvas.width =
        1000;


      finalCanvas.height =
        1000;


      const ctx =
        finalCanvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        1000,
        1000
      );


      const qrPosition =
        50;


      const qrFinalSize =
        900;


      ctx.drawImage(
        qrCanvas,

        qrPosition,
        qrPosition,

        qrFinalSize,
        qrFinalSize
      );


      const displayName =
        String(
          clientName ||
          "client"
        ).trim();


      const safeName =
        displayName
          .replace(
            /[^a-zA-Z0-9À-ÿ_-]+/g,
            "_"
          )
          .replace(
            /^_+|_+$/g,
            ""
          ) ||
        "client";


      const downloadUrl =
        finalCanvas.toDataURL(
          "image/png"
        );


      const downloadLink =
        document.createElement(
          "a"
        );


      downloadLink.href =
        downloadUrl;


      downloadLink.download =
        "TAPTAPCARD_" +
        safeName +
        "_QR.png";


      document.body.appendChild(
        downloadLink
      );


      downloadLink.click();


      document.body.removeChild(
        downloadLink
      );


      qrContainer.innerHTML =
        "";

    }

    /* =========================================
       RENDER CLIENTS
    ========================================= */

    function renderClients(
      searchTerm = ""
    ) {

      const term =
        searchTerm
          .trim()
          .toLowerCase();


      let filteredClients;


      if (!term) {

        filteredClients =
          allClients;

      } else {

        filteredClients =
          allClients.filter(
            function(client) {

              return (
                (
                  client.name ||
                  ""
                )
                  .toLowerCase()
                  .includes(
                    term
                  )
              );

            }
          );

      }


      if (!term) {

        searchResultCount.textContent =
          allClients.length +
          " client" +
          (
            allClients.length > 1
              ? "s"
              : ""
          );

      } else {

        searchResultCount.textContent =
          filteredClients.length +
          " résultat" +
          (
            filteredClients.length > 1
              ? "s"
              : ""
          );

      }


      if (
        filteredClients.length === 0
      ) {

        if (term) {

          clientsContainer.innerHTML =
            `
            <div class="empty">

              Aucun client trouvé pour

              <strong>
                "${escapeHtml(
                  searchTerm
                )}"
              </strong>

            </div>
            `;

        } else {

          clientsContainer.innerHTML =
            `
            <div class="empty">

              Aucun client pour le moment.

              <br><br>

              Cliquez sur
              « Ajouter un client ».

            </div>
            `;

        }


        return;

      clientsContainer.innerHTML =
        "";


      filteredClients.forEach(

          const card =

            );


          card.className =

              encodeURIComponent(

              ),
              window.location.href
            ).href;

            qrElement,
            {

              width: 220,

              height: 220,

              colorDark:
                "#000000",

              colorLight:
                "#ffffff",

              correctLevel:
                QRCode.CorrectLevel.H

            }
          );


          card
            .querySelector(
              ".qr-edit-button"
            )
            .addEventListener(
              "click",
              function() {

                editDynamicQr(
                  qr.id
                );

              }
            );


          card
            .querySelector(
              ".qr-delete-button"
            )
            .addEventListener(
              "click",
              function() {

                deleteDynamicQr(
                  qr.id,
                  qr.title
                );

              }
            );


          card
            .querySelector(
              ".qr-download-button"
            )
            .addEventListener(
              "click",
              function() {

                downloadDynamicQr(
                  qr.id,
                  qr.title
                );

              }
            );

        }
      );

    }


    /* =========================================
       DOWNLOAD DYNAMIC QR
    ========================================= */

    async function downloadDynamicQr(
      qrId,
      qrTitle
    ) {

      hideError();


      try {

        const qrContainer =
          document.getElementById(
            "qrGenerator"
          );


        qrContainer.innerHTML =
          "";


        /*
          هذا هو الرابط الديناميكي الحقيقي.
          الـQR لا يحتوي على destination مباشرة.
          يحتوي فقط على qr.html?id=...
        */

        const dynamicUrl =
          new URL(
            "qr.html?id=" +
            encodeURIComponent(
              qrId
            ),
            window.location.href
          ).href;


        const qrSize =
          900;


        new QRCode(
          qrContainer,
          {

            text: dynamicUrl,

            width: qrSize,

            height: qrSize,

            colorDark:
              "#000000",

            colorLight:
              "#ffffff",

            correctLevel:
              QRCode.CorrectLevel.H

          }
        );


        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              300
            );

          }
        );


        const qrCanvas =
          qrContainer.querySelector(
            "canvas"
          );


        if (!qrCanvas) {

          throw new Error(
            "Impossible de créer le QR Code."
          );

        }


        const finalCanvas =
          document.createElement(
            "canvas"
          );


        finalCanvas.width =
          1000;


        finalCanvas.height =
          1000;


        const ctx =
          finalCanvas.getContext(
            "2d"
          );


        ctx.fillStyle =
          "#ffffff";


        ctx.fillRect(
          0,
          0,
          1000,
          1000
        );


        ctx.drawImage(
          qrCanvas,

          50,
          50,

          900,
          900
        );


        const displayName =
          String(
            qrTitle ||
            "QR_Code"
          ).trim();


        const safeName =
          displayName
            .replace(
              /[^a-zA-Z0-9À-ÿ_-]+/g,
              "_"
            )
            .replace(
              /^_+|_+$/g,
              ""
            ) ||
          "QR_Code";


        const downloadUrl =
          finalCanvas.toDataURL(
            "image/png"
          );


        const downloadLink =
          document.createElement(
            "a"
          );


        downloadLink.href =
          downloadUrl;


        downloadLink.download =
          "TAPTAPCARD_" +
          safeName +
          "_QR.png";


        document.body.appendChild(
          downloadLink
        );


        downloadLink.click();


        document.body.removeChild(
          downloadLink
        );


        qrContainer.innerHTML =
          "";


      } catch (error) {

        console.error(
          "Download dynamic QR error:",
          error
        );


        const qrContainer =
          document.getElementById(
            "qrGenerator"
          );


        qrContainer.innerHTML =
          "";


        showError(
          error.message ||
          "Impossible de télécharger le QR Code."
        );

      }

    }


    /* =========================================
       CREATE DYNAMIC QR
    ========================================= */

    async function createDynamicQr() {

      hideError();


      const title =
        qrTitleInput.value.trim();


      const destination =
        qrDestinationInput.value.trim();


      const link =
        qrLinkInput.value.trim();


      if (!title) {

        showError(
          "Veuillez saisir un titre pour le QR Code."
        );

        qrTitleInput.focus();

        return;

      }


      if (!destination) {

        showError(
          "Veuillez choisir une destination."
        );

        return;

      }


      if (!link) {

        showError(
          "Veuillez saisir le lien."
        );

        qrLinkInput.focus();

        return;

      }


      generateQrButton.disabled =
        true;


      generateQrButton.textContent =
        "Création...";


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "create_vendor_qr",
          {

            p_session_token:
              vendorSession.session_token,

            p_title:
              title,

            p_destination:
              destination,

            p_link:
              link

          }
        );


      if (error) {

        console.error(
          "Create QR error:",
          error
        );


        generateQrButton.disabled =
          false;


        generateQrButton.textContent =
          "Générer le QR Code";


        showError(
          error.message ||
          "Impossible de créer le QR Code."
        );

        return;

      }


      qrForm.style.display =
        "none";


      qrListSection.style.display =
        "block";


      editingQrId =
        null;


      generateQrButton.disabled =
        false;


      generateQrButton.textContent =
        "Générer le QR Code";


      generateQrButton.onclick =
        createDynamicQr;


      await loadQrCodes();

    }


    /* =========================================
       EDIT DYNAMIC QR
    ========================================= */

    function editDynamicQr(
      qrId
    ) {

      const qr =
        allQrCodes.find(
          function(item) {

            return Number(
              item.id
            ) === Number(
              qrId
            );

          }
        );


      if (!qr) {

        return;

      }


      editingQrId =
        qr.id;


      qrForm.style.display =
        "block";


      qrListSection.style.display =
        "none";


      qrTitleInput.value =
        qr.title || "";


      qrDestinationInput.value =
        qr.destination ||
        "Instagram";


      updateQrInputType();

      qrLinkInput.value =
        qr.link || "";


      generateQrButton.disabled =
        false;


      generateQrButton.textContent =
        "Modifier le QR Code";


      generateQrButton.onclick =
        function() {

          updateDynamicQr(
            qr.id
          );

        };


      qrTitleInput.focus();

    }


    /* =========================================
       UPDATE DYNAMIC QR
    ========================================= */

    async function updateDynamicQr(
      qrId
    ) {

      hideError();


      const title =
        qrTitleInput.value.trim();


      const destination =
        qrDestinationInput.value.trim();


      const link =
        qrLinkInput.value.trim();


      if (!title) {

        showError(
          "Veuillez saisir un titre."
        );

        qrTitleInput.focus();

        return;

      }


      if (!destination) {

        showError(
          "Veuillez choisir une destination."
        );

        return;

      }


      if (!link) {

        showError(
          "Veuillez saisir le lien."
        );

        qrLinkInput.focus();

        return;

      }


      generateQrButton.disabled =
        true;


      generateQrButton.textContent =
        "Modification...";


      const {
        error
      } =
        await supabaseClient.rpc(
          "update_vendor_qr",
          {

            p_session_token:
              vendorSession.session_token,

            p_qr_id:
              qrId,

            p_title:
              title,

            p_destination:
              destination,

            p_link:
              link

          }
        );


      if (error) {

        console.error(
          "Update QR error:",
          error
        );


        generateQrButton.disabled =
          false;


        generateQrButton.textContent =
          "Modifier le QR Code";


        showError(
          error.message ||
          "Impossible de modifier le QR Code."
        );

        return;

      }


      editingQrId =
        null;


      generateQrButton.disabled =
        false;


      generateQrButton.textContent =
        "Générer le QR Code";


      generateQrButton.onclick =
        createDynamicQr;


      await loadQrCodes();


      hideQrForm();

    }


    /* =========================================
       DELETE DYNAMIC QR
    ========================================= */

    async function deleteDynamicQr(
      qrId,
      qrTitle
    ) {

      const confirmed =
        confirm(
          'Supprimer le QR Code "' +
          qrTitle +
          '" ?'
        );


      if (!confirmed) {

        return;

      }


      hideError();


      const {
        error
      } =
        await supabaseClient.rpc(
          "delete_vendor_qr",
          {

            p_session_token:
              vendorSession.session_token,

            p_qr_id:
              qrId

          }
        );


      if (error) {

        console.error(
          "Delete QR error:",
          error
        );


        showError(
          error.message ||
          "Impossible de supprimer le QR Code."
        );

        return;

      }


      await loadQrCodes();

    }


    /* =========================================
       MODALS
    ========================================= */

    deleteModal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          deleteModal
        ) {

          closeDeleteModal();

        }

      }
    );


    confirmModal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          confirmModal
        ) {

          closeConfirmModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeDeleteModal();

          closeConfirmModal();

        }

      }
    );


    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {

      const loginToken =
        sessionStorage.getItem(
          "vendor_login_token"
        );


      localStorage.removeItem(
        "vendor_session"
      );


      if (loginToken) {

        window.location.href =
          "vendor.html?token=" +
          encodeURIComponent(
            loginToken
          );

      } else {

        window.location.href =
          "vendor.html";

      }

    }


    /* =========================================
       INIT
    ========================================= */

    async function init() {

      const valid =
        await verifySession();


      if (!valid) {

        return;

      }


      await loadClients();


      /*
        تحميل عداد QR فقط.
      */

      try {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "get_vendor_qr_count",
            {
              p_session_token:
                vendorSession.session_token
            }
          );


        if (
          !error &&
          data !== null
        ) {

          qrCount.textContent =
            data;

        }

      } catch (error) {

        console.error(
          "QR count error:",
          error
        );

      }

    }


    init();

  </script>
