<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard - TapTapCard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;

      background: #f6f6f7;

      font-family: Arial, sans-serif;

      color: #222;
    }

    .container {
      max-width: 700px;

      margin: auto;
    }

    .header {
      background: white;

      padding: 20px;

      border-radius: 18px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,0.07);

      margin-bottom: 20px;
    }

    .top {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;
    }

    h1 {
      margin: 0;

      font-size: 24px;
    }

    .seller {
      margin-top: 8px;

      color: #777;

      font-size: 14px;
    }

    .logout {
      border: none;

      background: #eee;

      padding: 10px 14px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 13px;
    }

    .count-box {
      margin-top: 20px;

      background: #f4f4f5;

      border-radius: 14px;

      padding: 18px;

      text-align: center;
    }

    .count-label {
      color: #777;

      font-size: 14px;
    }

    .count {
      font-size: 35px;

      font-weight: bold;

      margin-top: 5px;
    }

    .add-button {
      width: 100%;

      margin-top: 15px;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .search-box {
      background: white;

      padding: 15px;

      border-radius: 16px;

      margin-bottom: 15px;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,0.05);
    }

    .search-input {
      width: 100%;

      padding: 13px 15px;

      border:
        1px solid #ddd;

      border-radius: 11px;

      font-size: 15px;

      outline: none;
    }

    .search-input:focus {
      border-color: #222;
    }

    .search-result-count {
      margin-top: 9px;

      font-size: 13px;

      color: #777;
    }

    .client-card {
      background: white;

      border-radius: 16px;

      padding: 15px;

      margin-bottom: 14px;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,0.06);
    }

    .client-top {
      display: flex;

      align-items: center;

      gap: 14px;
    }

    .client-image {
      width: 65px;

      height: 65px;

      border-radius: 50%;

      object-fit: cover;

      background: #eee;

      flex-shrink: 0;
    }

    .client-info {
      min-width: 0;

      flex: 1;
    }

    .client-name-row {
      display: flex;

      align-items: center;

      gap: 10px;

      min-width: 0;
    }

    .client-name {
      font-size: 17px;

      font-weight: bold;

      margin-bottom: 5px;

      word-break: break-word;

      min-width: 0;

      flex: 1;
    }

    .quick-actions {
      display: flex;

      align-items: center;

      gap: 7px;

      flex-shrink: 0;
    }

    .quick-button {
      width: 34px;

      height: 34px;

      border: none;

      border-radius: 9px;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      font-size: 17px;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .quick-button:hover {
      transform:
        translateY(-1px);

      opacity: 0.85;
    }

    .copy-link-button {
      background: #eef2ff;

      color: #3448c5;
    }

    .qr-button {
      background: #f0f0f0;

      color: #222;
    }

    .client-description {
      color: #777;

      font-size: 13px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .actions {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-top: 14px;
    }

    .action-button {
      border: none;

      padding: 11px 5px;

      border-radius: 10px;

      font-size: 13px;

      font-weight: bold;

      cursor: pointer;

      text-decoration: none;

      text-align: center;
    }

    .open-button {
      background: #111;

      color: white;
    }

    .edit-button {
      background: #e9e9eb;

      color: #222;
    }

    .delete-button {
      background: #ffe8e8;

      color: #c62828;
    }

    .action-button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    .empty {
      background: white;

      padding: 30px;

      text-align: center;

      border-radius: 16px;

      color: #777;
    }

    .loading {
      text-align: center;

      color: #777;

      padding: 30px;
    }

    .error {
      background: #fdeaea;

      color: #b42318;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 15px;

      display: none;

      word-break: break-word;
    }

    .confirm-modal,
    .delete-modal {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.45);

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 10000;

      backdrop-filter: blur(4px);
    }

    .confirm-modal.show,
    .delete-modal.show {
      display: flex;
    }

    .confirm-box,
    .delete-box {
      width: 100%;

      max-width: 390px;

      background: white;

      border-radius: 20px;

      padding: 24px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,0.20);

      text-align: center;

      animation:
        modalIn 0.18s ease;
    }

    @keyframes modalIn {

      from {
        opacity: 0;

        transform:
          scale(0.94);
      }

      to {
        opacity: 1;

        transform:
          scale(1);
      }

    }

    .confirm-icon,
    .delete-icon {
      width: 55px;

      height: 55px;

      margin:
        0 auto 15px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 25px;
    }

    .confirm-icon {
      background: #f1f3f5;
    }

    .delete-icon {
      background: #ffe8e8;
    }

    .confirm-title,
    .delete-title {
      font-size: 19px;

      font-weight: bold;

      margin-bottom: 10px;
    }

    .confirm-text,
    .delete-text {
      color: #777;

      font-size: 14px;

      line-height: 1.5;

      margin-bottom: 20px;
    }

    .confirm-client-name,
    .delete-client-name {
      color: #222;

      font-weight: bold;
    }

    .confirm-actions,
    .delete-actions {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;
    }

    .modal-button {
      border: none;

      padding: 13px;

      border-radius: 11px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;
    }

    .cancel-confirm,
    .cancel-delete {
      background: #eee;

      color: #222;
    }

    .confirm-action {
      background: #111;

      color: white;
    }

    .confirm-delete {
      background: #d32f2f;

      color: white;
    }

    .modal-button:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    #qrGenerator {
      position: absolute;

      left: -99999px;

      top: -99999px;

      width: 900px;

      height: 900px;

      background: white;
    }

    @media (max-width: 420px) {

      .actions {
        grid-template-columns: 1fr;
      }

      .top {
        align-items: flex-start;
      }

      .logout {
        padding:
          9px 10px;
      }

      .client-name-row {
        gap: 7px;
      }

      .quick-actions {
        gap: 5px;
      }

      .quick-button {
        width: 32px;

        height: 32px;

        font-size: 16px;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <div
      id="errorMessage"
      class="error"
    ></div>


    <div class="header">

      <div class="top">

        <div>

          <h1>
            Mon Dashboard
          </h1>

          <div
            class="seller"
            id="sellerName"
          >
            Chargement...
          </div>

        </div>


        <button
          class="logout"
          onclick="logout()"
        >
          Déconnexion
        </button>

      </div>


      <div class="count-box">

        <div class="count-label">
          Mes clients
        </div>

        <div
          class="count"
          id="clientCount"
        >
          0
        </div>

      </div>


      <button
        class="add-button"
        onclick="addClient()"
      >
        + Ajouter un client
      </button>

    </div>


    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="🔎 Rechercher un client..."
        autocomplete="off"
      >

      <div
        id="searchResultCount"
        class="search-result-count"
      >
        Tous les clients
      </div>

    </div>


    <div id="clientsContainer">

      <div class="loading">
        Chargement des clients...
      </div>

    </div>

  </div>


  <!-- CONFIRM -->

  <div
    id="confirmModal"
    class="confirm-modal"
  >

    <div class="confirm-box">

      <div
        id="confirmIcon"
        class="confirm-icon"
      >
        🔗
      </div>

      <div
        id="confirmTitle"
        class="confirm-title"
      >
        Copier le lien ?
      </div>

      <div class="confirm-text">

        Voulez-vous copier le lien de

        <span
          id="confirmClientName"
          class="confirm-client-name"
        ></span>

        ?

      </div>

      <div class="confirm-actions">

        <button
          id="cancelConfirmButton"
          class="modal-button cancel-confirm"
          onclick="closeConfirmModal()"
        >
          Annuler
        </button>

        <button
          id="confirmActionButton"
          class="modal-button confirm-action"
          onclick="confirmAction()"
        >
          Confirmer
        </button>

      </div>

    </div>

  </div>


  <!-- DELETE -->

  <div
    id="deleteModal"
    class="delete-modal"
  >

    <div class="delete-box">

      <div class="delete-icon">
        🗑️
      </div>

      <div class="delete-title">
        Supprimer le client ?
      </div>

      <div class="delete-text">

        Voulez-vous vraiment supprimer

        <span
          id="deleteClientName"
          class="delete-client-name"
        ></span>

        ?

        <br>

        Cette action est irréversible.

      </div>

      <div class="delete-actions">

        <button
          id="cancelDeleteButton"
          class="modal-button cancel-delete"
          onclick="closeDeleteModal()"
        >
          Annuler
        </button>

        <button
          id="confirmDeleteButton"
          class="modal-button confirm-delete"
          onclick="confirmDelete()"
        >
          Supprimer
        </button>

      </div>

    </div>

  </div>


  <div id="qrGenerator"></div>


  <script src="supabase.js"></script>


  <script>

    /* =========================================
       TOKEN FROM URL
    ========================================= */

    const dashboardParams =
      new URLSearchParams(
        window.location.search
      );


    const urlLoginToken =
      dashboardParams.get(
        "token"
      );


    /*
      إذا جاء token من vendor.html
      نحفظه في sessionStorage.
    */

    if (urlLoginToken) {

      sessionStorage.setItem(
        "vendor_login_token",
        urlLoginToken
      );

    }


    /* =========================================
       SESSION
    ========================================= */

    const sessionData =
      localStorage.getItem(
        "vendor_session"
      );


    if (!sessionData) {

      window.location.href =
        urlLoginToken
          ? "vendor.html?token=" +
            encodeURIComponent(
              urlLoginToken
            )
          : "vendor.html";

    }


    let vendorSession;


    try {

      vendorSession =
        JSON.parse(
          sessionData
        );

    } catch (error) {

      localStorage.removeItem(
        "vendor_session"
      );


      window.location.href =
        urlLoginToken
          ? "vendor.html?token=" +
            encodeURIComponent(
              urlLoginToken
            )
          : "vendor.html";

    }


    /* =========================================
       ELEMENTS
    ========================================= */

    const sellerName =
      document.getElementById(
        "sellerName"
      );


    const clientCount =
      document.getElementById(
        "clientCount"
      );


    const clientsContainer =
      document.getElementById(
        "clientsContainer"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const searchInput =
      document.getElementById(
        "searchInput"
      );


    const searchResultCount =
      document.getElementById(
        "searchResultCount"
      );


    const confirmModal =
      document.getElementById(
        "confirmModal"
      );


    const confirmIcon =
      document.getElementById(
        "confirmIcon"
      );


    const confirmTitle =
      document.getElementById(
        "confirmTitle"
      );


    const confirmClientName =
      document.getElementById(
        "confirmClientName"
      );


    const confirmActionButton =
      document.getElementById(
        "confirmActionButton"
      );


    const cancelConfirmButton =
      document.getElementById(
        "cancelConfirmButton"
      );


    const deleteModal =
      document.getElementById(
        "deleteModal"
      );


    const deleteClientName =
      document.getElementById(
        "deleteClientName"
      );


    const confirmDeleteButton =
      document.getElementById(
        "confirmDeleteButton"
      );


    const cancelDeleteButton =
      document.getElementById(
        "cancelDeleteButton"
      );


    /* =========================================
       DATA
    ========================================= */

    let allClients = [];

    let clientToDelete = null;

    let confirmActionType = null;

    let clientForAction = null;


    /* =========================================
       ERROR
    ========================================= */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

    }


    function hideError() {

      errorMessage.style.display =
        "none";

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================================
       VERIFY SESSION
    ========================================= */

    async function verifySession() {

      if (
        !vendorSession ||
        !vendorSession.session_token
      ) {

        window.location.href =
          "vendor.html";

        return false;

      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "verify_vendor_session",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (
        error ||
        !data ||
        data.length === 0
      ) {

        localStorage.removeItem(
          "vendor_session"
        );


        const loginToken =
          sessionStorage.getItem(
            "vendor_login_token"
          );


        window.location.href =
          loginToken
            ? "vendor.html?token=" +
              encodeURIComponent(
                loginToken
              )
            : "vendor.html";


        return false;

      }


      sellerName.textContent =
        "Vendeur : " +
        data[0].vendor_name;


      return true;

    }


    /* =========================================
       ADD CLIENT
    ========================================= */

    function addClient() {

      window.location.href =
        "vendor-add-client.html";

    }


    /* =========================================
       CLIENT URL
    ========================================= */

    function getClientUrl(
      clientId
    ) {

      return new URL(
        "client.html?id=" +
        encodeURIComponent(
          clientId
        ),
        window.location.href
      ).href;

    }


    /* =========================================
       OPEN CLIENT
    ========================================= */

    function openClient(
      clientId
    ) {

      window.open(
        getClientUrl(
          clientId
        ),
        "_blank"
      );

    }


    /* =========================================
       COPY
    ========================================= */

    function askCopyLink(
      clientId,
      clientName
    ) {

      clientForAction = {

        id: clientId,

        name:
          clientName ||
          "ce client"

      };


      confirmActionType =
        "copy";


      confirmIcon.textContent =
        "🔗";


      confirmTitle.textContent =
        "Copier le lien ?";


      confirmClientName.textContent =
        clientForAction.name;


      confirmActionButton.textContent =
        "Copier";


      confirmActionButton.disabled =
        false;


      cancelConfirmButton.disabled =
        false;


      confirmModal.classList.add(
        "show"
      );

    }


    /* =========================================
       QR
    ========================================= */

    function askDownloadQr(
      clientId,
      clientName
    ) {

      clientForAction = {

        id: clientId,

        name:
          clientName ||
          "ce client"

      };


      confirmActionType =
        "qr";


      confirmIcon.textContent =
        "▣";


      confirmTitle.textContent =
        "Télécharger le QR Code ?";


      confirmClientName.textContent =
        clientForAction.name;


      confirmActionButton.textContent =
        "Télécharger";


      confirmActionButton.disabled =
        false;


      cancelConfirmButton.disabled =
        false;


      confirmModal.classList.add(
        "show"
      );

    }


    function closeConfirmModal() {

      confirmModal.classList.remove(
        "show"
      );


      clientForAction =
        null;


      confirmActionType =
        null;

    }


    /* =========================================
       CONFIRM ACTION
    ========================================= */

    async function confirmAction() {

      if (
        !clientForAction ||
        !confirmActionType
      ) {

        return;

      }


      confirmActionButton.disabled =
        true;


      cancelConfirmButton.disabled =
        true;


      try {

        if (
          confirmActionType ===
          "copy"
        ) {

          confirmActionButton.textContent =
            "Copie...";


          await copyClientLink(
            clientForAction.id
          );


          confirmActionButton.textContent =
            "Copié ✓";


          setTimeout(
            function() {

              closeConfirmModal();

            },
            700
          );

        }


        if (
          confirmActionType ===
          "qr"
        ) {

          confirmActionButton.textContent =
            "Création...";


          await downloadClientQr(
            clientForAction.id,
            clientForAction.name
          );


          confirmActionButton.textContent =
            "Téléchargé ✓";


          setTimeout(
            function() {

              closeConfirmModal();

            },
            700
          );

        }

      } catch (error) {

        console.error(
          error
        );


        confirmActionButton.disabled =
          false;


        cancelConfirmButton.disabled =
          false;


        confirmActionButton.textContent =
          "Réessayer";


        showError(
          error.message ||
          "Une erreur est survenue."
        );

      }

    }


    /* =========================================
       COPY LINK
    ========================================= */

    async function copyClientLink(
      clientId
    ) {

      const url =
        getClientUrl(
          clientId
        );


      if (
        navigator.clipboard &&
        navigator.clipboard.writeText
      ) {

        await navigator.clipboard.writeText(
          url
        );

        return;

      }


      const textarea =
        document.createElement(
          "textarea"
        );


      textarea.value =
        url;


      textarea.style.position =
        "fixed";


      textarea.style.opacity =
        "0";


      document.body.appendChild(
        textarea
      );


      textarea.focus();


      textarea.select();


      const success =
        document.execCommand(
          "copy"
        );


      document.body.removeChild(
        textarea
      );


      if (!success) {

        throw new Error(
          "Impossible de copier le lien."
        );

      }

    }


    /* =========================================
       QR DOWNLOAD
    ========================================= */

    async function downloadClientQr(
      clientId,
      clientName
    ) {

      const qrContainer =
        document.getElementById(
          "qrGenerator"
        );


      qrContainer.innerHTML =
        "";


      const url =
        getClientUrl(
          clientId
        );


      const qrSize =
        900;


      new QRCode(
        qrContainer,
        {

          text: url,

          width: qrSize,

          height: qrSize,

          colorDark:
            "#000000",

          colorLight:
            "#ffffff",

          correctLevel:
            QRCode.CorrectLevel.H

        }
      );


      await new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            300
          );

        }
      );


      const qrCanvas =
        qrContainer.querySelector(
          "canvas"
        );


      if (!qrCanvas) {

        throw new Error(
          "Impossible de créer le QR Code."
        );

      }


      const finalCanvas =
        document.createElement(
          "canvas"
        );


      finalCanvas.width =
        1000;


      finalCanvas.height =
        1000;


      const ctx =
        finalCanvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        1000,
        1000
      );


      const qrPosition =
        50;


      const qrFinalSize =
        900;


      ctx.drawImage(
        qrCanvas,

        qrPosition,
        qrPosition,

        qrFinalSize,
        qrFinalSize
      );


      const displayName =
        String(
          clientName ||
          "client"
        ).trim();


      const safeName =
        displayName
          .replace(
            /[^a-zA-Z0-9À-ÿ_-]+/g,
            "_"
          )
          .replace(
            /^_+|_+$/g,
            ""
          ) ||
        "client";


      const downloadUrl =
        finalCanvas.toDataURL(
          "image/png"
        );


      const downloadLink =
        document.createElement(
          "a"
        );


      downloadLink.href =
        downloadUrl;


      downloadLink.download =
        "TAPTAPCARD_" +
        safeName +
        "_QR.png";


      document.body.appendChild(
        downloadLink
      );


      downloadLink.click();


      document.body.removeChild(
        downloadLink
      );


      qrContainer.innerHTML =
        "";

    }


    /* =========================================
       EDIT
    ========================================= */

    function editClient(
      clientId
    ) {

      window.location.href =
        "vendor-edit-client.html?id=" +
        encodeURIComponent(
          clientId
        );

    }


    /* =========================================
       DELETE
    ========================================= */

    function deleteClient(
      clientId,
      clientName
    ) {

      clientToDelete = {

        id: clientId,

        name:
          clientName ||
          "ce client"

      };


      deleteClientName.textContent =
        clientToDelete.name;


      confirmDeleteButton.disabled =
        false;


      cancelDeleteButton.disabled =
        false;


      confirmDeleteButton.textContent =
        "Supprimer";


      deleteModal.classList.add(
        "show"
      );

    }


    function closeDeleteModal() {

      deleteModal.classList.remove(
        "show"
      );


      clientToDelete =
        null;

    }


    /* =========================================
       CONFIRM DELETE
    ========================================= */

    async function confirmDelete() {

      if (!clientToDelete) {

        return;

      }


      hideError();


      const id =
        clientToDelete.id;


      confirmDeleteButton.disabled =
        true;


      cancelDeleteButton.disabled =
        true;


      confirmDeleteButton.textContent =
        "Suppression...";


      try {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "delete_vendor_client",
            {

              p_session_token:
                vendorSession.session_token,

              p_client_id:
                id

            }
          );


        if (error) {

          console.error(
            "Delete error:",
            error
          );


          throw new Error(
            error.message ||
            "Impossible de supprimer le client."
          );

        }


        allClients =
          allClients.filter(
            function(client) {

              return Number(
                client.id
              ) !==
              Number(
                id
              );

            }
          );


        clientCount.textContent =
          allClients.length;


        renderClients(
          searchInput.value
        );


        closeDeleteModal();

      } catch (error) {

        console.error(
          error
        );


        closeDeleteModal();


        showError(
          "Erreur lors de la suppression : " +
          error.message
        );

      }

    }


    /* =========================================
       MODALS
    ========================================= */

    deleteModal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          deleteModal
        ) {

          closeDeleteModal();

        }

      }
    );


    confirmModal.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          confirmModal
        ) {

          closeConfirmModal();

        }

      }
    );


    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Escape"
        ) {

          closeDeleteModal();

          closeConfirmModal();

        }

      }
    );


    /* =========================================
       LOAD CLIENTS
    ========================================= */

    async function loadClients() {

      hideError();


      clientsContainer.innerHTML =
        `
        <div class="loading">
          Chargement des clients...
        </div>
        `;


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_vendor_clients",
          {

            p_session_token:
              vendorSession.session_token

          }
        );


      if (error) {

        console.error(
          "Load clients error:",
          error
        );


        showError(
          error.message ||
          "Impossible de charger les clients."
        );


        clientsContainer.innerHTML =
          `
          <div class="empty">
            Impossible de charger les clients.
          </div>
          `;


        return;

      }


      allClients =
        data || [];


      clientCount.textContent =
        allClients.length;


      renderClients(
        searchInput.value
      );

    }


    /* =========================================
       RENDER CLIENTS
    ========================================= */

    function renderClients(
      searchTerm = ""
    ) {

      const term =
        searchTerm
          .trim()
          .toLowerCase();


      let filteredClients;


      if (!term) {

        filteredClients =
          allClients;

      } else {

        filteredClients =
          allClients.filter(
            function(client) {

              return (
                (
                  client.name ||
                  ""
                )
                  .toLowerCase()
                  .includes(
                    term
                  )
              );

            }
          );

      }


      if (!term) {

        searchResultCount.textContent =
          allClients.length +
          " client" +
          (
            allClients.length > 1
              ? "s"
              : ""
          );

      } else {

        searchResultCount.textContent =
          filteredClients.length +
          " résultat" +
          (
            filteredClients.length > 1
              ? "s"
              : ""
          );

      }


      if (
        filteredClients.length === 0
      ) {

        if (term) {

          clientsContainer.innerHTML =
            `
            <div class="empty">

              Aucun client trouvé pour

              <strong>
                "${escapeHtml(
                  searchTerm
                )}"
              </strong>

            </div>
            `;

        } else {

          clientsContainer.innerHTML =
            `
            <div class="empty">

              Aucun client pour le moment.

              <br><br>

              Cliquez sur
              « Ajouter un client ».

            </div>
            `;

        }


        return;

      }


      clientsContainer.innerHTML =
        "";


      filteredClients.forEach(
        function(client) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "client-card";


          const image =
            client.profile_image &&
            client.profile_image.trim() !== ""

              ? client.profile_image

              : "https://placehold.co/150x150?text=Client";


          const description =
            client.description ||
            "Aucune description";


          card.innerHTML =
            `
            <div class="client-top">

              <img
                class="client-image"
                src="${escapeHtml(
                  image
                )}"
                alt=""
                onerror="this.src='https://placehold.co/150x150?text=Client'"
              >

              <div class="client-info">

                <div class="client-name-row">

                  <div class="client-name">

                    ${escapeHtml(
                      client.name ||
                      "Sans nom"
                    )}

                  </div>

                  <div class="quick-actions">

                    <button
                      class="quick-button copy-link-button"
                      data-action="copy-link"
                      title="Copier le lien"
                      aria-label="Copier le lien"
                    >
                      🔗
                    </button>

                    <button
                      class="quick-button qr-button"
                      data-action="download-qr"
                      title="Télécharger le QR Code"
                      aria-label="Télécharger le QR Code"
                    >
                      ▣
                    </button>

                  </div>

                </div>

                <div class="client-description">

                  ${escapeHtml(
                    description
                  )}

                </div>

              </div>

            </div>

            <div class="actions">

              <button
                class="action-button open-button"
                data-action="open"
              >
                Ouvrir
              </button>

              <button
                class="action-button edit-button"
                data-action="edit"
              >
                Modifier
              </button>

              <button
                class="action-button delete-button"
                data-action="delete"
              >
                Supprimer
              </button>

            </div>
            `;


          card
            .querySelector(
              '[data-action="copy-link"]'
            )
            .addEventListener(
              "click",
              function() {

                askCopyLink(
                  client.id,
                  client.name
                );

              }
            );


          card
            .querySelector(
              '[data-action="download-qr"]'
            )
            .addEventListener(
              "click",
              function() {

                askDownloadQr(
                  client.id,
                  client.name
                );

              }
            );


          card
            .querySelector(
              '[data-action="open"]'
            )
            .addEventListener(
              "click",
              function() {

                openClient(
                  client.id
                );

              }
            );


          card
            .querySelector(
              '[data-action="edit"]'
            )
            .addEventListener(
              "click",
              function() {

                editClient(
                  client.id
                );

              }
            );


          card
            .querySelector(
              '[data-action="delete"]'
            )
            .addEventListener(
              "click",
              function() {

                deleteClient(
                  client.id,
                  client.name ||
                  "ce client"
                );

              }
            );


          clientsContainer.appendChild(
            card
          );

        }
      );

    }


    /* =========================================
       SEARCH
    ========================================= */

    searchInput.addEventListener(
      "input",
      function() {

        renderClients(
          searchInput.value
        );

      }
    );


    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {

      const loginToken =
        sessionStorage.getItem(
          "vendor_login_token"
        );


      localStorage.removeItem(
        "vendor_session"
      );


      if (loginToken) {

        window.location.href =
          "vendor.html?token=" +
          encodeURIComponent(
            loginToken
          );

      } else {

        window.location.href =
          "vendor.html";

      }

    }


    /* =========================================
       INIT
    ========================================= */

    async function init() {

      const valid =
        await verifySession();


      if (!valid) {

        return;

      }


      await loadClients();

    }


    init();

  </script>

</body>

</html>
