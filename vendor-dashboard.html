<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - TapTapCard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f6f6f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .seller {
      margin-top: 8px;
      color: #777;
      font-size: 14px;
    }

    .count-box {
      margin-top: 20px;
      background: #f4f4f5;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .count-label {
      color: #777;
      font-size: 14px;
    }

    .count {
      font-size: 35px;
      font-weight: bold;
      margin-top: 5px;
    }

    .add-button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout {
      border: none;
      background: #eee;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .client-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .client-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .client-image {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .client-info {
      min-width: 0;
      flex: 1;
    }

    .client-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .client-description {
      color: #777;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .action-button {
      border: none;
      padding: 11px 5px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .open-button {
      background: #111;
      color: white;
    }

    .edit-button {
      background: #e9e9eb;
      color: #222;
    }

    .delete-button {
      background: #ffe8e8;
      color: #c62828;
    }

    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 16px;
      color: #777;
    }

    .error {
      background: #fdeaea;
      color: #b42318;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 420px) {

      .actions {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <div id="errorMessage" class="error"></div>

    <div class="header">

      <div class="top">

        <div>
          <h1>Mon Dashboard</h1>

          <div class="seller" id="sellerName">
            Chargement...
          </div>
        </div>

        <button
          class="logout"
          onclick="logout()"
        >
          Déconnexion
        </button>

      </div>


      <div class="count-box">

        <div class="count-label">
          Mes clients
        </div>

        <div
          class="count"
          id="clientCount"
        >
          0
        </div>

      </div>


      <button
        class="add-button"
        onclick="addClient()"
      >
        + Ajouter un client
      </button>

    </div>


    <div id="clientsContainer">

      <div class="loading">
        Chargement des clients...
      </div>

    </div>

  </div>


  <script src="supabase.js"></script>

  <script>

    /*
      RÉCUPÉRER LA SESSION
    */

    const sessionData =
      localStorage.getItem("vendor_session");


    if (!sessionData) {

      window.location.href =
        "vendor.html";

    }


    let vendorSession;


    try {

      vendorSession =
        JSON.parse(sessionData);

    } catch (error) {

      localStorage.removeItem(
        "vendor_session"
      );

      window.location.href =
        "vendor.html";

    }


    /*
      ÉLÉMENTS
    */

    const sellerName =
      document.getElementById(
        "sellerName"
      );

    const clientCount =
      document.getElementById(
        "clientCount"
      );

    const clientsContainer =
      document.getElementById(
        "clientsContainer"
      );

    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    /*
      MESSAGE ERREUR
    */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";
    }


    /*
      VÉRIFIER SESSION
    */

    async function verifySession() {

      if (
        !vendorSession ||
        !vendorSession.session_token
      ) {

        window.location.href =
          "vendor.html";

        return false;
      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "verify_vendor_session",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (
        error ||
        !data ||
        data.length === 0
      ) {

        localStorage.removeItem(
          "vendor_session"
        );

        window.location.href =
          "vendor.html";

        return false;
      }


      sellerName.textContent =
        "Vendeur : " +
        data[0].vendor_name;


      return true;
    }


    /*
      AJOUTER CLIENT
    */

    function addClient() {

      window.location.href =
        "vendor-add-client.html";
    }


    /*
      OUVRIR CLIENT
    */

    function openClient(client) {

      /*
        لاحقاً نربط هنا رابط الصفحة
        العامة الخاصة بالعميل.

        حالياً نستخدم صفحة مؤقتة
        حسب ID العميل.
      */

      window.open(
        "client.html?id=" +
        encodeURIComponent(client.id),
        "_blank"
      );
    }


    /*
      MODIFIER CLIENT
    */

    function editClient(clientId) {

      window.location.href =
        "vendor-edit-client.html?id=" +
        encodeURIComponent(clientId);
    }


    /*
      SUPPRIMER CLIENT
    */

    async function deleteClient(
      clientId,
      clientName
    ) {

      const confirmed =
        confirm(
          'Voulez-vous vraiment supprimer "' +
          clientName +
          '" ?\n\nCette action est irréversible.'
        );


      if (!confirmed) {

        return;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "delete_vendor_client",
            {
              p_session_token:
                vendorSession.session_token,

              p_client_id:
                clientId
            }
          );


        if (error) {

          console.error(error);

          showError(
            error.message ||
            "Impossible de supprimer le client."
          );

          return;
        }


        /*
          إعادة تحميل القائمة
        */

        await loadClients();


      } catch (error) {

        console.error(error);

        showError(
          "Une erreur est survenue lors de la suppression."
        );
      }
    }


    /*
      CHARGER CLIENTS
    */

    async function loadClients() {

      clientsContainer.innerHTML =
        '<div class="loading">Chargement des clients...</div>';


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_vendor_clients",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (error) {

        console.error(error);

        showError(
          error.message ||
          "Impossible de charger les clients."
        );

        clientsContainer.innerHTML =
          '<div class="empty">Impossible de charger les clients.</div>';

        return;
      }


      clientCount.textContent =
        data ? data.length : 0;


      if (
        !data ||
        data.length === 0
      ) {

        clientsContainer.innerHTML =
          `
          <div class="empty">
            Aucun client pour le moment.
            <br><br>
            Cliquez sur « Ajouter un client ».
          </div>
          `;

        return;
      }


      clientsContainer.innerHTML =
        "";


      data.forEach(
        function(client) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "client-card";


          /*
            Image
          */

          const image =
            client.profile_image &&
            client.profile_image.trim() !== ""
              ? client.profile_image
              : "https://placehold.co/150x150?text=Client";


          /*
            Description
          */

          const description =
            client.description ||
            "Aucune description";


          card.innerHTML =
            `
            <div class="client-top">

              <img
                class="client-image"
                src="${escapeHtml(image)}"
                alt=""
                onerror="this.src='https://placehold.co/150x150?text=Client'"
              >

              <div class="client-info">

                <div class="client-name">
                  ${escapeHtml(client.name || "Sans nom")}
                </div>

                <div class="client-description">
                  ${escapeHtml(description)}
                </div>

              </div>

            </div>


            <div class="actions">

              <button
                class="action-button open-button"
                onclick="openClient(${JSON.stringify(client)})"
              >
                Ouvrir
              </button>


              <button
                class="action-button edit-button"
                onclick="editClient(${client.id})"
              >
                Modifier
              </button>


              <button
                class="action-button delete-button"
                onclick="deleteClient(
                  ${client.id},
                  ${JSON.stringify(client.name || "ce client")}
                )"
              >
                Supprimer
              </button>

            </div>
            `;


          clientsContainer.appendChild(
            card
          );

        }
      );
    }


    /*
      PROTECTION HTML
    */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /*
      DÉCONNEXION
    */

    function logout() {

      localStorage.removeItem(
        "vendor_session"
      );

      window.location.href =
        "vendor.html";
    }


    /*
      INITIALISATION
    */

    async function init() {

      const valid =
        await verifySession();


      if (!valid) {

        return;
      }


      await loadClients();
    }


    init();

  </script>

</body>
</html>
