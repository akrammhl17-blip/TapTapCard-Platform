<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon Dashboard - TAPTAPCARD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .header {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
    }

    .logout-btn {
      border: none;
      background: #f1f1f1;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .logout-btn:hover {
      background: #e6e6e6;
    }

    .vendor-name {
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .stat-box {
      background: #f8f8f8;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid #eee;
    }

    .stat-label {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: 700;
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .add-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 13px 12px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .add-btn:hover {
      opacity: 0.9;
    }

    .qr-add-btn {
      background: #315efb;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }

    .search-box input {
      width: 100%;
      border: 1px solid #ddd;
      padding: 12px;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .search-box input:focus {
      border-color: #888;
    }

    /* =========================
       CLIENT CARDS
    ========================= */

    .client-card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
    }

    .client-top {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 12px;
    }

    .client-image {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .client-info {
      min-width: 0;
    }

    .client-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .client-description {
      font-size: 13px;
      color: #777;
      line-height: 1.4;
    }

    .client-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .client-actions button,
    .client-actions a {
      text-decoration: none;
      border: none;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      cursor: pointer;
    }

    .open-btn {
      background: #111;
      color: white;
    }

    .edit-btn {
      background: #e9eefc;
      color: #315efb;
    }

    .delete-btn {
      background: #ffe8e8;
      color: #d93025;
    }

    .copy-btn {
      background: #eef7ee;
      color: #218739;
    }

    .qr-btn {
      background: #f0ecff;
      color: #6c45d8;
    }

    /* =========================
       QR VIEW
    ========================= */

    #qrView {
      display: none;
    }

    .back-link {
      display: inline-block;
      color: #315efb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .qr-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .form-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: #444;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      background: white;
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #315efb;
    }

    .generate-btn {
      width: 100%;
      border: none;
      background: #315efb;
      color: white;
      padding: 13px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .qr-list-title {
      font-size: 19px;
      font-weight: 700;
      margin: 20px 0 12px;
    }

    .qr-card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    }

    .qr-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .qr-card-name {
      font-size: 16px;
      font-weight: 700;
    }

    .qr-destination {
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }

    .qr-link {
      font-size: 12px;
      color: #315efb;
      word-break: break-all;
      background: #f7f7f7;
      padding: 9px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .qr-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
    }

    .qr-card-actions button {
      border: none;
      padding: 9px 5px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
    }

    .download-qr {
      background: #eeeaff;
      color: #6341d8;
    }

    .copy-qr {
      background: #eaf7ed;
      color: #218739;
    }

    .delete-qr {
      background: #ffe9e9;
      color: #d93025;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-content {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .modal-text {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-buttons button {
      border: none;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #eee;
    }

    .confirm-btn {
      background: #111;
      color: white;
    }

    .danger-confirm {
      background: #d93025;
      color: white;
    }

    /* hidden QR generator */
    #qrGenerator {
      position: absolute;
      left: -99999px;
      top: -99999px;
    }

    @media (max-width: 550px) {

      .container {
        padding: 12px;
      }

      .header {
        padding: 16px;
      }

      .actions-row {
        grid-template-columns: 1fr;
      }

      .top-header {
        align-items: flex-start;
      }

      .title {
        font-size: 22px;
      }

      .qr-card-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- =========================
       HEADER
  ========================== -->

  <div class="header">

    <div class="top-header">

      <div class="title">
        Mon Dashboard
      </div>

      <button class="logout-btn" onclick="logout()">
        Déconnexion
      </button>

    </div>

    <div class="vendor-name">
      Vendeur: <strong id="vendorName">...</strong>
    </div>

    <!-- STATS -->

    <div class="stats">

      <div class="stat-box">
        <div class="stat-label">
          Mes clients
        </div>

        <div class="stat-number" id="clientCount">
          0
        </div>
      </div>

      <div class="stat-box">
        <div class="stat-label">
          QR Codes
        </div>

        <div class="stat-number" id="qrCount">
          0
        </div>
      </div>

    </div>

    <!-- TWO BUTTONS -->

    <div class="actions-row">

      <button
        class="add-btn"
        onclick="window.location.href='vendor-add-client.html'"
      >
        + Ajouter un client
      </button>

      <button
        class="add-btn qr-add-btn"
        onclick="showQrView()"
      >
        + Ajouter QR Code
      </button>

    </div>

  </div>


  <!-- =========================
       CLIENT VIEW
  ========================== -->

  <div id="clientView">

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Rechercher un client..."
        oninput="filterClients()"
      >

    </div>

    <div id="clientsContainer">

      <div class="loading">
        Chargement...
      </div>

    </div>

  </div>


  <!-- =========================
       QR VIEW
  ========================== -->

  <div id="qrView">

    <a
      class="back-link"
      onclick="showClientView()"
    >
      ← Retour à mes clients
    </a>

    <div class="qr-title">
      QR CODE DYNAMIQUE
    </div>


    <!-- ADD QR FORM -->

    <div class="form-card">

      <div class="form-group">

        <label for="qrTitle">
          Titre du QR Code
        </label>

        <input
          type="text"
          id="qrTitle"
          placeholder="Instagram Boutique"
          autocomplete="off"
        >

      </div>


      <div class="form-group">

        <label for="qrDestination">
          Destination
        </label>

        <select
          id="qrDestination"
          onchange="updateQrInput()"
        >

          <option value="instagram">
            Instagram
          </option>

          <option value="facebook">
            Facebook
          </option>

          <option value="tiktok">
            TikTok
          </option>

          <option value="snapchat">
            Snapchat
          </option>

          <option value="website">
            Website
          </option>

          <option value="phone">
            Téléphone
          </option>

          <option value="whatsapp">
            WhatsApp
          </option>

        </select>

      </div>


      <div class="form-group">

        <label id="qrLinkLabel" for="qrLink">
          Lien
        </label>

        <input
          type="url"
          id="qrLink"
          placeholder="https://instagram.com/..."
          autocomplete="off"
        >

      </div>


      <button
        class="generate-btn"
        id="generateQrBtn"
        onclick="createDynamicQr()"
      >
        Générer le QR Code
      </button>

    </div>


    <!-- QR LIST -->

    <div class="qr-list-title">
      Mes QR Codes
    </div>

    <div id="qrList">

      <div class="loading">
        Chargement...
      </div>

    </div>

  </div>

</div>


<!-- =========================
     CONFIRM MODAL
========================== -->

<div class="modal" id="confirmModal">

  <div class="modal-content">

    <div class="modal-title" id="modalTitle">
      Confirmation
    </div>

    <div class="modal-text" id="modalText">
      Êtes-vous sûr ?
    </div>

    <div class="modal-buttons">

      <button
        class="cancel-btn"
        onclick="closeModal()"
      >
        Annuler
      </button>

      <button
        class="confirm-btn"
        id="confirmActionBtn"
      >
        Confirmer
      </button>

    </div>

  </div>

</div>


<!-- =========================
     HIDDEN QR GENERATOR
========================== -->

<div id="qrGenerator"></div>


<script src="supabase.js"></script>


<script>

  /* =====================================================
     VARIABLES
  ===================================================== */

  let sessionToken = null;

  let vendorId = null;

  let vendorName = "";

  let clients = [];

  let qrCodes = [];

  let pendingAction = null;


  /* =====================================================
     READ TOKEN
  ===================================================== */

  const params = new URLSearchParams(
    window.location.search
  );

  const urlToken = params.get("token");


  if (urlToken) {

    sessionStorage.setItem(
      "vendor_login_token",
      urlToken
    );

  }


  /* =====================================================
     GET SESSION
  ===================================================== */

  sessionToken =
    localStorage.getItem("vendor_session");


  if (!sessionToken) {

    const token =
      sessionStorage.getItem(
        "vendor_login_token"
      );

    if (token) {

      window.location.href =
        "vendor.html?token=" +
        encodeURIComponent(token);

    } else {

      window.location.href =
        "vendor.html";

    }

  }


  /* =====================================================
     VERIFY SESSION
  ===================================================== */

  async function verifySession() {

    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "verify_vendor_session",
        {
          p_session_token: sessionToken
        }
      );


      if (error) {

        console.error(error);

        redirectToLogin();

        return false;

      }


      if (
        !data ||
        data.length === 0
      ) {

        redirectToLogin();

        return false;

      }


      vendorId =
        data[0].vendor_id;

      vendorName =
        data[0].vendor_name;

      document.getElementById(
        "vendorName"
      ).textContent =
        vendorName || "Vendeur";


      return true;

    } catch (error) {

      console.error(error);

      redirectToLogin();

      return false;

    }

  }


  /* =====================================================
     REDIRECT LOGIN
  ===================================================== */

  function redirectToLogin() {

    localStorage.removeItem(
      "vendor_session"
    );

    const token =
      sessionStorage.getItem(
        "vendor_login_token"
      );

    if (token) {

      window.location.href =
        "vendor.html?token=" +
        encodeURIComponent(token);

    } else {

      window.location.href =
        "vendor.html";

    }

  }


  /* =====================================================
     LOAD CLIENTS
  ===================================================== */

  async function loadClients() {

    const container =
      document.getElementById(
        "clientsContainer"
      );

    container.innerHTML =
      '<div class="loading">Chargement...</div>';


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "get_vendor_clients",
        {
          p_session_token:
            sessionToken
        }
      );


      if (error) {

        console.error(error);

        container.innerHTML =
          '<div class="empty">Erreur lors du chargement.</div>';

        return;

      }


      clients = data || [];


      document.getElementById(
        "clientCount"
      ).textContent =
        clients.length;


      renderClients(clients);


    } catch (error) {

      console.error(error);

      container.innerHTML =
        '<div class="empty">Erreur lors du chargement.</div>';

    }

  }


  /* =====================================================
     RENDER CLIENTS
  ===================================================== */

  function renderClients(list) {

    const container =
      document.getElementById(
        "clientsContainer"
      );


    if (!list || list.length === 0) {

      container.innerHTML =
        '<div class="empty">Aucun client trouvé.</div>';

      return;

    }


    container.innerHTML = "";


    list.forEach(client => {

      const card =
        document.createElement("div");

      card.className =
        "client-card";


      const image =
        client.profile_image
          ? `<img
               class="client-image"
               src="${escapeHtml(client.profile_image)}"
               onerror="this.style.display='none'"
             >`
          : `<div class="client-image"></div>`;


      card.innerHTML = `

        <div class="client-top">

          ${image}

          <div class="client-info">

            <div class="client-name">
              ${escapeHtml(client.name || "Nom du client")}
            </div>

            <div class="client-description">
              ${escapeHtml(client.description || "")}
            </div>

          </div>

        </div>


        <div class="client-actions">

          <button
            class="copy-btn"
            onclick="copyClientLink(${client.id})"
          >
            Copier lien
          </button>


          <button
            class="qr-btn"
            onclick="downloadClientQr(${client.id})"
          >
            QR Code
          </button>


          <a
            class="open-btn"
            href="client.html?id=${client.id}"
            target="_blank"
          >
            Ouvrir
          </a>


          <button
            class="edit-btn"
            onclick="editClient(${client.id})"
          >
            Modifier
          </button>


          <button
            class="delete-btn"
            onclick="confirmDeleteClient(${client.id})"
          >
            Supprimer
          </button>

        </div>

      `;


      container.appendChild(card);

    });

  }


  /* =====================================================
     FILTER CLIENTS
  ===================================================== */

  function filterClients() {

    const search =
      document.getElementById(
        "searchInput"
      ).value
      .toLowerCase()
      .trim();


    if (!search) {

      renderClients(clients);

      return;

    }


    const filtered =
      clients.filter(client => {

        return (
          String(client.name || "")
            .toLowerCase()
            .includes(search)
          ||
          String(client.description || "")
            .toLowerCase()
            .includes(search)
        );

      });


    renderClients(filtered);

  }


  /* =====================================================
     CLIENT LINK
  ===================================================== */

  function getClientLink(id) {

    return (
      window.location.origin +
      window.location.pathname.substring(
        0,
        window.location.pathname.lastIndexOf("/") + 1
      ) +
      "client.html?id=" +
      id
    );

  }


  /* =====================================================
     COPY CLIENT LINK
  ===================================================== */

  async function copyClientLink(id) {

    const link =
      getClientLink(id);


    try {

      await navigator.clipboard.writeText(link);

      alert("Lien copié !");

    } catch (error) {

      prompt(
        "Copiez le lien :",
        link
      );

    }

  }


  /* =====================================================
     CLIENT QR
  ===================================================== */

  function downloadClientQr(id) {

    const link =
      getClientLink(id);


    const generator =
      document.getElementById(
        "qrGenerator"
      );


    generator.innerHTML = "";


    new QRCode(generator, {

      text: link,

      width: 500,

      height: 500,

      correctLevel:
        QRCode.CorrectLevel.H

    });


    setTimeout(() => {

      const canvas =
        generator.querySelector("canvas");

      const image =
        generator.querySelector("img");


      let dataUrl = null;


      if (canvas) {

        dataUrl =
          canvas.toDataURL(
            "image/png"
          );

      } else if (image) {

        dataUrl =
          image.src;

      }


      if (!dataUrl) {

        alert(
          "Impossible de générer le QR Code."
        );

        return;

      }


      const linkElement =
        document.createElement("a");

      linkElement.href =
        dataUrl;

      linkElement.download =
        "client-" +
        id +
        "-qr.png";

      document.body.appendChild(
        linkElement
      );

      linkElement.click();

      linkElement.remove();

    }, 500);

  }


  /* =====================================================
     EDIT CLIENT
  ===================================================== */

  function editClient(id) {

    window.location.href =
      "vendor-edit-client.html?id=" +
      id;

  }


  /* =====================================================
     DELETE CLIENT CONFIRM
  ===================================================== */

  function confirmDeleteClient(id) {

    pendingAction =
      async function() {

        await deleteClient(id);

      };


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Supprimer le client";


    document.getElementById(
      "modalText"
    ).textContent =
      "Voulez-vous vraiment supprimer ce client ?";


    const btn =
      document.getElementById(
        "confirmActionBtn"
      );


    btn.className =
      "danger-confirm";


    btn.textContent =
      "Supprimer";


    btn.onclick =
      async function() {

        closeModal();

        if (pendingAction) {

          await pendingAction();

        }

      };


    document.getElementById(
      "confirmModal"
    ).style.display =
      "flex";

  }


  /* =====================================================
     DELETE CLIENT
  ===================================================== */

  async function deleteClient(id) {

    try {

      const {
        error
      } = await supabaseClient.rpc(
        "delete_vendor_client",
        {
          p_session_token:
            sessionToken,

          p_client_id:
            id
        }
      );


      if (error) {

        console.error(error);

        alert(
          error.message ||
          "Erreur lors de la suppression."
        );

        return;

      }


      await loadClients();

    } catch (error) {

      console.error(error);

      alert(
        "Erreur lors de la suppression."
      );

    }

  }


  /* =====================================================
     SHOW QR VIEW
  ===================================================== */

  async function showQrView() {

    document.getElementById(
      "clientView"
    ).style.display =
      "none";


    document.getElementById(
      "qrView"
    ).style.display =
      "block";


    updateQrInput();


    await loadQrCodes();

  }


  /* =====================================================
     SHOW CLIENT VIEW
  ===================================================== */

  function showClientView() {

    document.getElementById(
      "qrView"
    ).style.display =
      "none";


    document.getElementById(
      "clientView"
    ).style.display =
      "block";

  }


  /* =====================================================
     UPDATE QR INPUT
  ===================================================== */

  function updateQrInput() {

    const destination =
      document.getElementById(
        "qrDestination"
      ).value;


    const input =
      document.getElementById(
        "qrLink"
      );


    const label =
      document.getElementById(
        "qrLinkLabel"
      );


    /* TELEPHONE */

    if (
      destination === "phone"
    ) {

      input.type =
        "tel";

      input.placeholder =
        "0550...";

      label.textContent =
        "Numéro de téléphone";

      input.value = "";

      return;

    }


    /* WHATSAPP */

    if (
      destination === "whatsapp"
    ) {

      input.type =
        "tel";

      input.placeholder =
        "0550...";

      label.textContent =
        "Numéro WhatsApp";

      input.value = "";

      return;

    }


    /* SNAPCHAT */

    if (
      destination === "snapchat"
    ) {

      input.type =
        "text";

      input.placeholder =
        "@username";

      label.textContent =
        "Nom d'utilisateur Snapchat";

      input.value = "";

      return;

    }


    /* URL */

    input.type =
      "url";

    label.textContent =
      "Lien";


    if (
      destination === "instagram"
    ) {

      input.placeholder =
        "https://instagram.com/...";

    } else if (
      destination === "facebook"
    ) {

      input.placeholder =
        "https://facebook.com/...";

    } else if (
      destination === "tiktok"
    ) {

      input.placeholder =
        "https://tiktok.com/@...";

    } else if (
      destination === "website"
    ) {

      input.placeholder =
        "https://...";

    }


    input.value = "";

  }


  /* =====================================================
     NORMALIZE PHONE
  ===================================================== */

  function normalizeAlgerianPhone(
    value
  ) {

    let phone =
      String(value || "")
        .trim()
        .replace(/\s+/g, "");


    if (
      phone.startsWith("+213")
    ) {

      return phone;

    }


    if (
      phone.startsWith("00213")
    ) {

      return "+" +
        phone.substring(2);

    }


    if (
      phone.startsWith("0")
    ) {

      return (
        "+213" +
        phone.substring(1)
      );

    }


    return phone;

  }


  /* =====================================================
     PREPARE DESTINATION LINK
  ===================================================== */

  function prepareQrDestination(
    destination,
    value
  ) {

    let link =
      String(value || "")
        .trim();


    if (
      destination === "phone"
    ) {

      return (
        "tel:" +
        normalizeAlgerianPhone(link)
      );

    }


    if (
      destination === "whatsapp"
    ) {

      const phone =
        normalizeAlgerianPhone(
          link
        ).replace(
          /^\+/,
          ""
        );


      return (
        "https://wa.me/" +
        phone
      );

    }


    if (
      destination === "snapchat"
    ) {

      if (
        link.startsWith("@")
      ) {

        link =
          link.substring(1);

      }


      if (
        !link.startsWith("http")
      ) {

        return (
          "https://www.snapchat.com/add/" +
          encodeURIComponent(link)
        );

      }

    }


    return link;

  }


  /* =====================================================
     CREATE DYNAMIC QR
  ===================================================== */

  async function createDynamicQr() {

    const title =
      document.getElementById(
        "qrTitle"
      ).value.trim();


    const destination =
      document.getElementById(
        "qrDestination"
      ).value;


    const rawLink =
      document.getElementById(
        "qrLink"
      ).value.trim();


    if (!title) {

      alert(
        "Veuillez entrer un titre."
      );

      return;

    }


    if (!rawLink) {

      alert(
        "Veuillez entrer un lien ou un numéro."
      );

      return;

    }


    const finalDestination =
      prepareQrDestination(
        destination,
        rawLink
      );


    const button =
      document.getElementById(
        "generateQrBtn"
      );


    button.disabled =
      true;

    button.textContent =
      "Création...";


    try {

      /*
        IMPORTANT:

        Le QR final sera:

        qr.html?id=ID

        وليس finalDestination مباشرة.

        هذا هو ما يجعل QR ديناميكي.
      */

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "create_vendor_dynamic_qr",
        {
          p_session_token:
            sessionToken,

          p_title:
            title,

          p_destination:
            destination,

          p_link:
            finalDestination
        }
      );


      if (error) {

        console.error(error);

        alert(
          error.message ||
          "Erreur lors de la création du QR Code."
        );

        return;

      }


      document.getElementById(
        "qrTitle"
      ).value = "";


      document.getElementById(
        "qrLink"
      ).value = "";


      await loadQrCodes();


      alert(
        "QR Code dynamique créé !"
      );


    } catch (error) {

      console.error(error);

      alert(
        "Erreur lors de la création du QR Code."
      );

    } finally {

      button.disabled =
        false;

      button.textContent =
        "Générer le QR Code";

    }

  }


  /* =====================================================
     GET DYNAMIC QR BASE URL
  ===================================================== */

  function getDynamicQrLink(id) {

    return (
      window.location.origin +
      window.location.pathname.substring(
        0,
        window.location.pathname.lastIndexOf("/") + 1
      ) +
      "qr.html?id=" +
      id
    );

  }


  /* =====================================================
     LOAD QR CODES
  ===================================================== */

  async function loadQrCodes() {

    const container =
      document.getElementById(
        "qrList"
      );


    container.innerHTML =
      '<div class="loading">Chargement...</div>';


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "get_vendor_dynamic_qrs",
        {
          p_session_token:
            sessionToken
        }
      );


      if (error) {

        console.error(error);

        container.innerHTML =
          '<div class="empty">Erreur lors du chargement des QR Codes.</div>';

        return;

      }


      qrCodes =
        data || [];


      document.getElementById(
        "qrCount"
      ).textContent =
        qrCodes.length;


      renderQrCodes(qrCodes);


    } catch (error) {

      console.error(error);

      container.innerHTML =
        '<div class="empty">Erreur lors du chargement des QR Codes.</div>';

    }

  }


  /* =====================================================
     RENDER QR CODES
  ===================================================== */

  function renderQrCodes(list) {

    const container =
      document.getElementById(
        "qrList"
      );


    if (!list || list.length === 0) {

      container.innerHTML =
        '<div class="empty">Aucun QR Code dynamique.</div>';

      return;

    }


    container.innerHTML = "";


    list.forEach(qr => {

      const dynamicLink =
        getDynamicQrLink(
          qr.id
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "qr-card";


      card.innerHTML = `

        <div class="qr-card-header">

          <div class="qr-card-name">
            ${escapeHtml(qr.title)}
          </div>

        </div>


        <div class="qr-destination">
          Destination:
          <strong>
            ${getDestinationLabel(qr.destination)}
          </strong>
        </div>


        <div class="qr-link">
          ${escapeHtml(dynamicLink)}
        </div>


        <div class="qr-card-actions">

          <button
            class="download-qr"
            onclick="downloadDynamicQr(${qr.id})"
          >
            Télécharger
          </button>


          <button
            class="copy-qr"
            onclick="copyDynamicQr(${qr.id})"
          >
            Copier
          </button>


          <button
            class="delete-qr"
            onclick="confirmDeleteQr(${qr.id})"
          >
            Supprimer
          </button>

        </div>

      `;


      container.appendChild(
        card
      );

    });

  }


  /* =====================================================
     DESTINATION LABEL
  ===================================================== */

  function getDestinationLabel(
    destination
  ) {

    const labels = {

      instagram:
        "Instagram",

      facebook:
        "Facebook",

      tiktok:
        "TikTok",

      snapchat:
        "Snapchat",

      website:
        "Website",

      phone:
        "Téléphone",

      whatsapp:
        "WhatsApp"

    };


    return (
      labels[destination] ||
      destination
    );

  }


  /* =====================================================
     COPY DYNAMIC QR
  ===================================================== */

  async function copyDynamicQr(
    id
  ) {

    const link =
      getDynamicQrLink(id);


    try {

      await navigator.clipboard.writeText(
        link
      );

      alert(
        "Lien du QR Code copié !"
      );

    } catch (error) {

      prompt(
        "Copiez le lien :",
        link
      );

    }

  }


  /* =====================================================
     DOWNLOAD DYNAMIC QR
  ===================================================== */

  function downloadDynamicQr(
    id
  ) {

    const link =
      getDynamicQrLink(id);


    const generator =
      document.getElementById(
        "qrGenerator"
      );


    generator.innerHTML =
      "";


    new QRCode(
      generator,
      {

        text: link,

        width: 600,

        height: 600,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );


    setTimeout(() => {

      const canvas =
        generator.querySelector(
          "canvas"
        );


      const image =
        generator.querySelector(
          "img"
        );


      let dataUrl = null;


      if (canvas) {

        dataUrl =
          canvas.toDataURL(
            "image/png"
          );

      } else if (image) {

        dataUrl =
          image.src;

      }


      if (!dataUrl) {

        alert(
          "Impossible de générer le QR Code."
        );

        return;

      }


      const download =
        document.createElement(
          "a"
        );


      download.href =
        dataUrl;


      download.download =
        "dynamic-qr-" +
        id +
        ".png";


      document.body.appendChild(
        download
      );


      download.click();


      download.remove();

    }, 500);

  }


  /* =====================================================
     DELETE QR CONFIRM
  ===================================================== */

  function confirmDeleteQr(
    id
  ) {

    pendingAction =
      async function() {

        await deleteDynamicQr(id);

      };


    document.getElementById(
      "modalTitle"
    ).textContent =
      "Supprimer le QR Code";


    document.getElementById(
      "modalText"
    ).textContent =
      "Voulez-vous vraiment supprimer ce QR Code dynamique ?";


    const btn =
      document.getElementById(
        "confirmActionBtn"
      );


    btn.className =
      "danger-confirm";


    btn.textContent =
      "Supprimer";


    btn.onclick =
      async function() {

        closeModal();

        if (pendingAction) {

          await pendingAction();

        }

      };


    document.getElementById(
      "confirmModal"
    ).style.display =
      "flex";

  }


  /* =====================================================
     DELETE DYNAMIC QR
  ===================================================== */

  async function deleteDynamicQr(
    id
  ) {

    try {

      const {
        error
      } = await supabaseClient.rpc(
        "delete_vendor_dynamic_qr",
        {
          p_session_token:
            sessionToken,

          p_qr_id:
            id
        }
      );


      if (error) {

        console.error(error);

        alert(
          error.message ||
          "Erreur lors de la suppression."
        );

        return;

      }


      await loadQrCodes();

    } catch (error) {

      console.error(error);

      alert(
        "Erreur lors de la suppression."
      );

    }

  }


  /* =====================================================
     MODAL
  ===================================================== */

  function closeModal() {

    document.getElementById(
      "confirmModal"
    ).style.display =
      "none";


    pendingAction =
      null;

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(
    value
  ) {

    return String(
      value || ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =====================================================
     LOGOUT
  ===================================================== */

  function logout() {

    localStorage.removeItem(
      "vendor_session"
    );


    const token =
      sessionStorage.getItem(
        "vendor_login_token"
      );


    if (token) {

      window.location.href =
        "vendor.html?token=" +
        encodeURIComponent(token);

    } else {

      window.location.href =
        "vendor.html";

    }

  }


  /* =====================================================
     INITIALIZE
  ===================================================== */

  async function init() {

    const valid =
      await verifySession();


    if (!valid) {

      return;

    }


    await loadClients();


    /*
      نحمل QR كذلك باش العداد
      يظهر مباشرة في الهيدر.
    */

    await loadQrCodes();

  }


  init();

</script>
