<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Redirection...</title>

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f6f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .loader {
      width: 35px;
      height: 35px;
      border: 4px solid #eee;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>

</head>

<body>

  <div class="box">

    <div class="loader"></div>

    <div>
      Redirection...
    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <script>

    async function redirectQr() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const id =
        params.get("id");


      if (!id) {

        document.body.innerHTML =
          "<div>QR Code invalide.</div>";

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_dynamic_qr",
          {
            p_qr_id:
              Number(id)
          }
        );


      if (
        error ||
        !data ||
        data.length === 0
      ) {

        document.body.innerHTML =
          "<div>QR Code introuvable.</div>";

        return;

      }


      const qr =
        data[0];


      if (!qr.link) {

        document.body.innerHTML =
          "<div>Destination introuvable.</div>";

        return;

      }


      let destination =
        String(
          qr.link
        ).trim();


      /*
       * TELEPHONE
       */

      if (
        qr.destination === "Téléphone"
      ) {

        const phone =
          destination.replace(
            /\s+/g,
            ""
          );

        window.location.href =
          "tel:" + phone;

        return;

      }


      /*
       * WHATSAPP
       */

      if (
        qr.destination === "WhatsApp"
      ) {

        let phone =
          destination.replace(
            /\D/g,
            ""
          );


        if (
          phone.startsWith("0")
        ) {

          phone =
            "213" +
            phone.substring(1);

        }


        if (
          !phone.startsWith("213")
        ) {

          phone =
            "213" +
            phone;

        }


        window.location.replace(
          "https://wa.me/" +
          phone
        );

        return;

      }


      /*
       * SNAPCHAT
       */

      if (
        qr.destination === "Snapchat"
      ) {

        const username =
          destination.replace(
            /^@/,
            ""
          );


        window.location.replace(
          "https://www.snapchat.com/add/" +
          encodeURIComponent(
            username
          )
        );

        return;

      }


      /*
       * AUTRES LIENS
       */

      if (
        !/^https?:\/\//i.test(
          destination
        )
      ) {

        destination =
          "https://" +
          destination;

      }


      window.location.replace(
        destination
      );

    }


    redirectQr();

  </script>

</body>

</html>
