<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TAPTAPCARD</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #faf9f7 0%,
          #eef1f4 50%,
          #e4e8ed 100%
        );

      font-family: Arial, sans-serif;

      color: #222;

    }


    .page {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding: 30px 15px;

    }


    .profile-card {

      width: 100%;

      max-width: 720px;

      background: #ffffff;

      border-radius: 28px;

      overflow: hidden;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.10);

      position: relative;

    }


    /* =========================
       COVER
    ========================= */

    .cover {

      width: 100%;

      height: 390px;

      position: relative;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #e8e8e8,
          #f7f7f7
        );

    }


    .cover img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

    }


    .cover::after {

      content: "";

      position: absolute;

      left: 0;

      right: 0;

      bottom: 0;

      height: 170px;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          #ffffff
        );

    }


    /* =========================
       PROFILE IMAGE
    ========================= */

    .profile-image-wrapper {

      position: relative;

      margin-top: -85px;

      display: flex;

      justify-content: center;

      z-index: 5;

    }


    .profile-image {

      width: 150px;

      height: 150px;

      border-radius: 50%;

      object-fit: cover;

      border: 7px solid #ffffff;

      background: #f1f1f1;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.12);

    }


    /* =========================
       CONTENT
    ========================= */

    .content {

      padding:
        5px 30px 30px;

      text-align: center;

    }


    .name {

      margin:

        8px 0 8px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 40px;

      line-height: 1.15;

      color: #1f2933;

      word-break: break-word;

    }


    .description {

      max-width: 600px;

      margin:
        0 auto 28px;

      color: #687789;

      font-size: 16px;

      line-height: 1.6;

      white-space: pre-line;

      word-break: break-word;

    }


    /* =========================
       BUTTONS
    ========================= */

    .links {

      display: flex;

      flex-direction: column;

      gap: 12px;

      width: 100%;

      max-width: 560px;

      margin: 0 auto;

    }


    .social-button,
    .contact-button {

      width: 100%;

      min-height: 54px;

      border-radius: 999px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 11px;

      text-decoration: none;

      font-size: 16px;

      font-weight: 600;

      transition:
        transform .15s ease,
        opacity .15s ease;

      cursor: pointer;

    }


    .social-button:hover,
    .contact-button:hover {

      transform:
        translateY(-1px);

      opacity: .92;

    }


    .social-button i,
    .contact-button i {

      font-size: 20px;

    }


    /* Instagram */

    .instagram {

      color: #ffffff;

      background:
        linear-gradient(
          45deg,
          #f58529,
          #dd2a7b,
          #8134af,
          #515bd4
        );

    }


    /* Facebook */

    .facebook {

      color: #ffffff;

      background: #1877f2;

    }


    /* TikTok */

    .tiktok {

      color: #ffffff;

      background: #111111;

    }


    /* Snapchat */

    .snapchat {

      color: #111111;

      background: #fffc00;

    }


    /* Website */

    .website {

      color: #ffffff;

      background: #4b5563;

    }


    /* WhatsApp */

    .whatsapp {

      color: #ffffff;

      background: #25d366;

    }


    /* Phone */

    .phone {

      color: #ffffff;

      background: #6b7280;

    }


    /* Google Maps */

    .google-maps {

      color: #ffffff;

      background: #4285f4;

    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      margin-top: 30px;

      padding-top: 20px;

      border-top:
        1px solid #eeeeee;

      color: #8a96a3;

      font-size: 13px;

      line-height: 1.7;

    }


    .footer a {

      color: #8a96a3;

      text-decoration: none;

      font-weight: 600;

    }


    .footer a:hover {

      text-decoration: underline;

    }


    /* =========================
       LOADING
    ========================= */

    .loading {

      min-height: 500px;

      display: flex;

      justify-content: center;

      align-items: center;

      color: #777;

      font-size: 16px;

    }


    /* =========================
       ERROR
    ========================= */

    .error {

      padding: 60px 25px;

      text-align: center;

      color: #777;

    }


    .error-icon {

      font-size: 45px;

      margin-bottom: 15px;

      color: #b0b7bf;

    }


    .error h2 {

      margin:
        0 0 10px;

      color: #333;

      font-family: Georgia, serif;

    }


    .error p {

      margin: 0;

      line-height: 1.6;

    }


    /* =========================
       HIDDEN
    ========================= */

    .hidden {

      display: none !important;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .page {

        padding:
          0;

      }


      .profile-card {

        min-height: 100vh;

        border-radius: 0;

      }


      .cover {

        height: 360px;

      }


      .profile-image {

        width: 135px;

        height: 135px;

      }


      .profile-image-wrapper {

        margin-top: -75px;

      }


      .content {

        padding:
          5px 20px 25px;

      }


      .name {

        font-size: 34px;

      }


      .description {

        font-size: 15px;

      }


      .social-button,
      .contact-button {

        min-height: 52px;

        font-size: 15px;

      }

    }

  </style>

</head>


<body>


<div class="page">


  <!-- =========================
       CARD
  ========================= -->

  <div
    id="profileCard"
    class="profile-card hidden"
  >


    <!-- COVER -->

    <div class="cover">

      <img
        id="coverImage"
        src=""
        alt="Cover"
        class="hidden"
      >

    </div>


    <!-- PROFILE IMAGE -->

    <div class="profile-image-wrapper">

      <img
        id="profileImage"
        src=""
        alt="Profile"
        class="profile-image hidden"
      >

    </div>


    <!-- CONTENT -->

    <div class="content">


      <!-- NAME -->

      <h1
        id="clientName"
        class="name"
      >
      </h1>


      <!-- DESCRIPTION -->

      <div
        id="clientDescription"
        class="description"
      >
      </div>


      <!-- LINKS -->

      <div
        id="links"
        class="links"
      >


        <!-- INSTAGRAM -->

        <a
          id="instagramButton"
          class="social-button instagram hidden"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-brands fa-instagram"></i>

          <span>Instagram</span>

        </a>


        <!-- FACEBOOK -->

        <a
          id="facebookButton"
          class="social-button facebook hidden"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-brands fa-facebook-f"></i>

          <span>Facebook</span>

        </a>


        <!-- TIKTOK -->

        <a
          id="tiktokButton"
          class="social-button tiktok hidden"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-brands fa-tiktok"></i>

          <span>TikTok</span>

        </a>


        <!-- SNAPCHAT -->

        <a
          id="snapchatButton"
          class="social-button snapchat hidden"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-brands fa-snapchat"></i>

          <span>Snapchat</span>

        </a>


        <!-- WEBSITE -->

        <a
          id="websiteButton"
          class="social-button website hidden"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <span style="font-size:20px;">
            🌐
          </span>

          <span>Website</span>

        </a>


        <!-- WHATSAPP -->

        <a
          id="whatsappButton"
          class="contact-button whatsapp hidden"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-brands fa-whatsapp"></i>

          <span>WhatsApp</span>

        </a>


        <!-- PHONE -->

        <a
          id="phoneButton"
          class="contact-button phone hidden"
          href="#"
        >

          <i class="fa-solid fa-phone"></i>

          <span>Téléphone</span>

        </a>


        <!-- GOOGLE MAPS -->

        <a
          id="mapsButton"
          class="contact-button google-maps hidden"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >

          <i class="fa-solid fa-location-dot"></i>

          <span>Google Maps</span>

        </a>


      </div>


      <!-- FOOTER -->

      <div class="footer">

        <div>
          Merci pour votre visite ♥
        </div>

        <div>

          Produit par

          <a
            href="https://www.instagram.com/akram.mhl"
            target="_blank"
            rel="noopener noreferrer"
          >
            TAPTAPCARD
          </a>

        </div>

      </div>


    </div>

  </div>


  <!-- =========================
       LOADING
  ========================= -->

  <div
    id="loading"
    class="profile-card"
  >

    <div class="loading">

      Chargement...

    </div>

  </div>


  <!-- =========================
       ERROR
  ========================= -->

  <div
    id="errorCard"
    class="profile-card hidden"
  >

    <div class="error">

      <div class="error-icon">

        <i class="fa-solid fa-circle-exclamation"></i>

      </div>

      <h2>
        Client introuvable
      </h2>

      <p id="errorText">
        Impossible de charger les informations du client.
      </p>

    </div>

  </div>


</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const loading =
  document.getElementById(
    "loading"
  );


const profileCard =
  document.getElementById(
    "profileCard"
  );


const errorCard =
  document.getElementById(
    "errorCard"
  );


const errorText =
  document.getElementById(
    "errorText"
  );


/* =====================================================
   GET CLIENT ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const clientId =
  params.get("id");


/* =====================================================
   HELPERS
===================================================== */

function showElement(
  element
) {

  element.classList.remove(
    "hidden"
  );

}


function hideElement(
  element
) {

  element.classList.add(
    "hidden"
  );

}


/* =====================================================
   SAFE URL
===================================================== */

function cleanUrl(
  value
) {

  if (!value) {

    return "";

  }


  const url =
    value.trim();


  if (!url) {

    return "";

  }


  /*
    Add https:// if the user entered
    a website without protocol.
  */

  if (
    !/^https?:\/\//i.test(
      url
    )
  ) {

    return (
      "https://" +
      url
    );

  }


  return url;

}


/* =====================================================
   SNAPCHAT URL
===================================================== */

function getSnapchatUrl(
  value
) {

  if (!value) {

    return "";

  }


  let username =
    value.trim();


  if (!username) {

    return "";

  }


  /*
    If the seller entered
    a complete URL, use it.
  */

  if (
    /^https?:\/\//i.test(
      username
    )
  ) {

    return username;

  }


  /*
    Remove @
  */

  username =
    username.replace(
      /^@/,
      ""
    );


  if (!username) {

    return "";

  }


  return (
    "https://www.snapchat.com/add/" +
    encodeURIComponent(
      username
    )
  );

}


/* =====================================================
   PHONE
===================================================== */

function getPhoneUrl(
  value
) {

  if (!value) {

    return "";

  }


  /*
    Keep + and numbers only
  */

  const phone =
    value
      .trim()
      .replace(
        /[^\d+]/g,
        ""
      );


  if (!phone) {

    return "";

  }


  return (
    "tel:" +
    phone
  );

}


/* =====================================================
   WHATSAPP
===================================================== */

function getWhatsappUrl(
  value
) {

  if (!value) {

    return "";

  }


  let phone =
    value
      .trim()
      .replace(
        /[^\d+]/g,
        ""
      );


  if (!phone) {

    return "";

  }


  /*
    Algeria:
    0550xxxxxx
    0660xxxxxx
    0770xxxxxx

    Convert to:
    213550xxxxxx
  */

  if (
    /^0\d{9}$/.test(
      phone
    )
  ) {

    phone =
      "213" +
      phone.substring(
        1
      );

  }


  /*
    Remove + if present
  */

  phone =
    phone.replace(
      /^\+/,
      ""
    );


  return (
    "https://wa.me/" +
    phone
  );

}


/* =====================================================
   SET LINK
===================================================== */

function setLink(
  id,
  url
) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {

    return;

  }


  if (!url) {

    hideElement(
      element
    );

    element.removeAttribute(
      "href"
    );

    return;

  }


  element.href =
    url;


  showElement(
    element
  );

}


/* =====================================================
   LOAD CLIENT
===================================================== */

async function loadClient() {

  /*
    No ID
  */

  if (!clientId) {

    loading.style.display =
      "none";


    errorText.textContent =
      "Aucun identifiant de client n'a été fourni.";


    showElement(
      errorCard
    );


    return;

  }


  const numericId =
    Number(
      clientId
    );


  if (
    !Number.isInteger(
      numericId
    ) ||
    numericId <= 0
  ) {

    loading.style.display =
      "none";


    errorText.textContent =
      "Identifiant du client invalide.";


    showElement(
      errorCard
    );


    return;

  }


  try {

    /*
      Public RPC.

      The function:
      get_public_client(bigint)
    */

    const {
      data,
      error
    } =
      await supabaseClient.rpc(
        "get_public_client",
        {
          p_client_id:
            numericId
        }
      );


    if (error) {

      console.error(
        "Supabase RPC error:",
        error
      );

      throw new Error(
        "Impossible de charger les informations du client."
      );

    }


    /*
      RPC returns an array
    */

    if (
      !data ||
      data.length === 0
    ) {

      loading.style.display =
        "none";


      errorText.textContent =
        "Ce client n'existe pas ou a été supprimé.";


      showElement(
        errorCard
      );


      return;

    }


    const client =
      data[0];


    /* =================================================
       NAME
    ================================================= */

    document
      .getElementById(
        "clientName"
      )
      .textContent =
        client.name ||
        "Nom du client";


    /* =================================================
       DESCRIPTION
    ================================================= */

    const description =
      document.getElementById(
        "clientDescription"
      );


    if (
      client.description &&
      client.description.trim()
    ) {

      description.textContent =
        client.description;


      showElement(
        description
      );

    } else {

      hideElement(
        description
      );

    }


    /* =================================================
       COVER
    ================================================= */

    const coverImage =
      document.getElementById(
        "coverImage"
      );


    if (
      client.cover_image
    ) {

      coverImage.src =
        client.cover_image;


      coverImage.onload =
        () => {

          showElement(
            coverImage
          );

        };


      coverImage.onerror =
        () => {

          hideElement(
            coverImage
          );

        };

    }


    /* =================================================
       PROFILE
    ================================================= */

    const profileImage =
      document.getElementById(
        "profileImage"
      );


    if (
      client.profile_image
    ) {

      profileImage.src =
        client.profile_image;


      profileImage.onload =
        () => {

          showElement(
            profileImage
          );

        };


      profileImage.onerror =
        () => {

          hideElement(
            profileImage
          );

        };

    }


    /* =================================================
       INSTAGRAM
    ================================================= */

    setLink(
      "instagramButton",
      cleanUrl(
        client.instagram
      )
    );


    /* =================================================
       FACEBOOK
    ================================================= */

    setLink(
      "facebookButton",
      cleanUrl(
        client.facebook
      )
    );


    /* =================================================
       TIKTOK
    ================================================= */

    setLink(
      "tiktokButton",
      cleanUrl(
        client.tiktok
      )
    );


    /* =================================================
       SNAPCHAT
    ================================================= */

    setLink(
      "snapchatButton",
      getSnapchatUrl(
        client.snapchat
      )
    );


    /* =================================================
       WEBSITE
    ================================================= */

    setLink(
      "websiteButton",
      cleanUrl(
        client.website
      )
    );


    /* =================================================
       WHATSAPP
    ================================================= */

    setLink(
      "whatsappButton",
      getWhatsappUrl(
        client.whatsapp
      )
    );


    /* =================================================
       PHONE
    ================================================= */

    setLink(
      "phoneButton",
      getPhoneUrl(
        client.phone
      )
    );


    /* =================================================
       GOOGLE MAPS
    ================================================= */

    setLink(
      "mapsButton",
      cleanUrl(
        client.google_maps
      )
    );


    /* =================================================
       SHOW PAGE
    ================================================= */

    loading.style.display =
      "none";


    showElement(
      profileCard
    );


  } catch (error) {

    console.error(
      error
    );


    loading.style.display =
      "none";


    errorText.textContent =
      error.message ||
      "Une erreur est survenue.";


    showElement(
      errorCard
    );

  }

}


/* =====================================================
   START
===================================================== */

loadClient();

</script>


</body>
</html>
