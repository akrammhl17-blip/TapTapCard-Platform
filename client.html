<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #faf9f7,
        #eef1f4,
        #e4e8ed
      );
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 720px;
      min-height: calc(100vh - 40px);
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
      position: relative;
    }

    /* ================= COVER ================= */

    .cover {
      width: 100%;
      height: 390px;
      position: relative;
      background: #e9edf0;
      overflow: hidden;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 150px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255, 255, 255, 0.95)
      );
      pointer-events: none;
    }

    /* ================= PROFILE ================= */

    .profile-area {
      position: relative;
      margin-top: -75px;
      z-index: 2;
      text-align: center;
      padding: 0 20px;
    }

    .profile-image {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #ffffff;
      background: #eeeeee;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      display: block;
      margin: 0 auto 18px;
    }

    .profile-image.hidden {
      display: none;
    }

    /* ================= TEXT ================= */

    .name {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 40px;
      line-height: 1.15;
      color: #202832;
      font-weight: 700;
      word-break: break-word;
    }

    .description {
      margin: 12px auto 0;
      max-width: 600px;
      color: #697586;
      font-size: 16px;
      line-height: 1.6;
      word-break: break-word;
    }

    /* ================= BUTTONS ================= */

    .links {
      width: 100%;
      max-width: 560px;
      margin: 28px auto 0;
      padding: 0 20px 30px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .social-btn {
      width: 100%;
      min-height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      text-decoration: none;
      color: white;
      font-size: 16px;
      font-weight: 600;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;

      padding: 12px 18px;
    }

    .social-btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .social-btn i {
      font-size: 20px;
    }

    /* Instagram */
    .instagram-btn {
      background: linear-gradient(
        45deg,
        #f58529,
        #dd2a7b,
        #8134af,
        #515bd4
      );
    }

    /* Facebook */
    .facebook-btn {
      background: #1877f2;
    }

    /* TikTok */
    .tiktok-btn {
      background: #000000;
    }

    /* Snapchat */
    .snapchat-btn {
      background: #fffc00;
      color: #000000;
    }

    /* Website */
    .website-btn {
      background: #4d6478;
    }

    /* ================= CONTACT ROW ================= */

    .contact-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 14px;
    }

    .contact-row .social-btn {
      flex: 1;
      width: auto;
      margin: 0;
    }

    /* WhatsApp */
    .whatsapp-btn {
      background: #25d366;
    }

    /* Phone */
    .phone-btn {
      background: #667085;
    }

    /* Google Maps */
    .maps-btn {
      background: #4285f4;
    }

    /* ================= FOOTER ================= */

    .footer {
      text-align: center;
      padding: 8px 20px 28px;
      color: #98a2b3;
      font-size: 13px;
    }

    .footer .heart {
      color: #c54b5c;
    }

    .footer strong {
      color: #667085;
      font-weight: 600;
    }

    /* ================= LOADING ================= */

    .loading {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #667085;
      font-size: 16px;
    }

    .error {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      color: #667085;
      font-size: 18px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      body {
        padding: 0;
      }

      .page {
        min-height: 100vh;
        border-radius: 0;
      }

      .cover {
        height: 360px;
      }

      .profile-area {
        margin-top: -70px;
        padding: 0 16px;
      }

      .profile-image {
        width: 135px;
        height: 135px;
      }

      .name {
        font-size: 34px;
      }

      .description {
        font-size: 15px;
      }

      .links {
        padding-left: 16px;
        padding-right: 16px;
      }

      .social-btn {
        min-height: 50px;
        font-size: 15px;
      }

      .contact-row {
        gap: 12px;
      }

      .contact-row .social-btn {
        min-height: 50px;
        padding-left: 10px;
        padding-right: 10px;
      }

      .contact-row .social-btn i {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div id="loading" class="loading">
    Chargement...
  </div>

  <div id="error" class="error" style="display:none;">
    Client introuvable
  </div>

  <main id="page" class="page" style="display:none;">

    <!-- COVER -->
    <div class="cover">
      <img id="coverImage" alt="Cover">
    </div>

    <!-- PROFILE -->
    <section class="profile-area">

      <img
        id="profileImage"
        class="profile-image"
        alt="Photo de profil"
      >

      <h1 id="name" class="name"></h1>

      <p id="description" class="description"></p>

    </section>

    <!-- LINKS -->
    <div class="links">

      <!-- Instagram -->
      <a
        id="instagramBtn"
        class="social-btn instagram-btn"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;"
      >
        <i class="fa-brands fa-instagram"></i>
        Instagram
      </a>

      <!-- Facebook -->
      <a
        id="facebookBtn"
        class="social-btn facebook-btn"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;"
      >
        <i class="fa-brands fa-facebook-f"></i>
        Facebook
      </a>

      <!-- TikTok -->
      <a
        id="tiktokBtn"
        class="social-btn tiktok-btn"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;"
      >
        <i class="fa-brands fa-tiktok"></i>
        TikTok
      </a>

      <!-- Snapchat -->
      <a
        id="snapchatBtn"
        class="social-btn snapchat-btn"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;"
      >
        <i class="fa-brands fa-snapchat"></i>
        Snapchat
      </a>

      <!-- Website -->
      <a
        id="websiteBtn"
        class="social-btn website-btn"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;"
      >
        <span style="font-size:20px;">🌐</span>
        Website
      </a>

      <!-- WhatsApp + Phone -->
      <div
        id="contactRow"
        class="contact-row"
        style="display:none;"
      >

        <!-- WhatsApp -->
        <a
          id="whatsappBtn"
          class="social-btn whatsapp-btn"
          target="_blank"
          rel="noopener noreferrer"
          style="display:none;"
        >
          <i class="fa-brands fa-whatsapp"></i>
          WhatsApp
        </a>

        <!-- Phone -->
        <a
          id="phoneBtn"
          class="social-btn phone-btn"
          style="display:none;"
        >
          <i class="fa-solid fa-phone"></i>
          Téléphone
        </a>

      </div>

      <!-- Google Maps -->
      <a
        id="mapsBtn"
        class="social-btn maps-btn"
        target="_blank"
        rel="noopener noreferrer"
        style="display:none;"
      >
        <i class="fa-solid fa-location-dot"></i>
        Google Maps
      </a>

    </div>

    <!-- FOOTER -->
    <footer class="footer">
      Merci pour votre visite <span class="heart">♥</span><br>
      Produit par <strong>TAPTAPCARD</strong>
    </footer>

  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get("id");

    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const page = document.getElementById("page");

    const coverImage = document.getElementById("coverImage");
    const profileImage = document.getElementById("profileImage");

    const name = document.getElementById("name");
    const description = document.getElementById("description");

    const instagramBtn = document.getElementById("instagramBtn");
    const facebookBtn = document.getElementById("facebookBtn");
    const tiktokBtn = document.getElementById("tiktokBtn");
    const snapchatBtn = document.getElementById("snapchatBtn");
    const websiteBtn = document.getElementById("websiteBtn");

    const contactRow = document.getElementById("contactRow");
    const whatsappBtn = document.getElementById("whatsappBtn");
    const phoneBtn = document.getElementById("phoneBtn");

    const mapsBtn = document.getElementById("mapsBtn");


    /* ================= URL HELPERS ================= */

    function cleanUrl(value) {
      if (!value) return "";

      value = value.trim();

      if (!value) return "";

      if (
        value.startsWith("http://") ||
        value.startsWith("https://")
      ) {
        return value;
      }

      return "https://" + value;
    }


    function makeSnapchatUrl(value) {
      if (!value) return "";

      value = value.trim();

      if (!value) return "";

      if (value.startsWith("http://") || value.startsWith("https://")) {
        return value;
      }

      value = value.replace(/^@/, "");

      return "https://www.snapchat.com/add/" + value;
    }


    function makePhoneUrl(value) {
      if (!value) return "";

      value = value.trim();

      if (!value) return "";

      if (value.startsWith("tel:")) {
        return value;
      }

      return "tel:" + value.replace(/\s+/g, "");
    }


    function makeWhatsappUrl(value) {
      if (!value) return "";

      value = value.trim();

      if (!value) return "";

      if (
        value.startsWith("http://") ||
        value.startsWith("https://")
      ) {
        return value;
      }

      let number = value.replace(/[^\d+]/g, "");

      if (number.startsWith("+")) {
        number = number.substring(1);
      }

      if (number.startsWith("0")) {
        number = "213" + number.substring(1);
      }

      return "https://wa.me/" + number;
    }


    /* ================= BUTTON HELPER ================= */

    function showButton(button, url) {
      if (!url) return;

      button.href = url;
      button.style.display = "flex";
    }


    /* ================= LOAD CLIENT ================= */

    async function loadClient() {

      if (!clientId || isNaN(Number(clientId))) {
        loading.style.display = "none";
        error.style.display = "flex";
        error.textContent = "Client introuvable";
        return;
      }

      try {

        const { data, error: rpcError } =
          await supabaseClient.rpc(
            "get_public_client",
            {
              p_client_id: Number(clientId)
            }
          );

        if (rpcError) {
          console.error(rpcError);

          loading.style.display = "none";
          error.style.display = "flex";
          error.textContent = "Erreur de chargement";
          return;
        }

        if (!data || data.length === 0) {
          loading.style.display = "none";
          error.style.display = "flex";
          error.textContent = "Client introuvable";
          return;
        }

        const client = data[0];


        /* ================= BASIC INFO ================= */

        name.textContent = client.name || "";

        description.textContent =
          client.description || "";


        /* ================= PROFILE IMAGE ================= */

        if (client.profile_image) {

          profileImage.src = client.profile_image;

          profileImage.style.display = "block";

          profileImage.onerror = function() {
            this.style.display = "none";
          };

        } else {

          profileImage.style.display = "none";

        }


        /* ================= COVER IMAGE ================= */

        if (client.cover_image) {

          coverImage.src = client.cover_image;

          coverImage.style.display = "block";

          coverImage.onerror = function() {
            this.style.display = "none";
          };

        } else {

          coverImage.style.display = "none";

        }


        /* ================= SOCIAL LINKS ================= */

        showButton(
          instagramBtn,
          cleanUrl(client.instagram)
        );

        showButton(
          facebookBtn,
          cleanUrl(client.facebook)
        );

        showButton(
          tiktokBtn,
          cleanUrl(client.tiktok)
        );

        showButton(
          snapchatBtn,
          makeSnapchatUrl(client.snapchat)
        );

        showButton(
          websiteBtn,
          cleanUrl(client.website)
        );


        /* ================= WHATSAPP ================= */

        if (client.whatsapp) {

          whatsappBtn.href =
            makeWhatsappUrl(client.whatsapp);

          whatsappBtn.style.display = "flex";

        }


        /* ================= PHONE ================= */

        if (client.phone) {

          phoneBtn.href =
            makePhoneUrl(client.phone);

          phoneBtn.style.display = "flex";

        }


        /* ================= CONTACT ROW ================= */

        if (
          client.whatsapp ||
          client.phone
        ) {

          contactRow.style.display = "flex";

        }


        /* ================= GOOGLE MAPS ================= */

        showButton(
          mapsBtn,
          cleanUrl(client.google_maps)
        );


        /* ================= SHOW PAGE ================= */

        loading.style.display = "none";
        page.style.display = "block";

      } catch (err) {

        console.error(err);

        loading.style.display = "none";
        error.style.display = "flex";
        error.textContent = "Erreur de chargement";

      }
    }


    loadClient();
  </script>

</body>
</html>
