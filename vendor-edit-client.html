<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Modifier le client - TAPTAPCARD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #faf9f7,
        #eef1f4,
        #e4e8ed
      );
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      background: white;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: #999;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
    }

    .current-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
      display: block;
    }

    .preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
      display: none;
    }

    .section-title {
      margin-top: 28px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
    }

    .image-note {
      margin-top: 7px;
      font-size: 12px;
      color: #777;
    }

    .compression-info {
      display: none;
      margin-top: 8px;
      padding: 9px 10px;
      border-radius: 10px;
      background: #f5f5f5;
      color: #666;
      font-size: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: white;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-btn {
      background: #eee;
      color: #222;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #e8f7ed;
      color: #217a3c;
    }

    .error {
      background: #fdeaea;
      color: #a32929;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
        border-radius: 18px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Modifier le client</h1>

  <div class="subtitle">
    Modifiez les informations du client
  </div>

  <div id="loading" class="loading">
    Chargement...
  </div>

  <form id="clientForm" style="display:none;">

    <!-- INFORMATIONS -->

    <div class="section-title">
      Informations
    </div>

    <div class="field">
      <label for="name">
        Nom du client
      </label>

      <input
        type="text"
        id="name"
        placeholder="Nom du client"
        required
      >
    </div>

    <div class="field">
      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Description de l'activité"
      ></textarea>
    </div>


    <!-- IMAGES -->

    <div class="section-title">
      Images
    </div>

    <div class="field">

      <label for="profileImage">
        Photo de profil
      </label>

      <div id="currentProfileContainer"></div>

      <input
        type="file"
        id="profileImage"
        accept="image/*"
      >

      <img
        id="profilePreview"
        class="preview"
        alt="Aperçu"
      >

      <div class="image-note">
        Laissez vide pour conserver l'image actuelle.
      </div>

      <div
        id="profileCompression"
        class="compression-info"
      ></div>

    </div>


    <div class="field">

      <label for="coverImage">
        Image de couverture
      </label>

      <div id="currentCoverContainer"></div>

      <input
        type="file"
        id="coverImage"
        accept="image/*"
      >

      <img
        id="coverPreview"
        class="preview"
        alt="Aperçu"
      >

      <div class="image-note">
        Laissez vide pour conserver l'image actuelle.
      </div>

      <div
        id="coverCompression"
        class="compression-info"
      ></div>

    </div>


    <!-- RÉSEAUX SOCIAUX -->

    <div class="section-title">
      Réseaux sociaux
    </div>

    <div class="field">
      <label for="instagram">
        Instagram
      </label>

      <input
        type="url"
        id="instagram"
        placeholder="https://instagram.com/..."
      >
    </div>


    <div class="field">
      <label for="facebook">
        Facebook
      </label>

      <input
        type="url"
        id="facebook"
        placeholder="https://facebook.com/..."
      >
    </div>


    <div class="field">
      <label for="tiktok">
        TikTok
      </label>

      <input
        type="url"
        id="tiktok"
        placeholder="https://tiktok.com/@..."
      >
    </div>


    <div class="field">
      <label for="snapchat">
        Snapchat
      </label>

      <input
        type="text"
        id="snapchat"
        placeholder="@username"
      >
    </div>


    <div class="field">
      <label for="website">
        Website
      </label>

      <input
        type="url"
        id="website"
        placeholder="https://..."
      >
    </div>


    <!-- CONTACT -->

    <div class="section-title">
      Contact
    </div>


    <div class="field">
      <label for="phone">
        Téléphone
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="0550..."
      >
    </div>


    <div class="field">
      <label for="whatsapp">
        WhatsApp
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="0550..."
      >
    </div>


    <div class="field">
      <label for="googleMaps">
        Google Maps
      </label>

      <input
        type="url"
        id="googleMaps"
        placeholder="https://maps.google.com/..."
      >
    </div>


    <!-- BUTTONS -->

    <button
      type="submit"
      id="submitBtn"
    >
      Enregistrer les modifications
    </button>


    <button
      type="button"
      class="back-btn"
      onclick="window.location.href='vendor-dashboard.html'"
    >
      Retour
    </button>

  </form>


  <div
    id="successMessage"
    class="message success"
  ></div>


  <div
    id="errorMessage"
    class="message error"
  ></div>

</div>


<script>

  /* =====================================================
     SESSION VENDEUR
  ===================================================== */

  const vendorSession =
    JSON.parse(
      localStorage.getItem("vendor_session")
    );


  if (
    !vendorSession ||
    !vendorSession.session_token ||
    !vendorSession.vendor_id
  ) {

    window.location.href =
      "vendor.html";

  }


  /* =====================================================
     CLIENT ID
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const clientId =
    params.get("id");


  if (!clientId) {

    window.location.href =
      "vendor-dashboard.html";

  }


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const loading =
    document.getElementById(
      "loading"
    );


  const form =
    document.getElementById(
      "clientForm"
    );


  const submitBtn =
    document.getElementById(
      "submitBtn"
    );


  const profileInput =
    document.getElementById(
      "profileImage"
    );


  const coverInput =
    document.getElementById(
      "coverImage"
    );


  const profilePreview =
    document.getElementById(
      "profilePreview"
    );


  const coverPreview =
    document.getElementById(
      "coverPreview"
    );


  const profileCompression =
    document.getElementById(
      "profileCompression"
    );


  const coverCompression =
    document.getElementById(
      "coverCompression"
    );


  const successMessage =
    document.getElementById(
      "successMessage"
    );


  const errorMessage =
    document.getElementById(
      "errorMessage"
    );


  let currentProfileImage = "";
  let currentCoverImage = "";


  /* =====================================================
     FORMAT SIZE
  ===================================================== */

  function formatKB(bytes) {

    return (
      (bytes / 1024).toFixed(1) +
      " KB"
    );

  }


  /* =====================================================
     LOAD CLIENT
  ===================================================== */

  async function loadClient() {

    try {

      /*
        Vérifier la session
      */

      const {
        data: sessionData,
        error: sessionError
      } =
        await supabaseClient.rpc(
          "verify_vendor_session",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (
        sessionError ||
        !sessionData ||
        sessionData.length === 0
      ) {

        localStorage.removeItem(
          "vendor_session"
        );

        window.location.href =
          "vendor.html";

        return;
      }


      /*
        Charger les clients du vendeur
      */

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_vendor_clients",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (error) {

        throw new Error(
          error.message
        );

      }


      /*
        Chercher le client
      */

      const client =
        data.find(
          item =>
            Number(item.id) ===
            Number(clientId)
        );


      if (!client) {

        throw new Error(
          "Client introuvable."
        );

      }


      /* =================================================
         REMPLIR LE FORMULAIRE
      ================================================= */

      document.getElementById(
        "name"
      ).value =
        client.name || "";


      document.getElementById(
        "description"
      ).value =
        client.description || "";


      document.getElementById(
        "instagram"
      ).value =
        client.instagram || "";


      document.getElementById(
        "facebook"
      ).value =
        client.facebook || "";


      document.getElementById(
        "tiktok"
      ).value =
        client.tiktok || "";


      document.getElementById(
        "snapchat"
      ).value =
        client.snapchat || "";


      document.getElementById(
        "website"
      ).value =
        client.website || "";


      document.getElementById(
        "phone"
      ).value =
        client.phone || "";


      document.getElementById(
        "whatsapp"
      ).value =
        client.whatsapp || "";


      document.getElementById(
        "googleMaps"
      ).value =
        client.google_maps || "";


      /* =================================================
         IMAGES ACTUELLES
      ================================================= */

      currentProfileImage =
        client.profile_image || "";


      currentCoverImage =
        client.cover_image || "";


      if (currentProfileImage) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          currentProfileImage;

        img.className =
          "current-image";

        img.alt =
          "Photo actuelle";

        document
          .getElementById(
            "currentProfileContainer"
          )
          .appendChild(img);

      }


      if (currentCoverImage) {

        const img =
          document.createElement(
            "img"
          );

        img.src =
          currentCoverImage;

        img.className =
          "current-image";

        img.alt =
          "Couverture actuelle";

        document
          .getElementById(
            "currentCoverContainer"
          )
          .appendChild(img);

      }


      loading.style.display =
        "none";

      form.style.display =
        "block";


    } catch (error) {

      console.error(
        error
      );

      loading.style.display =
        "none";

      errorMessage.textContent =
        error.message ||
        "Impossible de charger le client.";

      errorMessage.style.display =
        "block";

    }

  }


  /* =====================================================
     PREVIEW NEW IMAGE
  ===================================================== */

  function showPreview(
    input,
    preview
  ) {

    const file =
      input.files[0];


    if (!file) {

      preview.style.display =
        "none";

      return;
    }


    const url =
      URL.createObjectURL(
        file
      );


    preview.src =
      url;


    preview.style.display =
      "block";

  }


  profileInput.addEventListener(
    "change",
    function () {

      showPreview(
        profileInput,
        profilePreview
      );


      if (
        profileInput.files[0]
      ) {

        profileCompression.style.display =
          "block";

        profileCompression.textContent =
          "Nouvelle image : " +
          formatKB(
            profileInput.files[0].size
          );

      }

    }
  );


  coverInput.addEventListener(
    "change",
    function () {

      showPreview(
        coverInput,
        coverPreview
      );


      if (
        coverInput.files[0]
      ) {

        coverCompression.style.display =
          "block";

        coverCompression.textContent =
          "Nouvelle image : " +
          formatKB(
            coverInput.files[0].size
          );

      }

    }
  );


  /* =====================================================
     COMPRESS IMAGE
  ===================================================== */

  async function compressImage(
    file,
    folder
  ) {

    if (!file) {
      return null;
    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      throw new Error(
        "Le fichier doit être une image."
      );

    }


    /*
      Taille maximale du fichier
      original avant compression.
    */

    if (
      file.size >
      25 * 1024 * 1024
    ) {

      throw new Error(
        "L'image originale doit faire moins de 25 MB."
      );

    }


    /* =================================================
       CHARGER IMAGE
    ================================================= */

    const image =
      new Image();


    const objectUrl =
      URL.createObjectURL(
        file
      );


    await new Promise(
      (resolve, reject) => {

        image.onload =
          resolve;


        image.onerror =
          () => {

            reject(
              new Error(
                "Impossible de lire l'image."
              )
            );

          };


        image.src =
          objectUrl;

      }
    );


    URL.revokeObjectURL(
      objectUrl
    );


    /* =================================================
       DIMENSIONS
    ================================================= */

    let maxWidth =
      folder === "profile"
        ? 700
        : 1200;


    let width =
      image.naturalWidth;


    let height =
      image.naturalHeight;


    if (
      width > maxWidth
    ) {

      const ratio =
        maxWidth / width;


      width =
        Math.round(
          width * ratio
        );


      height =
        Math.round(
          height * ratio
        );

    }


    /* =================================================
       CANVAS
    ================================================= */

    const canvas =
      document.createElement(
        "canvas"
      );


    const ctx =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    canvas.width =
      width;


    canvas.height =
      height;


    /*
      خلفية بيضاء للصور
      اللي فيها شفافية.
    */

    ctx.fillStyle =
      "#ffffff";


    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    ctx.drawImage(
      image,
      0,
      0,
      width,
      height
    );


    /* =================================================
       TARGET
    ================================================= */

    const MIN_SIZE =
      50 * 1024;


    const MAX_SIZE =
      100 * 1024;


    let quality =
      0.82;


    let blob =
      null;


    /* =================================================
       COMPRESSION QUALITÉ
    ================================================= */

    for (
      let i = 0;
      i < 10;
      i++
    ) {

      blob =
        await new Promise(
          resolve => {

            canvas.toBlob(
              resolve,
              "image/jpeg",
              quality
            );

          }
        );


      if (!blob) {

        throw new Error(
          "Impossible de compresser l'image."
        );

      }


      const size =
        blob.size;


      /*
        الحجم المطلوب
      */

      if (
        size >= MIN_SIZE &&
        size <= MAX_SIZE
      ) {

        break;

      }


      /*
        أكبر من 100 KB
      */

      if (
        size > MAX_SIZE
      ) {

        quality -=
          0.07;


        if (
          quality < 0.25
        ) {

          quality =
            0.25;

        }

      }


      /*
        أقل من 50 KB
      */

      if (
        size < MIN_SIZE
      ) {

        break;

      }

    }


    /* =================================================
       إذا مازال أكبر من 100 KB
       نقص الأبعاد
    ================================================= */

    if (
      blob &&
      blob.size > MAX_SIZE
    ) {

      for (
        let i = 0;
        i < 5;
        i++
      ) {

        width =
          Math.round(
            width * 0.85
          );


        height =
          Math.round(
            height * 0.85
          );


        canvas.width =
          width;


        canvas.height =
          height;


        ctx.fillStyle =
          "#ffffff";


        ctx.fillRect(
          0,
          0,
          width,
          height
        );


        ctx.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        blob =
          await new Promise(
            resolve => {

              canvas.toBlob(
                resolve,
                "image/jpeg",
                0.72
              );

            }
          );


        if (!blob) {

          throw new Error(
            "Impossible de compresser l'image."
          );

        }


        if (
          blob.size <= MAX_SIZE
        ) {

          break;

        }

      }

    }


    /* =================================================
       FILE FINAL
    ================================================= */

    const compressedFile =
      new File(
        [blob],
        "image.jpg",
        {
          type:
            "image/jpeg",

          lastModified:
            Date.now()
        }
      );


    console.log(
      "Original :",
      formatKB(
        file.size
      )
    );


    console.log(
      "Compressed :",
      formatKB(
        compressedFile.size
      )
    );


    return compressedFile;

  }


  /* =====================================================
     UPLOAD IMAGE
  ===================================================== */

  async function uploadImage(
    file,
    folder
  ) {

    if (!file) {
      return "";
    }


    /*
      ضغط الصورة أولاً
    */

    const compressedFile =
      await compressImage(
        file,
        folder
      );


    /*
      إظهار الحجم النهائي
    */

    const sizeText =
      formatKB(
        compressedFile.size
      );


    if (
      folder === "profile"
    ) {

      profileCompression.style.display =
        "block";


      profileCompression.textContent =
        "Image compressée : " +
        sizeText;

    } else {

      coverCompression.style.display =
        "block";


      coverCompression.textContent =
        "Image compressée : " +
        sizeText;

    }


    /* =================================================
       PATH
    ================================================= */

    const randomPart =
      Math.random()
        .toString(36)
        .substring(
          2,
          10
        );


    const timestamp =
      Date.now();


    const filePath =
      vendorSession.vendor_id +
      "/" +
      folder +
      "/" +
      timestamp +
      "-" +
      randomPart +
      ".jpg";


    /* =================================================
       UPLOAD
    ================================================= */

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          "client-images"
        )
        .upload(
          filePath,
          compressedFile,
          {
            cacheControl:
              "3600",

            upsert:
              false,

            contentType:
              "image/jpeg"
          }
        );


    if (error) {

      console.error(
        "Storage error:",
        error
      );


      throw new Error(
        "Impossible d'envoyer l'image : " +
        error.message
      );

    }


    /* =================================================
       PUBLIC URL
    ================================================= */

    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from(
          "client-images"
        )
        .getPublicUrl(
          data.path
        );


    return (
      publicData.publicUrl
    );

  }


  /* =====================================================
     SUBMIT
  ===================================================== */

  form.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      successMessage.style.display =
        "none";


      errorMessage.style.display =
        "none";


      submitBtn.disabled =
        true;


      submitBtn.textContent =
        "Préparation...";


      try {

        /* ===============================================
           DONNÉES
        =============================================== */

        const name =
          document
            .getElementById(
              "name"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "description"
            )
            .value
            .trim();


        const instagram =
          document
            .getElementById(
              "instagram"
            )
            .value
            .trim();


        const facebook =
          document
            .getElementById(
              "facebook"
            )
            .value
            .trim();


        const tiktok =
          document
            .getElementById(
              "tiktok"
            )
            .value
            .trim();


        const snapchat =
          document
            .getElementById(
              "snapchat"
            )
            .value
            .trim();


        const website =
          document
            .getElementById(
              "website"
            )
            .value
            .trim();


        const phone =
          document
            .getElementById(
              "phone"
            )
            .value
            .trim();


        const whatsapp =
          document
            .getElementById(
              "whatsapp"
            )
            .value
            .trim();


        const googleMaps =
          document
            .getElementById(
              "googleMaps"
            )
            .value
            .trim();


        if (!name) {

          throw new Error(
            "Veuillez entrer le nom du client."
          );

        }


        /* ===============================================
           IMAGES
        =============================================== */

        let profileImage =
          currentProfileImage;


        let coverImage =
          currentCoverImage;


        /*
          إذا اختار صورة Profile جديدة
          نضغطها ونرفعها
        */

        if (
          profileInput.files &&
          profileInput.files.length > 0
        ) {

          submitBtn.textContent =
            "Compression de la photo...";


          profileImage =
            await uploadImage(
              profileInput.files[0],
              "profile"
            );

        }


        /*
          إذا اختار Cover جديدة
        */

        if (
          coverInput.files &&
          coverInput.files.length > 0
        ) {

          submitBtn.textContent =
            "Compression de la couverture...";


          coverImage =
            await uploadImage(
              coverInput.files[0],
              "cover"
            );

        }


        /* ===============================================
           UPDATE
        =============================================== */

        submitBtn.textContent =
          "Enregistrement...";


        const {
          data,
          error
        } =
          await supabaseClient
            .rpc(
              "update_vendor_client",
              {
                p_session_token:
                  vendorSession.session_token,

                p_client_id:
                  Number(clientId),

                p_name:
                  name,

                p_description:
                  description,

                p_profile_image:
                  profileImage,

                p_cover_image:
                  coverImage,

                p_instagram:
                  instagram,

                p_facebook:
                  facebook,

                p_tiktok:
                  tiktok,

                p_snapchat:
                  snapchat,

                p_website:
                  website,

                p_phone:
                  phone,

                p_whatsapp:
                  whatsapp,

                p_google_maps:
                  googleMaps
              }
            );


        if (error) {

          console.error(
            "RPC error:",
            error
          );


          throw new Error(
            error.message
          );

        }


        /* ===============================================
           SUCCESS
        =============================================== */

        successMessage.textContent =
          "Client modifié avec succès.";

        successMessage.style.display =
          "block";


        submitBtn.textContent =
          "Modifications enregistrées ✓";


        /*
          Retour dashboard
        */

        setTimeout(
          () => {

            window.location.href =
              "vendor-dashboard.html";

          },
          1500
        );


      } catch (error) {

        console.error(
          error
        );


        errorMessage.textContent =
          error.message ||
          "Une erreur est survenue.";


        errorMessage.style.display =
          "block";


        submitBtn.disabled =
          false;


        submitBtn.textContent =
          "Enregistrer les modifications";

      }

    }
  );


  /* =====================================================
     START
  ===================================================== */

  loadClient();

</script>

</body>
</html>
