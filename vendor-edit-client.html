<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Modifier le client - TapTapCard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      background: #f6f6f7;

      font-family: Arial, sans-serif;

      color: #222;

    }


    .container {

      max-width: 700px;

      margin: auto;

    }


    .header {

      background: white;

      padding: 20px;

      border-radius: 18px;

      box-shadow: 0 5px 25px rgba(0,0,0,0.07);

      margin-bottom: 20px;

    }


    .top {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .back-button {

      border: none;

      background: #eee;

      width: 42px;

      height: 42px;

      border-radius: 12px;

      font-size: 20px;

      cursor: pointer;

      flex-shrink: 0;

    }


    h1 {

      margin: 0;

      font-size: 23px;

    }


    .subtitle {

      margin-top: 5px;

      color: #777;

      font-size: 13px;

    }


    .form-card {

      background: white;

      padding: 20px;

      border-radius: 18px;

      box-shadow: 0 5px 25px rgba(0,0,0,0.06);

    }


    .field {

      margin-bottom: 18px;

    }


    label {

      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: bold;

    }


    input,
    textarea {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ddd;

      border-radius: 11px;

      font-size: 15px;

      outline: none;

      font-family: inherit;

      background: white;

    }


    input:focus,
    textarea:focus {

      border-color: #222;

    }


    textarea {

      min-height: 100px;

      resize: vertical;

    }


    .section-title {

      margin-top: 25px;

      margin-bottom: 15px;

      padding-bottom: 8px;

      border-bottom: 1px solid #eee;

      font-size: 17px;

      font-weight: bold;

    }


    /* IMAGES */


    .image-section {

      margin-bottom: 22px;

    }


    .image-label {

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .image-preview {

      width: 100%;

      height: 180px;

      border-radius: 14px;

      object-fit: cover;

      background: #eee;

      display: block;

      margin-bottom: 10px;

    }


    .profile-preview {

      width: 120px;

      height: 120px;

      border-radius: 50%;

      object-fit: cover;

      background: #eee;

      display: block;

      margin-bottom: 10px;

    }


    input[type="file"] {

      padding: 10px;

      background: #f7f7f7;

      cursor: pointer;

    }


    .image-note {

      color: #888;

      font-size: 12px;

      margin-top: 6px;

    }


    /* SAVE */


    .save-button {

      width: 100%;

      border: none;

      background: #111;

      color: white;

      padding: 15px;

      border-radius: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;

    }


    .save-button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .cancel-button {

      width: 100%;

      border: none;

      background: #eee;

      color: #222;

      padding: 14px;

      border-radius: 12px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;

    }


    /* MESSAGES */


    .error {

      background: #fdeaea;

      color: #b42318;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 15px;

      display: none;

      word-break: break-word;

    }


    .success {

      background: #e9f8ed;

      color: #16753a;

      padding: 14px;

      border-radius: 12px;

      margin-bottom: 15px;

      display: none;

      word-break: break-word;

    }


    .loading {

      background: white;

      padding: 30px;

      border-radius: 16px;

      text-align: center;

      color: #777;

    }


    @media (max-width: 500px) {

      body {

        padding: 12px;

      }


      .form-card {

        padding: 16px;

      }


      .header {

        padding: 16px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- HEADER -->

    <div class="header">

      <div class="top">

        <button
          class="back-button"
          onclick="goBack()"
        >
          ←
        </button>


        <div>

          <h1>
            Modifier le client
          </h1>

          <div class="subtitle">
            Modifiez les informations de votre client
          </div>

        </div>

      </div>

    </div>


    <!-- ERROR -->

    <div
      id="errorMessage"
      class="error"
    ></div>


    <!-- SUCCESS -->

    <div
      id="successMessage"
      class="success"
    ></div>


    <!-- LOADING -->

    <div
      id="loading"
      class="loading"
    >
      Chargement du client...
    </div>


    <!-- FORM -->

    <div
      id="formCard"
      class="form-card"
      style="display:none;"
    >


      <form id="editForm">


        <!-- INFORMATIONS -->

        <div class="section-title">
          Informations
        </div>


        <div class="field">

          <label for="name">
            Nom du client
          </label>

          <input
            type="text"
            id="name"
            placeholder="Nom du client"
            required
          >

        </div>


        <div class="field">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Description de l'activité"
          ></textarea>

        </div>


        <!-- IMAGES -->

        <div class="section-title">
          Images
        </div>


        <div class="image-section">

          <div class="image-label">
            Photo de profil
          </div>


          <img
            id="profilePreview"
            class="profile-preview"
            src="https://placehold.co/150x150?text=Client"
            alt="Photo de profil"
          >


          <input
            type="file"
            id="profileImage"
            accept="image/*"
          >


          <div class="image-note">
            Laissez vide pour conserver l'image actuelle.
          </div>

        </div>


        <div class="image-section">

          <div class="image-label">
            Image de couverture
          </div>


          <img
            id="coverPreview"
            class="image-preview"
            src="https://placehold.co/800x300?text=Cover"
            alt="Image de couverture"
          >


          <input
            type="file"
            id="coverImage"
            accept="image/*"
          >


          <div class="image-note">
            Laissez vide pour conserver l'image actuelle.
          </div>

        </div>


        <!-- RESEAUX -->

        <div class="section-title">
          Réseaux sociaux
        </div>


        <div class="field">

          <label for="instagram">
            Instagram
          </label>

          <input
            type="url"
            id="instagram"
            placeholder="https://instagram.com/..."
          >

        </div>


        <div class="field">

          <label for="facebook">
            Facebook
          </label>

          <input
            type="url"
            id="facebook"
            placeholder="https://facebook.com/..."
          >

        </div>


        <div class="field">

          <label for="tiktok">
            TikTok
          </label>

          <input
            type="url"
            id="tiktok"
            placeholder="https://tiktok.com/@..."
          >

        </div>


        <div class="field">

          <label for="snapchat">
            Snapchat
          </label>

          <input
            type="text"
            id="snapchat"
            placeholder="@username"
          >

        </div>


        <div class="field">

          <label for="website">
            Website
          </label>

          <input
            type="url"
            id="website"
            placeholder="https://..."
          >

        </div>


        <!-- CONTACT -->

        <div class="section-title">
          Contact
        </div>


        <div class="field">

          <label for="phone">
            Téléphone
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="0550..."
          >

        </div>


        <div class="field">

          <label for="whatsapp">
            WhatsApp
          </label>

          <input
            type="tel"
            id="whatsapp"
            placeholder="0550..."
          >

        </div>


        <div class="field">

          <label for="googleMaps">
            Google Maps
          </label>

          <input
            type="url"
            id="googleMaps"
            placeholder="https://maps.google.com/..."
          >

        </div>


        <!-- BUTTONS -->

        <button
          type="submit"
          id="saveButton"
          class="save-button"
        >
          Enregistrer les modifications
        </button>


        <button
          type="button"
          class="cancel-button"
          onclick="goBack()"
        >
          Annuler
        </button>


      </form>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="supabase.js"></script>


  <script>

    /* =========================================
       SESSION
    ========================================= */

    const sessionData =
      localStorage.getItem(
        "vendor_session"
      );


    if (!sessionData) {

      window.location.href =
        "vendor.html";

    }


    let vendorSession;


    try {

      vendorSession =
        JSON.parse(sessionData);

    } catch (error) {

      localStorage.removeItem(
        "vendor_session"
      );

      window.location.href =
        "vendor.html";

    }


    /* =========================================
       CLIENT ID
    ========================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const clientId =
      params.get("id");


    if (!clientId) {

      window.location.href =
        "vendor-dashboard.html";

    }


    /* =========================================
       ELEMENTS
    ========================================= */

    const loading =
      document.getElementById(
        "loading"
      );


    const formCard =
      document.getElementById(
        "formCard"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const successMessage =
      document.getElementById(
        "successMessage"
      );


    const editForm =
      document.getElementById(
        "editForm"
      );


    const saveButton =
      document.getElementById(
        "saveButton"
      );


    const profilePreview =
      document.getElementById(
        "profilePreview"
      );


    const coverPreview =
      document.getElementById(
        "coverPreview"
      );


    const profileImageInput =
      document.getElementById(
        "profileImage"
      );


    const coverImageInput =
      document.getElementById(
        "coverImage"
      );


    /* =========================================
       CURRENT IMAGES
    ========================================= */

    let currentProfileImage = "";

    let currentCoverImage = "";


    /* =========================================
       ERROR
    ========================================= */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        "block";

      successMessage.style.display =
        "none";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function hideError() {

      errorMessage.style.display =
        "none";

    }


    /* =========================================
       SUCCESS
    ========================================= */

    function showSuccess(message) {

      successMessage.textContent =
        message;

      successMessage.style.display =
        "block";

      errorMessage.style.display =
        "none";

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================
       VERIFY SESSION
    ========================================= */

    async function verifySession() {

      if (
        !vendorSession ||
        !vendorSession.session_token
      ) {

        window.location.href =
          "vendor.html";

        return false;

      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "verify_vendor_session",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (
        error ||
        !data ||
        data.length === 0
      ) {

        localStorage.removeItem(
          "vendor_session"
        );

        window.location.href =
          "vendor.html";

        return false;

      }


      return true;

    }


    /* =========================================
       LOAD CLIENT
    ========================================= */

    async function loadClient() {

      hideError();


      loading.style.display =
        "block";


      formCard.style.display =
        "none";


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "get_vendor_clients",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (error) {

        console.error(
          "Load client error:",
          error
        );


        showError(
          error.message ||
          "Impossible de charger le client."
        );


        return;

      }


      const clients =
        data || [];


      const client =
        clients.find(
          function(item) {

            return Number(item.id) ===
              Number(clientId);

          }
        );


      if (!client) {

        showError(
          "Client introuvable ou accès refusé."
        );


        loading.innerHTML =
          "Client introuvable.";


        return;

      }


      /* ==========================
         INFORMATIONS
      ========================== */

      document.getElementById(
        "name"
      ).value =
        client.name || "";


      document.getElementById(
        "description"
      ).value =
        client.description || "";


      /* ==========================
         SOCIAL
      ========================== */

      document.getElementById(
        "instagram"
      ).value =
        client.instagram || "";


      document.getElementById(
        "facebook"
      ).value =
        client.facebook || "";


      document.getElementById(
        "tiktok"
      ).value =
        client.tiktok || "";


      document.getElementById(
        "snapchat"
      ).value =
        client.snapchat || "";


      document.getElementById(
        "website"
      ).value =
        client.website || "";


      /* ==========================
         CONTACT
      ========================== */

      document.getElementById(
        "phone"
      ).value =
        client.phone || "";


      document.getElementById(
        "whatsapp"
      ).value =
        client.whatsapp || "";


      document.getElementById(
        "googleMaps"
      ).value =
        client.google_maps || "";


      /* ==========================
         IMAGES
      ========================== */

      currentProfileImage =
        client.profile_image || "";


      currentCoverImage =
        client.cover_image || "";


      if (currentProfileImage) {

        profilePreview.src =
          currentProfileImage;

      }


      if (currentCoverImage) {

        coverPreview.src =
          currentCoverImage;

      }


      loading.style.display =
        "none";


      formCard.style.display =
        "block";

    }


    /* =========================================
       IMAGE PREVIEW
    ========================================= */

    profileImageInput.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (!file) {

          return;

        }


        if (!file.type.startsWith("image/")) {

          showError(
            "Le fichier doit être une image."
          );

          this.value = "";

          return;

        }


        const url =
          URL.createObjectURL(file);


        profilePreview.src =
          url;

      }
    );


    coverImageInput.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (!file) {

          return;

        }


        if (!file.type.startsWith("image/")) {

          showError(
            "Le fichier doit être une image."
          );

          this.value = "";

          return;

        }


        const url =
          URL.createObjectURL(file);


        coverPreview.src =
          url;

      }
    );


    /* =========================================
       UPLOAD IMAGE
    ========================================= */

    async function uploadImage(
      file,
      folder
    ) {

      if (!file) {

        return "";

      }


      if (!file.type.startsWith("image/")) {

        throw new Error(
          "Le fichier doit être une image."
        );

      }


      /*
        Limite 10 MB
      */

      if (
        file.size >
        10 * 1024 * 1024
      ) {

        throw new Error(
          "L'image doit faire moins de 10 MB."
        );

      }


      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const randomPart =
        Math.random()
          .toString(36)
          .substring(2, 10);


      const timestamp =
        Date.now();


      const filePath =
        vendorSession.vendor_id +
        "/" +
        folder +
        "/" +
        timestamp +
        "-" +
        randomPart +
        "." +
        extension;


      const {
        data,
        error
      } =
        await supabaseClient
          .storage
          .from("client-images")
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            }
          );


      if (error) {

        console.error(
          "Upload error:",
          error
        );


        throw new Error(
          "Impossible d'envoyer l'image : " +
          error.message
        );

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("client-images")
          .getPublicUrl(
            data.path
          );


      return publicData.publicUrl;

    }


    /* =========================================
       SUBMIT
    ========================================= */

    editForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        hideError();


        saveButton.disabled =
          true;


        saveButton.textContent =
          "Enregistrement...";


        try {

          /*
            Vérifier session
          */

          const valid =
            await verifySession();


          if (!valid) {

            return;

          }


          /*
            DONNÉES
          */

          const name =
            document.getElementById(
              "name"
            ).value.trim();


          const description =
            document.getElementById(
              "description"
            ).value.trim();


          const instagram =
            document.getElementById(
              "instagram"
            ).value.trim();


          const facebook =
            document.getElementById(
              "facebook"
            ).value.trim();


          const tiktok =
            document.getElementById(
              "tiktok"
            ).value.trim();


          const snapchat =
            document.getElementById(
              "snapchat"
            ).value.trim();


          const website =
            document.getElementById(
              "website"
            ).value.trim();


          const phone =
            document.getElementById(
              "phone"
            ).value.trim();


          const whatsapp =
            document.getElementById(
              "whatsapp"
            ).value.trim();


          const googleMaps =
            document.getElementById(
              "googleMaps"
            ).value.trim();


          if (!name) {

            throw new Error(
              "Veuillez entrer le nom du client."
            );

          }


          /*
            IMAGES
          */

          let profileImage =
            currentProfileImage;


          let coverImage =
            currentCoverImage;


          /*
            Nouvelle photo profil
          */

          if (
            profileImageInput.files &&
            profileImageInput.files.length > 0
          ) {

            saveButton.textContent =
              "Envoi de la photo de profil...";


            profileImage =
              await uploadImage(
                profileImageInput.files[0],
                "profile"
              );

          }


          /*
            Nouvelle cover
          */

          if (
            coverImageInput.files &&
            coverImageInput.files.length > 0
          ) {

            saveButton.textContent =
              "Envoi de la couverture...";


            coverImage =
              await uploadImage(
                coverImageInput.files[0],
                "cover"
              );

          }


          /*
            UPDATE
          */

          saveButton.textContent =
            "Enregistrement...";


          const {
            data,
            error
          } =
            await supabaseClient.rpc(
              "update_vendor_client",
              {

                p_session_token:
                  vendorSession.session_token,

                p_client_id:
                  Number(clientId),

                p_name:
                  name,

                p_description:
                  description,

                p_profile_image:
                  profileImage,

                p_cover_image:
                  coverImage,

                p_instagram:
                  instagram,

                p_facebook:
                  facebook,

                p_tiktok:
                  tiktok,

                p_snapchat:
                  snapchat,

                p_website:
                  website,

                p_phone:
                  phone,

                p_whatsapp:
                  whatsapp,

                p_google_maps:
                  googleMaps

              }
            );


          if (error) {

            console.error(
              "Update error:",
              error
            );


            throw new Error(
              error.message ||
              "Impossible d'enregistrer les modifications."
            );

          }


          showSuccess(
            "Les modifications ont été enregistrées avec succès."
          );


          saveButton.textContent =
            "Modifications enregistrées ✓";


          /*
            Retour Dashboard
            après 1 seconde
          */

          setTimeout(
            function() {

              window.location.href =
                "vendor-dashboard.html";

            },
            1000
          );


        } catch (error) {

          console.error(error);


          showError(
            error.message ||
            "Une erreur est survenue."
          );


          saveButton.disabled =
            false;


          saveButton.textContent =
            "Enregistrer les modifications";

        }

      }
    );


    /* =========================================
       BACK
    ========================================= */

    function goBack() {

      window.location.href =
        "vendor-dashboard.html";

    }


    /* =========================================
       INIT
    ========================================= */

    async function init() {

      const valid =
        await verifySession();


      if (!valid) {

        return;

      }


      await loadClient();

    }


    init();

  </script>

</body>

</html>
