<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard — Modifier le client</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      padding-bottom: 40px;
    }

    header {
      background: white;
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .back-button {
      border: 1px solid #ddd;
      background: white;
      color: #222;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    main {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 25px 20px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h2 {
      margin: 0 0 6px;
    }

    .page-title p {
      margin: 0;
      color: #777;
    }

    .form-card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #999;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .section-title {
      margin: 28px 0 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .image-preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
      display: none;
      background: #eee;
    }

    .image-preview.show {
      display: block;
    }

    .file-info {
      color: #777;
      font-size: 12px;
      margin-top: 6px;
    }

    .save-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cancel-button {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      color: #222;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 500px) {
      .form-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>TapTapCard</h1>

    <button
      type="button"
      id="backButton"
      class="back-button"
    >
      ← Mes clients
    </button>

  </header>


  <main>

    <div class="page-title">

      <h2>Modifier le client</h2>

      <p>
        Modifiez les informations de votre client.
      </p>

    </div>


    <div
      id="loading"
      class="loading"
    >
      Chargement...
    </div>


    <div
      id="formContainer"
      class="form-card"
      style="display: none;"
    >

      <form id="editClientForm">


        <!-- =========================
             Informations
             ========================= -->

        <h3 class="section-title">
          Informations
        </h3>


        <div class="field">

          <label for="name">
            Nom du client
          </label>

          <input
            type="text"
            id="name"
            placeholder="Ex : Nom du client"
            required
          >

        </div>


        <div class="field">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Description de l'activité"
          ></textarea>

        </div>


        <!-- =========================
             Réseaux sociaux
             ========================= -->

        <h3 class="section-title">
          Réseaux sociaux
        </h3>


        <div class="field">

          <label for="instagram">
            Instagram
          </label>

          <input
            type="url"
            id="instagram"
            placeholder="https://instagram.com/..."
          >

        </div>


        <div class="field">

          <label for="facebook">
            Facebook
          </label>

          <input
            type="url"
            id="facebook"
            placeholder="https://facebook.com/..."
          >

        </div>


        <div class="field">

          <label for="tiktok">
            TikTok
          </label>

          <input
            type="url"
            id="tiktok"
            placeholder="https://tiktok.com/@..."
          >

        </div>


        <div class="field">

          <label for="snapchat">
            Snapchat
          </label>

          <input
            type="text"
            id="snapchat"
            placeholder="Nom d'utilisateur Snapchat"
          >

        </div>


        <div class="field">

          <label for="website">
            Website
          </label>

          <input
            type="url"
            id="website"
            placeholder="https://..."
          >

        </div>


        <!-- =========================
             Contact
             ========================= -->

        <h3 class="section-title">
          Contact
        </h3>


        <div class="field">

          <label for="phone">
            Téléphone
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="0550..."
          >

        </div>


        <div class="field">

          <label for="whatsapp">
            WhatsApp
          </label>

          <input
            type="tel"
            id="whatsapp"
            placeholder="0550..."
          >

        </div>


        <div class="field">

          <label for="googleMaps">
            Google Maps
          </label>

          <input
            type="url"
            id="googleMaps"
            placeholder="Lien Google Maps"
          >

        </div>


        <!-- =========================
             Images
             ========================= -->

        <h3 class="section-title">
          Images
        </h3>


        <div class="field">

          <label>
            Photo de profil actuelle
          </label>

          <img
            id="profilePreview"
            class="image
