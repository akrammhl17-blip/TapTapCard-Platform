<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard — Mes clients</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
      padding-bottom: 40px;
    }

    header {
      background: white;
      padding: 18px 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .back-button {
      border: 1px solid #ddd;
      background: white;
      color: #222;
      padding: 9px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 25px 20px;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header h2 {
      margin: 0 0 6px;
    }

    .page-header p {
      margin: 0;
      color: #777;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .refresh-button {
      border: none;
      background: #111;
      color: white;
      padding: 11px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
    }

    .clients-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .client-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    .client-info {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .client-image {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }

    .client-image-placeholder {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      flex-shrink: 0;
    }

    .client-details {
      min-width: 0;
    }

    .client-name {
      margin: 0 0 5px;
      font-size: 18px;
      word-break: break-word;
    }

    .client-description {
      margin: 0;
      color: #777;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .client-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-button {
      border: none;
      padding: 11px 8px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      background: #111;
      color: white;
    }

    .action-button.secondary {
      background: #f0f0f0;
      color: #222;
    }

    .action-button.delete {
      background: #fbeaea;
      color: #c62828;
    }

    .action-button:hover {
      opacity: 0.85;
    }

    .empty-state {
      background: white;
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    .empty-state .icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .empty-state h3 {
      margin: 0 0 8px;
    }

    .empty-state p {
      margin: 0 0 20px;
      color: #777;
    }

    .add-button {
      border: none;
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 600px) {

      header {
        padding: 15px;
      }

      main {
        padding: 20px 15px;
      }

      .client-actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-button {
        padding: 12px 8px;
      }

    }
  </style>
</head>

<body>

  <header>

    <h1>TapTapCard</h1>

    <button
      id="backButton"
      class="back-button"
    >
      ← Dashboard
    </button>

  </header>


  <main>

    <div class="page-header">

      <h2>Mes clients</h2>

      <p>
        Gérez les pages digitales de vos clients.
      </p>

    </div>


    <div class="top-actions">

      <button
        id="refreshButton"
        class="refresh-button"
      >
        🔄 Actualiser
      </button>

    </div>


    <div id="message"></div>


    <div
      id="clientsList"
      class="clients-list"
    ></div>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>


  <script>

    // =========================
    // Vérifier la connexion
    // =========================

    async function checkUser() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        window.location.href = "index.html";

        return false;

      }


      return true;

    }


    // =========================
    // Message
    // =========================

    function showMessage(text) {

      document.getElementById("message").textContent = text;

    }


    // =========================
    // Générer le lien client
    // =========================

    function getClientLink(clientId) {

      const url =
        new URL(
          "client.html",
          window.location.href
        );

      url.searchParams.set(
        "id",
        clientId
      );

      return url.href;

    }


    // =========================
    // Copier le lien
    // =========================

    async function copyClientLink(clientId) {

      const link =
        getClientLink(clientId);


      try {

        await navigator.clipboard.writeText(link);

        showMessage(
          "Lien client copié avec succès."
        );


        setTimeout(() => {

          showMessage("");

        }, 2500);


      } catch (error) {

        console.error(error);

        showMessage(
          "Impossible de copier le lien."
        );

      }

    }


    // =========================
    // فتح صفحة العميل
    // =========================

    function openClientPage(clientId) {

      const link =
        getClientLink(clientId);

      window.open(
        link,
        "_blank"
      );

    }


    // =========================
    // تعديل العميل
    // =========================

    function editClient(clientId) {

      window.location.href =
        "edit-client.html?id=" +
        encodeURIComponent(clientId);

    }


    // =========================
    // حذف العميل
    // =========================

    async function deleteClient(clientId) {

      const confirmed =
        confirm(
          "Voulez-vous vraiment supprimer ce client ?"
        );


      if (!confirmed) {

        return;

      }


      showMessage(
        "Suppression en cours..."
      );


      // حذف الصور من Storage
      const { data: files } =
        await supabaseClient.storage
          .from("client-images")
          .list(
            getStorageFolder(clientId)
          );


      if (files && files.length > 0) {

        const filePaths =
          files.map(
            file =>
              getStorageFolder(clientId) +
              "/" +
              file.name
          );


        const { error: storageError } =
          await supabaseClient.storage
            .from("client-images")
            .remove(filePaths);


        if (storageError) {

          console.error(
            "Storage error:",
            storageError
          );

        }

      }


      // حذف العميل من قاعدة البيانات
      const { error } =
        await supabaseClient
          .from("clients")
          .delete()
          .eq("id", clientId);


      if (error) {

        console.error(error);

        showMessage(
          "Erreur : " + error.message
        );

        return;

      }


      showMessage(
        "Client supprimé avec succès."
      );


      loadClients();

    }


    // =========================
    // مسار ملفات العميل
    // =========================

    async function getVendorId() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();


      if (!user) {

        return null;

      }


      const { data, error } =
        await supabaseClient
          .from("vendors")
          .select("id")
          .eq("user_id", user.id)
          .single();


      if (error) {

        console.error(error);

        return null;

      }


      return data.id;

    }


    let cachedVendorId = null;


    function getStorageFolder(clientId) {

      return (
        cachedVendorId +
        "/" +
        clientId
      );

    }


    // =========================
    // إنشاء بطاقة العميل
    // =========================

    function createClientCard(client) {

      const card =
        document.createElement("div");

      card.className =
        "client-card";


      const info =
        document.createElement("div");

      info.className =
        "client-info";


      // صورة العميل
      if (client.profile_image) {

        const image =
          document.createElement("img");

        image.className =
          "client-image";

        image.src =
          client.profile_image;

        image.alt =
          client.name || "Client";

        info.appendChild(image);

      } else {

        const placeholder =
          document.createElement("div");

        placeholder.className =
          "client-image-placeholder";

        placeholder.textContent =
          "👤";

        info.appendChild(
          placeholder
        );

      }


      // معلومات العميل
      const details =
        document.createElement("div");

      details.className =
        "client-details";


      const name =
        document.createElement("h3");

      name.className =
        "client-name";

      name.textContent =
        client.name || "Nom du client";


      const description =
        document.createElement("p");

      description.className =
        "client-description";

      description.textContent =
        client.description ||
        "Aucune description";


      details.appendChild(name);

      details.appendChild(description);

      info.appendChild(details);


      // الأزرار
      const actions =
        document.createElement("div");

      actions.className =
        "client-actions";


      // فتح
      const openButton =
        document.createElement("button");

      openButton.className =
        "action-button";

      openButton.textContent =
        "👁️ Ouvrir";

      openButton.addEventListener(
        "click",
        () => {
          openClientPage(client.id);
        }
      );


      // تعديل
      const editButton =
        document.createElement("button");

      editButton.className =
        "action-button secondary";

      editButton.textContent =
        "✏️ Modifier";

      editButton.addEventListener(
        "click",
        () => {
          editClient(client.id);
        }
      );


      // نسخ الرابط
      const copyButton =
        document.createElement("button");

      copyButton.className =
        "action-button secondary";

      copyButton.textContent =
        "🔗 Copier";

      copyButton.addEventListener(
        "click",
        () => {
          copyClientLink(client.id);
        }
      );


      // حذف
      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "action-button delete";

      deleteButton.textContent =
        "🗑️ Supprimer";

      deleteButton.addEventListener(
        "click",
        () => {
          deleteClient(client.id);
        }
      );


      actions.appendChild(openButton);

      actions.appendChild(editButton);

      actions.appendChild(copyButton);

      actions.appendChild(deleteButton);


      card.appendChild(info);

      card.appendChild(actions);


      return card;

    }


    // =========================
    // تحميل العملاء
    // =========================

    async function loadClients() {

      const clientsList =
        document.getElementById(
          "clientsList"
        );


      clientsList.innerHTML = "";

      showMessage(
        "Chargement des clients..."
      );


      const { data, error } =
        await supabaseClient
          .from("clients")
          .select(`
            id,
            name,
            description,
            profile_image,
            cover_image,
            instagram,
            facebook,
            tiktok,
            snapchat,
            website,
            phone,
            whatsapp,
            google_maps,
            created_at
          `)
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        showMessage(
          "Erreur : " +
          error.message
        );

        return;

      }


      showMessage("");


      if (!data || data.length === 0) {

        const empty =
          document.createElement("div");

        empty.className =
          "empty-state";


        empty.innerHTML = `
          <div class="icon">👥</div>

          <h3>Aucun client</h3>

          <p>
            Vous n'avez pas encore ajouté de client.
          </p>

          <button
            class="add-button"
            id="emptyAddButton"
          >
            ➕ Ajouter un client
          </button>
        `;


        clientsList.appendChild(empty);


        document
          .getElementById("emptyAddButton")
          .addEventListener(
            "click",
            () => {

              window.location.href =
                "add-client.html";

            }
          );


        return;

      }


      data.forEach(client => {

        const card =
          createClientCard(client);

        clientsList.appendChild(card);

      });

    }


    // =========================
    // الأزرار الرئيسية
    // =========================

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "dashboard.html";

        }
      );


    document
      .getElementById("refreshButton")
      .addEventListener(
        "click",
        () => {

          loadClients();

        }
      );


    // =========================
    // تشغيل الصفحة
    // =========================

    async function initializePage() {

      const loggedIn =
        await checkUser();


      if (!loggedIn) {

        return;

      }


      cachedVendorId =
        await getVendorId();


      if (!cachedVendorId) {

        showMessage(
          "Impossible de trouver votre compte vendeur."
        );

        return;

      }


      loadClients();

    }


    initializePage();

  </script>

</body>
  </html>
