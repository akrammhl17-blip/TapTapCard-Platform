<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TAPTAPCARD Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          135deg,
          #faf9f7,
          #eef1f4,
          #e4e8ed
        );
      color: #332522;
      min-height: 100vh;
    }


    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      padding: 30px 0 50px;
    }


    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }


    .brand h1 {
      margin: 0;
      font-size: 28px;
    }


    .brand p {
      margin: 6px 0 0;
      color: #777;
      font-size: 14px;
    }


    .logout {
      border: none;
      background: #332522;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }


    .logout:hover {
      opacity: .9;
    }


    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-bottom: 30px;
    }


    .stat {
      background:
        rgba(255,255,255,.9);

      border-radius: 18px;

      padding: 22px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.07);
    }


    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }


    .stat-number {
      font-size: 32px;
      font-weight: bold;
    }


    .panel {
      background:
        rgba(255,255,255,.92);

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.08);
    }


    .panel-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }


    .panel-header h2 {
      margin: 0;
    }


    #search {
      width: 270px;

      padding: 12px 14px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      outline: none;

      font-size: 14px;
    }


    .table-wrapper {
      overflow-x: auto;
    }


    table {
      width: 100%;

      border-collapse:
        collapse;

      min-width: 700px;
    }


    th,
    td {
      padding: 15px 12px;

      text-align: left;

      border-bottom:
        1px solid #eee;
    }


    th {
      color: #777;

      font-size: 13px;

      font-weight: normal;
    }


    td {
      font-size: 14px;
    }


    .status {
      display: inline-block;

      padding: 6px 11px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }


    .active {
      background: #e6f7ed;
      color: #16834b;
    }


    .inactive {
      background: #fde8e8;
      color: #c62828;
    }


    .action-btn {
      border: none;

      padding: 8px 12px;

      border-radius: 9px;

      cursor: pointer;

      font-size: 13px;
    }


    .disable-btn {
      background: #ffe8e8;
      color: #c62828;
    }


    .enable-btn {
      background: #e5f7ec;
      color: #16834b;
    }


    .admin-label {
      color: #777;

      font-size: 12px;
    }


    .message {
      text-align: center;

      padding: 30px;

      color: #777;
    }


    .error-box {
      display: none;

      background: #fff0f0;

      color: #b42318;

      padding: 15px;

      border-radius: 12px;

      margin-bottom: 20px;

      word-break: break-word;
    }


    .loading {
      text-align: center;

      padding: 50px 20px;

      color: #777;
    }


    @media (max-width: 700px) {

      .container {
        width: 94%;

        padding-top: 20px;
      }


      header {
        align-items: flex-start;

        flex-direction: column;
      }


      .stats {
        grid-template-columns: 1fr;
      }


      .panel-header {
        align-items: stretch;

        flex-direction: column;
      }


      #search {
        width: 100%;
      }


      .brand h1 {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <header>

    <div class="brand">

      <h1>
        TAPTAPCARD Admin
      </h1>

      <p>
        Gestion de la plateforme
      </p>

    </div>


    <button
      class="logout"
      id="logoutBtn"
    >
      Déconnexion
    </button>

  </header>



  <div
    class="error-box"
    id="errorBox"
  ></div>



  <section class="stats">


    <div class="stat">

      <div class="stat-title">
        Total vendeurs
      </div>

      <div
        class="stat-number"
        id="totalVendors"
      >
        0
      </div>

    </div>



    <div class="stat">

      <div class="stat-title">
        Vendeurs actifs
      </div>

      <div
        class="stat-number"
        id="activeVendors"
      >
        0
      </div>

    </div>



    <div class="stat">

      <div class="stat-title">
        Total clients
      </div>

      <div
        class="stat-number"
        id="totalClients"
      >
        0
      </div>

    </div>


  </section>



  <section class="panel">


    <div class="panel-header">

      <h2>
        Vendeurs
      </h2>


      <input
        type="text"
        id="search"
        placeholder="Rechercher un vendeur..."
      >

    </div>



    <div class="table-wrapper">


      <table>


        <thead>

          <tr>

            <th>
              Nom
            </th>

            <th>
              Email
            </th>

            <th>
              Statut
            </th>

            <th>
              Clients
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>



        <tbody id="vendorsTable">

          <tr>

            <td
              colspan="5"
              class="loading"
            >
              Vérification...
            </td>

          </tr>

        </tbody>


      </table>


    </div>


  </section>


</div>



<script>


// ======================================
// VARIABLES
// ======================================

let vendors = [];

let clientCounts = {};

let currentUser = null;



// ======================================
// INITIALISATION
// ======================================

async function init() {


  try {


    // ------------------------------
    // 1. UTILISATEUR CONNECTÉ
    // ------------------------------

    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {

      showError(
        "Erreur Auth : " +
        userError.message
      );

      return;
    }


    if (!user) {

      window.location.href =
        "index.html";

      return;
    }


    currentUser = user;



    // ------------------------------
    // 2. CHERCHER LE VENDEUR
    // ------------------------------

    const {
      data: vendor,
      error: vendorError
    } =
      await supabaseClient
        .from("vendors")
        .select(`
          id,
          name,
          email,
          status,
          role,
          user_id
        `)
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if (vendorError) {

      showError(
        "Erreur lors de la vérification du compte : " +
        vendorError.message
      );

      return;
    }



    // ------------------------------
    // 3. AUCUN VENDEUR
    // ------------------------------

    if (!vendor) {

      document.body.innerHTML = `

        <div style="
          text-align:center;
          padding:80px 20px;
          font-family:Arial;
        ">

          <h2>
            Accès refusé
          </h2>

          <p>
            Aucun compte vendeur associé à cet utilisateur.
          </p>

          <a href="dashboard.html">
            Retour au Dashboard
          </a>

        </div>

      `;

      return;
    }



    // ------------------------------
    // 4. VÉRIFICATION ROLE
    // ------------------------------

    const role =
      String(
        vendor.role || ""
      )
      .trim()
      .toLowerCase();


    const status =
      String(
        vendor.status || ""
      )
      .trim()
      .toLowerCase();



    if (
      role !== "admin" ||
      status !== "active"
    ) {


      document.body.innerHTML = `

        <div style="
          text-align:center;
          padding:80px 20px;
          font-family:Arial;
        ">

          <h2>
            Accès refusé
          </h2>

          <p>
            Cette page est réservée à l'administrateur.
          </p>

          <p style="
            color:#777;
            font-size:13px;
          ">
            Role : ${escapeHtml(role)}
            <br>
            Status : ${escapeHtml(status)}
          </p>

          <a href="dashboard.html">
            Retour au Dashboard
          </a>

        </div>

      `;

      return;
    }



    // ------------------------------
    // 5. CHARGER LES DONNÉES
    // ------------------------------

    await loadVendors();

    await loadClients();


    updateStats();

    renderVendors();


  }

  catch (error) {

    console.error(error);

    showError(
      "Erreur inattendue : " +
      error.message
    );

  }

}



// ======================================
// CHARGER VENDEURS
// ======================================

async function loadVendors() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("vendors")
      .select(`
        id,
        name,
        email,
        status,
        role,
        created_at
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    throw error;

  }


  vendors =
    data || [];

}



// ======================================
// CHARGER CLIENTS
// ======================================

async function loadClients() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("clients")
      .select(
        "vendor_id"
      );


  if (error) {

    throw error;

  }


  clientCounts = {};


  (
    data || []
  ).forEach(
    client => {


      const vendorId =
        client.vendor_id;


      if (
        !clientCounts[
          vendorId
        ]
      ) {

        clientCounts[
          vendorId
        ] = 0;

      }


      clientCounts[
        vendorId
      ]++;

    }
  );

}



// ======================================
// STATISTIQUES
// ======================================

function updateStats() {


  const total =
    vendors.length;


  const active =
    vendors.filter(
      vendor =>
        String(
          vendor.status || ""
        )
        .trim()
        .toLowerCase()
        === "active"
    ).length;


  const totalClients =
    Object.values(
      clientCounts
    ).reduce(
      (
        total,
        count
      ) =>
        total + count,
      0
    );


  document.getElementById(
    "totalVendors"
  ).textContent =
    total;


  document.getElementById(
    "activeVendors"
  ).textContent =
    active;


  document.getElementById(
    "totalClients"
  ).textContent =
    totalClients;

}



// ======================================
// AFFICHER VENDEURS
// ======================================

function renderVendors(
  filter = ""
) {


  const table =
    document.getElementById(
      "vendorsTable"
    );


  const search =
    filter
      .toLowerCase()
      .trim();


  const filtered =
    vendors.filter(
      vendor => {


        const name =
          String(
            vendor.name || ""
          )
          .toLowerCase();


        const email =
          String(
            vendor.email || ""
          )
          .toLowerCase();


        return (
          name.includes(search) ||
          email.includes(search)
        );

      }
    );



  if (!filtered.length) {

    table.innerHTML = `

      <tr>

        <td
          colspan="5"
          class="message"
        >
          Aucun vendeur trouvé.
        </td>

      </tr>

    `;

    return;
  }



  table.innerHTML =
    filtered.map(
      vendor => {


        const status =
          String(
            vendor.status || ""
          )
          .trim()
          .toLowerCase();


        const role =
          String(
            vendor.role || ""
          )
          .trim()
          .toLowerCase();


        const active =
          status === "active";


        const count =
          clientCounts[
            vendor.id
          ] || 0;


        let action = "";



        if (
          role === "admin"
        ) {

          action = `

            <span class="admin-label">
              Administrateur
            </span>

          `;

        }

        else {


          action = `

            <button
              class="
                action-btn
                ${
                  active
                    ? "disable-btn"
                    : "enable-btn"
                }
              "
              onclick="
                toggleVendor(
                  ${vendor.id},
                  '${
                    active
                      ? "inactive"
                      : "active"
                  }'
                )
              "
            >

              ${
                active
                  ? "Suspendre"
                  : "Activer"
              }

            </button>

          `;

        }



        return `

          <tr>


            <td>

              <strong>

                ${
                  escapeHtml(
                    vendor.name ||
                    "Sans nom"
                  )
                }

              </strong>

            </td>



            <td>

              ${
                escapeHtml(
                  vendor.email ||
                  "-"
                )
              }

            </td>



            <td>

              <span
                class="
                  status
                  ${
                    active
                      ? "active"
                      : "inactive"
                  }
                "
              >

                ${
                  active
                    ? "Actif"
                    : "Suspendu"
                }

              </span>

            </td>



            <td>

              ${count}

            </td>



            <td>

              ${action}

            </td>


          </tr>

        `;

      }
    ).join("");

}



// ======================================
// ACTIVER / SUSPENDRE
// ======================================

async function toggleVendor(
  vendorId,
  newStatus
) {


  const vendor =
    vendors.find(
      item =>
        item.id === vendorId
    );


  if (!vendor) {

    return;

  }


  const action =
    newStatus === "active"
      ? "activer"
      : "suspendre";


  if (
    !confirm(
      `Voulez-vous ${action} ce vendeur ?`
    )
  ) {

    return;

  }



  const {
    error
  } =
    await supabaseClient
      .from("vendors")
      .update({
        status: newStatus
      })
      .eq(
        "id",
        vendorId
      );


  if (error) {

    alert(
      "Erreur : " +
      error.message
    );

    return;

  }


  vendor.status =
    newStatus;


  renderVendors(
    document.getElementById(
      "search"
    ).value
  );


  updateStats();

}



// ======================================
// RECHERCHE
// ======================================

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    event => {

      renderVendors(
        event.target.value
      );

    }
  );



// ======================================
// LOGOUT
// ======================================

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async () => {


      await supabaseClient
        .auth
        .signOut();


      window.location.href =
        "index.html";

    }
  );



// ======================================
// ERROR
// ======================================

function showError(
  message
) {


  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.style.display =
    "block";

}



// ======================================
// حماية HTML
// ======================================

function escapeHtml(
  value
) {


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



// ======================================
// START
// ======================================

init();

</script>


</body>

  </html>
