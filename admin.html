<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    header {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    header h1 {
      font-size: 24px;
    }

    header p {
      margin-top: 5px;
      color: #777;
    }

    .logout-btn {
      border: none;
      background: #222;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .stat-card span {
      display: block;
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-card strong {
      font-size: 28px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      font-size: 20px;
    }

    .search {
      width: 260px;
      padding: 11px 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      font-size: 13px;
      color: #777;
      background: #fafafa;
    }

    td {
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .status.active {
      background: #e8f7ed;
      color: #16833b;
    }

    .status.inactive {
      background: #fdeaea;
      color: #c62828;
    }

    .links-count {
      font-weight: bold;
      font-size: 18px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .reset-btn {
      background: #222;
      color: white;
    }

    .history-btn {
      background: #eee;
      color: #222;
    }

    .action-btn:hover {
      opacity: 0.85;
    }

    .message {
      padding: 20px;
      text-align: center;
      color: #777;
    }

    .error {
      background: #ffe9e9;
      color: #c62828;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    /* Modal */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 18px;
      padding: 22px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 20px;
    }

    .close-btn {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .history-item {
      padding: 14px;
      border: 1px solid #eee;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .history-count {
      font-weight: bold;
    }

    .history-date {
      color: #777;
      font-size: 13px;
      text-align: right;
    }

    @media (max-width: 700px) {

      body {
        padding: 12px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .panel-header {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div>
      <h1>TAPTAPCARD Admin</h1>
      <p id="welcome">Chargement...</p>
    </div>

    <button class="logout-btn" onclick="logout()">
      Déconnexion
    </button>
  </header>


  <div id="errorBox" class="error"></div>


  <section class="stats">

    <div class="stat-card">
      <span>Total vendeurs</span>
      <strong id="totalVendors">0</strong>
    </div>

    <div class="stat-card">
      <span>Vendeurs actifs</span>
      <strong id="activeVendors">0</strong>
    </div>

    <div class="stat-card">
      <span>Liens actifs à compter</span>
      <strong id="totalLinks">0</strong>
    </div>

  </section>


  <section class="panel">

    <div class="panel-header">

      <h2>Gestion des vendeurs</h2>

      <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Rechercher un vendeur..."
        oninput="renderVendors()"
      >

    </div>


    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Statut</th>
            <th>Liens actuels</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="vendorsTable">
          <tr>
            <td colspan="5" class="message">
              Chargement...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </section>

</div>


<!-- HISTORY MODAL -->

<div id="historyModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h3 id="historyTitle">
        Historique
      </h3>

      <button
        class="close-btn"
        onclick="closeHistory()"
      >
        ×
      </button>

    </div>

    <div id="historyContent">
      Chargement...
    </div>

  </div>

</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://ogenizijjumwkiiikhrx.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_-83cFPPEgtOhG7G_MVsjaQ_UFoAnoIc";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let currentUser = null;

  let currentAdmin = null;

  let vendors = [];

  let clients = [];

  let resets = [];


  /* =========================
     START
  ========================= */

  document.addEventListener(
    "DOMContentLoaded",
    init
  );


  async function init() {

    try {

      const {
        data: {
          user
        },
        error
      } = await supabaseClient.auth.getUser();


      if (error || !user) {

        window.location.href = "index.html";

        return;
      }


      currentUser = user;


      /*
        نجيب معلومات المستخدم من vendors
        باش نتأكد أنه Admin
      */

      const {
        data: vendor,
        error: vendorError
      } = await supabaseClient
        .from("vendors")
        .select(`
          id,
          name,
          email,
          role,
          status,
          user_id
        `)
        .eq("user_id", user.id)
        .maybeSingle();


      if (vendorError) {

        showError(
          "Erreur : " + vendorError.message
        );

        return;
      }


      if (!vendor) {

        showError(
          "Accès refusé."
        );

        return;
      }


      const role =
        String(vendor.role || "")
          .trim()
          .toLowerCase();

      const status =
        String(vendor.status || "")
          .trim()
          .toLowerCase();


      if (
        role !== "admin" ||
        status !== "active"
      ) {

        showError(
          "Accès refusé."
        );

        return;
      }


      currentAdmin = vendor;


      document.getElementById(
        "welcome"
      ).textContent =
        "Bienvenue " +
        (vendor.name || "Admin");


      await loadData();

    } catch (error) {

      showError(
        "Erreur : " + error.message
      );

    }

  }


  /* =========================
     LOAD ALL DATA
  ========================= */

  async function loadData() {

    await loadVendors();

    await loadClients();

    await loadResets();

    updateStats();

    renderVendors();

  }


  /* =========================
     LOAD VENDORS
  ========================= */

  async function loadVendors() {

    const {
      data,
      error
    } = await supabaseClient
      .from("vendors")
      .select(`
        id,
        name,
        email,
        role,
        status,
        user_id,
        created_at
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      showError(
        "Erreur vendeurs : " +
        error.message
      );

      return;
    }


    vendors = data || [];

  }


  /* =========================
     LOAD CLIENTS
  ========================= */

  async function loadClients() {

    const {
      data,
      error
    } = await supabaseClient
      .from("clients")
      .select(`
        id,
        vendor_id,
        created_at
      `);


    if (error) {

      showError(
        "Erreur clients : " +
        error.message
      );

      return;
    }


    clients = data || [];

  }


  /* =========================
     LOAD RESETS
  ========================= */

  async function loadResets() {

    const {
      data,
      error
    } = await supabaseClient
      .from("vendor_resets")
      .select(`
        id,
        vendor_id,
        units_count,
        reset_at
      `)
      .order(
        "reset_at",
        {
          ascending: false
        }
      );


    if (error) {

      showError(
        "Erreur historique : " +
        error.message
      );

      return;
    }


    resets = data || [];

  }


  /* =========================
     LAST RESET
  ========================= */

  function getLastReset(vendorId) {

    const vendorResets =
      resets
        .filter(
          reset =>
            Number(reset.vendor_id) ===
            Number(vendorId)
        )
        .sort(
          (a, b) =>
            new Date(b.reset_at) -
            new Date(a.reset_at)
        );


    return vendorResets.length
      ? vendorResets[0]
      : null;

  }


  /* =========================
     CURRENT LINKS
  ========================= */

  function getCurrentLinks(vendorId) {

    const lastReset =
      getLastReset(vendorId);


    const resetDate =
      lastReset
        ? new Date(lastReset.reset_at)
        : null;


    return clients.filter(client => {

      if (
        Number(client.vendor_id) !==
        Number(vendorId)
      ) {

        return false;
      }


      if (!resetDate) {

        return true;
      }


      return new Date(
        client.created_at
      ) > resetDate;

    }).length;

  }


  /* =========================
     UPDATE STATS
  ========================= */

  function updateStats() {

    document.getElementById(
      "totalVendors"
    ).textContent =
      vendors.length;


    document.getElementById(
      "activeVendors"
    ).textContent =
      vendors.filter(v =>
        String(v.status || "")
          .toLowerCase() === "active"
      ).length;


    let total = 0;


    vendors.forEach(vendor => {

      total +=
        getCurrentLinks(vendor.id);

    });


    document.getElementById(
      "totalLinks"
    ).textContent =
      total;

  }


  /* =========================
     RENDER VENDORS
  ========================= */

  function renderVendors() {

    const tbody =
      document.getElementById(
        "vendorsTable"
      );


    const search =
      String(
        document.getElementById(
          "searchInput"
        ).value || ""
      )
      .trim()
      .toLowerCase();


    const filtered =
      vendors.filter(vendor => {

        const name =
          String(
            vendor.name || ""
          ).toLowerCase();

        const email =
          String(
            vendor.email || ""
          ).toLowerCase();

        return (
          name.includes(search) ||
          email.includes(search)
        );

      });


    if (!filtered.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="5" class="message">
            Aucun vendeur trouvé.
          </td>
        </tr>
      `;

      return;
    }


    tbody.innerHTML =
      filtered.map(vendor => {

        const currentLinks =
          getCurrentLinks(
            vendor.id
          );


        const status =
          String(
            vendor.status || ""
          ).toLowerCase();


        const statusClass =
          status === "active"
            ? "active"
            : "inactive";


        const statusText =
          status === "active"
            ? "Actif"
            : "Inactif";


        return `

          <tr>

            <td>
              <strong>
                ${escapeHtml(
                  vendor.name ||
                  "Vendeur"
                )}
              </strong>
            </td>


            <td>
              ${escapeHtml(
                vendor.email ||
                "-"
              )}
            </td>


            <td>
              <span class="status ${statusClass}">
                ${statusText}
              </span>
            </td>


            <td>
              <span class="links-count">
                ${currentLinks}
              </span>
            </td>


            <td>

              <div class="actions">

                <button
                  class="action-btn reset-btn"
                  onclick="resetVendor(${vendor.id})"
                >
                  Réinitialiser
                </button>


                <button
                  class="action-btn history-btn"
                  onclick="showHistory(
                    ${vendor.id},
                    '${escapeAttribute(
                      vendor.name ||
                      "Vendeur"
                    )}'
                  )"
                >
                  Historique
                </button>

              </div>

            </td>

          </tr>

        `;

      }).join("");

  }


  /* =========================
     RESET VENDOR
  ========================= */

  async function resetVendor(vendorId) {

    const vendor =
      vendors.find(
        v =>
          Number(v.id) ===
          Number(vendorId)
      );


    if (!vendor) {

      alert(
        "Vendeur introuvable."
      );

      return;
    }


    const currentLinks =
      getCurrentLinks(
        vendorId
      );


    const confirmed =
      confirm(
        `Réinitialiser le compteur de ${vendor.name || "Vendeur"} ?\n\n` +
        `${currentLinks} liens seront enregistrés dans l'historique.`
      );


    if (!confirmed) {

      return;
    }


    /*
      IMPORTANT :
      هنا نستعمل RPC الجديدة
      بدل INSERT المباشر
    */

    const {
      error
    } = await supabaseClient.rpc(
      "reset_vendor_counter",
      {
        p_vendor_id:
          vendorId,

        p_units_count:
          currentLinks
      }
    );


    if (error) {

      alert(
        "Erreur : " +
        error.message
      );

      return;
    }


    alert(
      "Compteur réinitialisé avec succès."
    );


    /*
      نعاود نجيب البيانات
      باش العداد والتاريخ يتحدثو
    */

    await loadData();

  }


  /* =========================
     HISTORY
  ========================= */

  async function showHistory(
    vendorId,
    vendorName
  ) {

    const modal =
      document.getElementById(
        "historyModal"
      );


    const title =
      document.getElementById(
        "historyTitle"
      );


    const content =
      document.getElementById(
        "historyContent"
      );


    title.textContent =
      "Historique — " +
      vendorName;


    content.innerHTML =
      "Chargement...";


    modal.classList.add(
      "show"
    );


    const {
      data,
      error
    } = await supabaseClient
      .from("vendor_resets")
      .select(`
        id,
        units_count,
        reset_at
      `)
      .eq(
        "vendor_id",
        vendorId
      )
      .order(
        "reset_at",
        {
          ascending: false
        }
      );


    if (error) {

      content.innerHTML = `
        <div class="message">
          Erreur : ${escapeHtml(
            error.message
          )}
        </div>
      `;

      return;
    }


    if (!data || !data.length) {

      content.innerHTML = `
        <div class="message">
          Aucun historique.
        </div>
      `;

      return;
    }


    content.innerHTML =
      data.map(item => {

        const date =
          formatDate(
            item.reset_at
          );


        return `

          <div class="history-item">

            <div>
              <div class="history-count">
                ${item.units_count}
                lien${Number(item.units_count) > 1 ? "s" : ""}
              </div>
            </div>


            <div class="history-date">
              ${date}
            </div>

          </div>

        `;

      }).join("");

  }


  /* =========================
     CLOSE HISTORY
  ========================= */

  function closeHistory() {

    document
      .getElementById(
        "historyModal"
      )
      .classList.remove(
        "show"
      );

  }


  /* =========================
     FORMAT DATE
  ========================= */

  function formatDate(dateString) {

    if (!dateString) {

      return "-";

    }


    const date =
      new Date(
        dateString
      );


    return date.toLocaleString(
      "fr-FR",
      {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";

  }


  /* =========================
     ERROR
  ========================= */

  function showError(message) {

    const box =
      document.getElementById(
        "errorBox"
      );


    box.textContent =
      message;


    box.style.display =
      "block";

  }


  /* =========================
     SECURITY / HTML ESCAPE
  ========================= */

  function escapeHtml(value) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(value) {

    return String(value)
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /"/g,
        "&quot;"
      );

  }


  /* =========================
     CLOSE MODAL WHEN CLICKING OUTSIDE
  ========================= */

  document
    .getElementById(
      "historyModal"
    )
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target === this
        ) {

          closeHistory();

        }

      }
    );

</script>

</body>
</html>
