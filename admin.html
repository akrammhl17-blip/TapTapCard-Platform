<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - TAPTAPCARD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #faf9f7, #eef1f4, #e4e8ed);
      color: #222;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      padding: 30px 0 50px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .brand p {
      margin: 5px 0 0;
      color: #777;
    }

    .logout {
      border: none;
      background: #332522;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat {
      background: rgba(255,255,255,.8);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,.07);
    }

    .stat-title {
      color: #777;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
    }

    .panel {
      background: rgba(255,255,255,.85);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      margin: 0;
    }

    #search {
      width: 260px;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 15px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      color: #777;
      font-size: 13px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .active {
      background: #e6f7ed;
      color: #16834b;
    }

    .inactive {
      background: #fde8e8;
      color: #c62828;
    }

    .action-btn {
      border: none;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
    }

    .disable-btn {
      background: #ffe8e8;
      color: #c62828;
    }

    .enable-btn {
      background: #e5f7ec;
      color: #16834b;
    }

    .message {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .panel-header {
        align-items: stretch;
        flex-direction: column;
      }

      #search {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="brand">
      <h1>TAPTAPCARD Admin</h1>
      <p>Gestion de la plateforme</p>
    </div>

    <button class="logout" id="logoutBtn">
      Déconnexion
    </button>
  </header>

  <section class="stats">

    <div class="stat">
      <div class="stat-title">Total vendeurs</div>
      <div class="stat-number" id="totalVendors">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Vendeurs actifs</div>
      <div class="stat-number" id="activeVendors">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">Total clients</div>
      <div class="stat-number" id="totalClients">0</div>
    </div>

  </section>

  <section class="panel">

    <div class="panel-header">
      <h2>Vendeurs</h2>

      <input
        type="text"
        id="search"
        placeholder="Rechercher un vendeur..."
      >
    </div>

    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Statut</th>
            <th>Clients</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="vendorsTable">
          <tr>
            <td colspan="5" class="message">
              Chargement...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </section>

</div>

<script>

let vendors = [];
let clientCounts = {};

async function init() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = "index.html";
    return;
  }

  // Vérifier que l'utilisateur est Admin
  const { data: adminVendor, error: adminError } =
    await supabaseClient
      .from("vendors")
      .select("id, name, role, status")
      .eq("user_id", user.id)
      .single();

  if (
    adminError ||
    !adminVendor ||
    adminVendor.role !== "admin" ||
    adminVendor.status !== "active"
  ) {
    document.body.innerHTML = `
      <div style="
        text-align:center;
        padding:80px 20px;
        font-family:Arial;
      ">
        <h2>Accès refusé</h2>
        <p>Cette page est réservée à l'administrateur.</p>
        <a href="dashboard.html">Retour</a>
      </div>
    `;
    return;
  }

  await loadVendors();
  await loadClients();

  renderVendors();
  updateStats();
}


async function loadVendors() {

  const { data, error } =
    await supabaseClient
      .from("vendors")
      .select("*")
      .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  vendors = data || [];
}


async function loadClients() {

  const { data, error } =
    await supabaseClient
      .from("clients")
      .select("vendor_id");

  if (error) {
    console.error(error);
    return;
  }

  clientCounts = {};

  (data || []).forEach(client => {

    if (!clientCounts[client.vendor_id]) {
      clientCounts[client.vendor_id] = 0;
    }

    clientCounts[client.vendor_id]++;
  });
}


function updateStats() {

  document.getElementById("totalVendors").textContent =
    vendors.length;

  document.getElementById("activeVendors").textContent =
    vendors.filter(v => v.status === "active").length;

  document.getElementById("totalClients").textContent =
    Object.values(clientCounts)
      .reduce((total, count) => total + count, 0);
}


function renderVendors(filter = "") {

  const table =
    document.getElementById("vendorsTable");

  const search =
    filter.toLowerCase().trim();

  const filtered =
    vendors.filter(v =>
      (v.name || "").toLowerCase().includes(search) ||
      (v.email || "").toLowerCase().includes(search)
    );

  if (!filtered.length) {

    table.innerHTML = `
      <tr>
        <td colspan="5" class="message">
          Aucun vendeur trouvé.
        </td>
      </tr>
    `;

    return;
  }

  table.innerHTML = filtered.map(vendor => {

    const isActive =
      vendor.status === "active";

    const count =
      clientCounts[vendor.id] || 0;

    return `
      <tr>

        <td>
          <strong>${escapeHtml(vendor.name || "Sans nom")}</strong>
        </td>

        <td>
          ${escapeHtml(vendor.email || "-")}
        </td>

        <td>
          <span class="status ${isActive ? "active" : "inactive"}">
            ${isActive ? "Actif" : "Suspendu"}
          </span>
        </td>

        <td>
          ${count}
        </td>

        <td>

          ${
            vendor.role === "admin"
              ? `<span style="color:#777;font-size:12px;">Admin</span>`
              : `
                <button
                  class="action-btn ${
                    isActive
                      ? "disable-btn"
                      : "enable-btn"
                  }"
                  onclick="toggleVendor(${vendor.id}, '${isActive ? "inactive" : "active"}')"
                >
                  ${
                    isActive
                      ? "Suspendre"
                      : "Activer"
                  }
                </button>
              `
          }

        </td>

      </tr>
    `;

  }).join("");
}


async function toggleVendor(vendorId, newStatus) {

  const vendor =
    vendors.find(v => v.id === vendorId);

  if (!vendor) return;

  const action =
    newStatus === "active"
      ? "activer"
      : "suspendre";

  if (!confirm(`Voulez-vous ${action} ce vendeur ?`)) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("vendors")
      .update({
        status: newStatus
      })
      .eq("id", vendorId);

  if (error) {

    alert(
      "Erreur : " + error.message
    );

    return;
  }

  vendor.status = newStatus;

  renderVendors(
    document.getElementById("search").value
  );

  updateStats();
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


document
  .getElementById("search")
  .addEventListener("input", e => {

    renderVendors(e.target.value);

  });


document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    window.location.href = "index.html";

  });


init();

</script>

</body>
      </html>
