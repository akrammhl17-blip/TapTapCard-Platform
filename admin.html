<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TAPTAPCARD Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #faf9f7,
          #eef1f4,
          #e4e8ed
        );

      color: #332522;

      min-height: 100vh;
    }


    .container {
      width: 92%;

      max-width: 1150px;

      margin: auto;

      padding: 30px 0 50px;
    }


    header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 30px;
    }


    .brand h1 {
      margin: 0;

      font-size: 28px;
    }


    .brand p {
      margin: 6px 0 0;

      color: #777;

      font-size: 14px;
    }


    .logout {
      border: none;

      background: #332522;

      color: white;

      padding: 12px 18px;

      border-radius: 12px;

      cursor: pointer;
    }


    .logout:hover {
      opacity: .9;
    }


    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-bottom: 30px;
    }


    .stat {
      background:
        rgba(255,255,255,.9);

      border-radius: 18px;

      padding: 22px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.07);
    }


    .stat-title {
      color: #777;

      font-size: 14px;

      margin-bottom: 10px;
    }


    .stat-number {
      font-size: 32px;

      font-weight: bold;
    }


    /* =========================
       PANEL
    ========================= */

    .panel {
      background:
        rgba(255,255,255,.92);

      border-radius: 20px;

      padding: 22px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.08);
    }


    .panel-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }


    .panel-header h2 {
      margin: 0;
    }


    #search {
      width: 270px;

      padding: 12px 14px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      outline: none;

      font-size: 14px;
    }


    /* =========================
       TABLE
    ========================= */

    .table-wrapper {
      overflow-x: auto;
    }


    table {
      width: 100%;

      border-collapse:
        collapse;

      min-width: 900px;
    }


    th,
    td {
      padding: 15px 12px;

      text-align: left;

      border-bottom:
        1px solid #eee;
    }


    th {
      color: #777;

      font-size: 13px;

      font-weight: normal;
    }


    td {
      font-size: 14px;

      vertical-align: middle;
    }


    .count {
      font-size: 22px;

      font-weight: bold;
    }


    .unit-label {
      color: #777;

      font-size: 12px;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      display: inline-block;

      padding: 6px 11px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }


    .active {
      background: #e6f7ed;

      color: #16834b;
    }


    .inactive {
      background: #fde8e8;

      color: #c62828;
    }


    /* =========================
       BUTTONS
    ========================= */

    .action-btn {
      border: none;

      padding: 9px 14px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 13px;
    }


    .reset-btn {
      background: #332522;

      color: white;
    }


    .reset-btn:hover {
      opacity: .9;
    }


    .history-btn {
      background: #f0eeee;

      color: #332522;

      margin-left: 6px;
    }


    .history-btn:hover {
      background: #e5e0de;
    }


    .message {
      text-align: center;

      padding: 30px;

      color: #777;
    }


    /* =========================
       ERROR
    ========================= */

    .error-box {
      display: none;

      background: #fff0f0;

      color: #b42318;

      padding: 15px;

      border-radius: 12px;

      margin-bottom: 20px;

      word-break: break-word;
    }


    /* =========================
       HISTORY MODAL
    ========================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.45);

      z-index: 1000;

      padding: 20px;

      align-items: center;

      justify-content: center;
    }


    .modal-box {
      background: white;

      width: 100%;

      max-width: 500px;

      max-height: 80vh;

      overflow-y: auto;

      border-radius: 20px;

      padding: 24px;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.2);
    }


    .modal-header {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      margin-bottom: 20px;
    }


    .modal-header h3 {
      margin: 0;
    }


    .close-btn {
      border: none;

      background: #f1eeee;

      width: 35px;

      height: 35px;

      border-radius: 50%;

      cursor: pointer;

      font-size: 18px;
    }


    .history-item {
      display: flex;

      justify-content:
        space-between;

      align-items: center;

      padding: 14px 0;

      border-bottom:
        1px solid #eee;
    }


    .history-count {
      font-weight: bold;

      font-size: 18px;
    }


    .history-date {
      color: #777;

      font-size: 12px;

      text-align: right;
    }


    .empty-history {
      text-align: center;

      color: #777;

      padding: 25px 10px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .container {
        width: 94%;

        padding-top: 20px;
      }


      header {
        align-items:
          flex-start;

        flex-direction:
          column;

        gap: 15px;
      }


      .stats {
        grid-template-columns:
          1fr;
      }


      .panel-header {
        align-items:
          stretch;

        flex-direction:
          column;
      }


      #search {
        width: 100%;
      }


      .brand h1 {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="brand">

      <h1>
        TAPTAPCARD Admin
      </h1>

      <p>
        Gestion de la plateforme
      </p>

    </div>


    <button
      class="logout"
      id="logoutBtn"
    >
      Déconnexion
    </button>

  </header>


  <!-- =========================
       ERROR
  ========================= -->

  <div
    class="error-box"
    id="errorBox"
  ></div>


  <!-- =========================
       STATS
  ========================= -->

  <section class="stats">


    <div class="stat">

      <div class="stat-title">
        Total vendeurs
      </div>

      <div
        class="stat-number"
        id="totalVendors"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Vendeurs actifs
      </div>

      <div
        class="stat-number"
        id="activeVendors"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Liens actifs à compter
      </div>

      <div
        class="stat-number"
        id="totalCurrentLinks"
      >
        0
      </div>

    </div>


  </section>


  <!-- =========================
       VENDEURS
  ========================= -->

  <section class="panel">


    <div class="panel-header">

      <h2>
        Vendeurs
      </h2>


      <input
        type="text"
        id="search"
        placeholder="Rechercher un vendeur..."
      >

    </div>


    <div class="table-wrapper">


      <table>


        <thead>

          <tr>

            <th>
              Nom
            </th>

            <th>
              Email
            </th>

            <th>
              Statut
            </th>

            <th>
              Liens actuels
            </th>

            <th>
              Actions
            </th>

          </tr>

        </thead>


        <tbody id="vendorsTable">

          <tr>

            <td
              colspan="5"
              class="message"
            >
              Chargement...
            </td>

          </tr>

        </tbody>


      </table>


    </div>


  </section>


</div>


<!-- =========================
     HISTORY MODAL
========================= -->

<div
  class="modal"
  id="historyModal"
>


  <div class="modal-box">


    <div class="modal-header">

      <h3 id="historyTitle">
        Historique
      </h3>


      <button
        class="close-btn"
        onclick="closeHistory()"
      >
        ×
      </button>

    </div>


    <div id="historyContent">

      Chargement...

    </div>


  </div>

</div>


<script>


// ======================================
// VARIABLES
// ======================================

let vendors = [];

let clients = [];

let resets = [];



// ======================================
// INITIALISATION
// ======================================

async function init() {

  try {


    // ================================
    // CHECK USER
    // ================================

    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {

      showError(
        "Erreur Auth : " +
        userError.message
      );

      return;

    }


    if (!user) {

      window.location.href =
        "index.html";

      return;

    }


    // ================================
    // CHECK ADMIN
    // ================================

    const {
      data: vendor,
      error: vendorError
    } =
      await supabaseClient
        .from("vendors")
        .select(`
          id,
          name,
          email,
          role,
          status
        `)
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if (vendorError) {

      showError(
        "Erreur vérification Admin : " +
        vendorError.message
      );

      return;

    }


    if (!vendor) {

      showAccessDenied(
        "Aucun compte vendeur trouvé."
      );

      return;

    }


    const role =
      String(
        vendor.role || ""
      )
      .trim()
      .toLowerCase();


    const status =
      String(
        vendor.status || ""
      )
      .trim()
      .toLowerCase();


    if (
      role !== "admin" ||
      status !== "active"
    ) {

      showAccessDenied(
        "Cette page est réservée à l'administrateur."
      );

      return;

    }


    // ================================
    // LOAD DATA
    // ================================

    await loadVendors();

    await loadClients();

    await loadResets();


    updateStats();

    renderVendors();

  }


  catch (error) {

    console.error(error);

    showError(
      "Erreur inattendue : " +
      error.message
    );

  }

}



// ======================================
// LOAD VENDEURS
// ======================================

async function loadVendors() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("vendors")
      .select(`
        id,
        name,
        email,
        status,
        role,
        created_at
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    throw error;

  }


  vendors =
    data || [];

}



// ======================================
// LOAD CLIENTS
// ======================================

async function loadClients() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("clients")
      .select(`
        id,
        vendor_id,
        created_at
      `);


  if (error) {

    throw error;

  }


  clients =
    data || [];

}



// ======================================
// LOAD RESETS
// ======================================

async function loadResets() {


  const {
    data,
    error
  } =
    await supabaseClient
      .from("vendor_resets")
      .select(`
        id,
        vendor_id,
        units_count,
        reset_at
      `)
      .order(
        "reset_at",
        {
          ascending: false
        }
      );


  if (error) {

    throw error;

  }


  resets =
    data || [];

}



// ======================================
// GET LAST RESET
// ======================================

function getLastReset(
  vendorId
) {


  const vendorResets =
    resets.filter(
      reset =>
        Number(
          reset.vendor_id
        ) ===
        Number(
          vendorId
        )
    );


  if (
    !vendorResets.length
  ) {

    return null;

  }


  vendorResets.sort(
    (
      a,
      b
    ) =>
      new Date(
        b.reset_at
      ) -
      new Date(
        a.reset_at
      )
  );


  return vendorResets[0];

}



// ======================================
// GET CURRENT LINKS
// ======================================

function getCurrentLinks(
  vendorId
) {


  const lastReset =
    getLastReset(
      vendorId
    );


  let count = 0;


  clients.forEach(
    client => {


      if (
        Number(
          client.vendor_id
        ) !==
        Number(
          vendorId
        )
      ) {

        return;

      }


      const created =
        new Date(
          client.created_at
        );


      // بدون Reset
      // نحسب كل الروابط

      if (!lastReset) {

        count++;

        return;

      }


      const resetDate =
        new Date(
          lastReset.reset_at
        );


      // بعد آخر Reset فقط

      if (
        created >
        resetDate
      ) {

        count++;

      }

    }
  );


  return count;

}



// ======================================
// UPDATE STATS
// ======================================

function updateStats() {


  const totalVendors =
    vendors.length;


  const activeVendors =
    vendors.filter(
      vendor =>
        String(
          vendor.status || ""
        )
        .trim()
        .toLowerCase()
        ===
        "active"
    ).length;


  let totalCurrentLinks = 0;


  vendors.forEach(
    vendor => {

      totalCurrentLinks +=
        getCurrentLinks(
          vendor.id
        );

    }
  );


  document.getElementById(
    "totalVendors"
  ).textContent =
    totalVendors;


  document.getElementById(
    "activeVendors"
  ).textContent =
    activeVendors;


  document.getElementById(
    "totalCurrentLinks"
  ).textContent =
    totalCurrentLinks;

}



// ======================================
// RENDER VENDEURS
// ======================================

function renderVendors(
  filter = ""
) {


  const table =
    document.getElementById(
      "vendorsTable"
    );


  const search =
    filter
      .toLowerCase()
      .trim();


  const filtered =
    vendors.filter(
      vendor => {


        const name =
          String(
            vendor.name || ""
          )
          .toLowerCase();


        const email =
          String(
            vendor.email || ""
          )
          .toLowerCase();


        return (
          name.includes(search) ||
          email.includes(search)
        );

      }
    );


  if (
    !filtered.length
  ) {

    table.innerHTML = `

      <tr>

        <td
          colspan="5"
          class="message"
        >
          Aucun vendeur trouvé.
        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =
    filtered.map(
      vendor => {


        const status =
          String(
            vendor.status || ""
          )
          .trim()
          .toLowerCase();


        const active =
          status ===
          "active";


        const currentLinks =
          getCurrentLinks(
            vendor.id
          );


        /*
          مهم:
          Réinitialiser يظهر لكل vendeur
          وكذلك للحساب الإداري.
        */

        const actions = `

          <button
            class="
              action-btn
              reset-btn
            "
            onclick="
              resetVendor(
                ${vendor.id}
              )
            "
          >
            Réinitialiser
          </button>


          <button
            class="
              action-btn
              history-btn
            "
            onclick="
              showHistory(
                ${vendor.id},
                '${escapeAttribute(
                  vendor.name ||
                  "Vendeur"
                )}'
              )
            "
          >
            Historique
          </button>

        `;


        return `

          <tr>


            <td>

              <strong>
                ${
                  escapeHtml(
                    vendor.name ||
                    "Sans nom"
                  )
                }
              </strong>

            </td>


            <td>

              ${
                escapeHtml(
                  vendor.email ||
                  "-"
                )
              }

            </td>


            <td>

              <span
                class="
                  status
                  ${
                    active
                      ? "active"
                      : "inactive"
                  }
                "
              >

                ${
                  active
                    ? "Actif"
                    : "Suspendu"
                }

              </span>

            </td>


            <td>

              <span class="count">
                ${currentLinks}
              </span>

              <span class="unit-label">
                liens
              </span>

            </td>


            <td>

              ${actions}

            </td>


          </tr>

        `;

      }
    ).join("");

}



// ======================================
// RESET VENDOR
// ======================================

async function resetVendor(
  vendorId
) {


  const vendor =
    vendors.find(
      item =>
        Number(
          item.id
        ) ===
        Number(
          vendorId
        )
    );


  if (!vendor) {

    alert(
      "Vendeur introuvable."
    );

    return;

  }


  const currentLinks =
    getCurrentLinks(
      vendorId
    );


  if (
    currentLinks === 0
  ) {

    alert(
      "Ce vendeur n'a aucun lien à réinitialiser."
    );

    return;

  }


  const confirmed =
    confirm(
      `Réinitialiser le compteur de ${currentLinks} liens pour ${vendor.name || "ce vendeur"} ?`
    );


  if (!confirmed) {

    return;

  }


  // ================================
  // INSERT RESET
  // ================================

  const {
    error
  } =
    await supabaseClient
      .from("vendor_resets")
      .insert({

        vendor_id:
          vendorId,

        units_count:
          currentLinks

      });


  if (error) {

    alert(
      "Erreur : " +
      error.message
    );

    return;

  }


  // ================================
  // RELOAD
  // ================================

  await loadResets();


  updateStats();


  renderVendors(
    document.getElementById(
      "search"
    ).value
  );


  alert(
    `Compteur réinitialisé.\n\n${currentLinks} liens ont été enregistrés dans l'historique.`
  );

}



// ======================================
// SHOW HISTORY
// ======================================

async function showHistory(
  vendorId,
  vendorName
) {


  const modal =
    document.getElementById(
      "historyModal"
    );


  const title =
    document.getElementById(
      "historyTitle"
    );


  const content =
    document.getElementById(
      "historyContent"
    );


  title.textContent =
    "Historique - " +
    vendorName;


  content.innerHTML =
    "Chargement...";


  modal.style.display =
    "flex";


  try {


    const {
      data,
      error
    } =
      await supabaseClient
        .from("vendor_resets")
        .select(`
          id,
          units_count,
          reset_at
        `)
        .eq(
          "vendor_id",
          vendorId
        )
        .order(
          "reset_at",
          {
            ascending: false
          }
        );


    if (error) {

      content.innerHTML = `

        <div class="empty-history">

          Erreur :
          ${
            escapeHtml(
              error.message
            )
          }

        </div>

      `;

      return;

    }


    if (
      !data ||
      !data.length
    ) {

      content.innerHTML = `

        <div class="empty-history">

          Aucun historique.

        </div>

      `;

      return;

    }


    content.innerHTML =
      data.map(
        item => {


          const date =
            formatDate(
              item.reset_at
            );


          return `

            <div
              class="history-item"
            >

              <div>

                <div
                  class="history-count"
                >

                  ${
                    item.units_count
                  }
                  liens

                </div>

              </div>


              <div
                class="history-date"
              >

                ${date}

              </div>

            </div>

          `;

        }
      ).join("");


  }


  catch (error) {

    content.innerHTML = `

      <div class="empty-history">

        ${
          escapeHtml(
            error.message
          )
        }

      </div>

    `;

  }

}



// ======================================
// CLOSE HISTORY
// ======================================

function closeHistory() {


  document.getElementById(
    "historyModal"
  ).style.display =
    "none";

}



// ======================================
// SEARCH
// ======================================

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    event => {

      renderVendors(
        event.target.value
      );

    }
  );



// ======================================
// LOGOUT
// ======================================

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    async () => {


      await supabaseClient
        .auth
        .signOut();


      window.location.href =
        "index.html";

    }
  );



// ======================================
// ERROR
// ======================================

function showError(
  message
) {


  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.style.display =
    "block";

}



// ======================================
// ACCESS DENIED
// ======================================

function showAccessDenied(
  message
) {


  document.body.innerHTML = `

    <div style="
      text-align:center;
      padding:80px 20px;
      font-family:Arial;
    ">

      <h2>
        Accès refusé
      </h2>

      <p>
        ${
          escapeHtml(
            message
          )
        }
      </p>

      <a href="dashboard.html">
        Retour au Dashboard
      </a>

    </div>

  `;

}



// ======================================
// FORMAT DATE
// ======================================

function formatDate(
  dateString
) {


  const date =
    new Date(
      dateString
    );


  return date.toLocaleString(
    "fr-FR",
    {
      dateStyle:
        "medium",

      timeStyle:
        "short"
    }
  );

}



// ======================================
// SECURITY
// ======================================

function escapeHtml(
  value
) {


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {


  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      "&quot;"
    );

}
