<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ajouter un client - TapTapCard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f7f7f8;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: #333;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .section-title {
      margin-top: 30px;
      margin-bottom: 5px;
      font-size: 18px;
      font-weight: bold;
    }

    .upload-box {
      border: 2px dashed #ddd;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      background: #fafafa;
    }

    .upload-box input[type="file"] {
      border: none;
      padding: 8px 0;
      background: transparent;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
    }

    .profile-preview {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin: 12px auto 0;
    }

    .upload-status {
      display: none;
      margin-top: 8px;
      font-size: 13px;
      color: #666;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .success {
      background: #e9f8ed;
      color: #167333;
    }

    .error {
      background: #fdeaea;
      color: #b42318;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Ajouter un client</h1>

      <div class="subtitle">
        Créez une nouvelle page TapTapCard pour votre client.
      </div>

      <form id="clientForm">

        <!-- INFORMATIONS PRINCIPALES -->

        <label for="name">
          Nom du client
        </label>

        <input
          type="text"
          id="name"
          placeholder="Nom du client"
          required
        >


        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          placeholder="Description de l'activité"
        ></textarea>


        <!-- IMAGES -->

        <div class="section-title">
          Images
        </div>


        <label for="profileFile">
          Photo de profil
        </label>

        <div class="upload-box">

          <input
            type="file"
            id="profileFile"
            accept="image/*"
          >

          <img
            id="profilePreview"
            class="preview profile-preview"
            alt="Aperçu"
          >

          <div
            id="profileStatus"
            class="upload-status"
          >
            Image sélectionnée
          </div>

        </div>


        <label for="coverFile">
          Image de couverture
        </label>

        <div class="upload-box">

          <input
            type="file"
            id="coverFile"
            accept="image/*"
          >

          <img
            id="coverPreview"
            class="preview"
            alt="Aperçu"
          >

          <div
            id="coverStatus"
            class="upload-status"
          >
            Image sélectionnée
          </div>

        </div>


        <!-- RÉSEAUX SOCIAUX -->

        <div class="section-title">
          Réseaux sociaux
        </div>


        <label for="instagram">
          Instagram
        </label>

        <input
          type="url"
          id="instagram"
          placeholder="https://instagram.com/..."
        >


        <label for="facebook">
          Facebook
        </label>

        <input
          type="url"
          id="facebook"
          placeholder="https://facebook.com/..."
        >


        <label for="tiktok">
          TikTok
        </label>

        <input
          type="url"
          id="tiktok"
          placeholder="https://tiktok.com/@..."
        >


        <label for="snapchat">
          Snapchat
        </label>

        <input
          type="text"
          id="snapchat"
          placeholder="@username"
        >


        <label for="website">
          Website
        </label>

        <input
          type="url"
          id="website"
          placeholder="https://..."
        >


        <!-- CONTACT -->

        <div class="section-title">
          Contact
        </div>


        <label for="phone">
          Téléphone
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="0550..."
        >


        <label for="whatsapp">
          WhatsApp
        </label>

        <input
          type="tel"
          id="whatsapp"
          placeholder="0550..."
        >


        <label for="googleMaps">
          Google Maps
        </label>

        <input
          type="url"
          id="googleMaps"
          placeholder="https://maps.google.com/..."
        >


        <button
          type="submit"
          id="submitButton"
        >
          Créer le client
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>


      <a
        href="vendor-dashboard.html"
        class="back"
      >
        ← Retour au dashboard
      </a>

    </div>

  </div>


  <script src="supabase.js"></script>

  <script>

    const form =
      document.getElementById("clientForm");

    const submitButton =
      document.getElementById("submitButton");

    const message =
      document.getElementById("message");


    const profileFile =
      document.getElementById("profileFile");

    const coverFile =
      document.getElementById("coverFile");

    const profilePreview =
      document.getElementById("profilePreview");

    const coverPreview =
      document.getElementById("coverPreview");

    const profileStatus =
      document.getElementById("profileStatus");

    const coverStatus =
      document.getElementById("coverStatus");


    /*
      BUCKET SUPABASE
    */

    const STORAGE_BUCKET =
      "client-images";


    /*
      SESSION VENDEUR
    */

    const sessionData =
      localStorage.getItem("vendor_session");


    if (!sessionData) {

      window.location.href =
        "vendor.html";

    }


    let vendorSession;


    try {

      vendorSession =
        JSON.parse(sessionData);

    } catch (error) {

      localStorage.removeItem(
        "vendor_session"
      );

      window.location.href =
        "vendor.html";

    }


    /*
      MESSAGE
    */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message " + type;

      message.style.display =
        "block";
    }


    /*
      PREVIEW PHOTO DE PROFIL
    */

    profileFile.addEventListener(
      "change",
      function() {

        const file =
          profileFile.files[0];

        if (!file) {

          profilePreview.style.display =
            "none";

          profileStatus.style.display =
            "none";

          return;
        }


        profilePreview.src =
          URL.createObjectURL(file);

        profilePreview.style.display =
          "block";

        profileStatus.textContent =
          file.name;

        profileStatus.style.display =
          "block";
      }
    );


    /*
      PREVIEW COVER
    */

    coverFile.addEventListener(
      "change",
      function() {

        const file =
          coverFile.files[0];

        if (!file) {

          coverPreview.style.display =
            "none";

          coverStatus.style.display =
            "none";

          return;
        }


        coverPreview.src =
          URL.createObjectURL(file);

        coverPreview.style.display =
          "block";

        coverStatus.textContent =
          file.name;

        coverStatus.style.display =
          "block";
      }
    );


    /*
      VÉRIFIER SESSION
    */

    async function verifySession() {

      if (
        !vendorSession ||
        !vendorSession.session_token
      ) {

        window.location.href =
          "vendor.html";

        return false;
      }


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "verify_vendor_session",
          {
            p_session_token:
              vendorSession.session_token
          }
        );


      if (
        error ||
        !data ||
        data.length === 0
      ) {

        localStorage.removeItem(
          "vendor_session"
        );

        window.location.href =
          "vendor.html";

        return false;
      }


      return true;
    }


    /*
      UPLOAD IMAGE
    */

    async function uploadImage(
      file,
      folder
    ) {

      if (!file) {

        return "";
      }


      /*
        Vérification du type
      */

      if (
        !file.type.startsWith("image/")
      ) {

        throw new Error(
          "Le fichier doit être une image."
        );
      }


      /*
        Limite 10 MB
      */

      if (
        file.size >
        10 * 1024 * 1024
      ) {

        throw new Error(
          "L'image doit faire moins de 10 MB."
        );
      }


      /*
        Nom unique
      */

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const randomPart =
        Math.random()
          .toString(36)
          .substring(2, 10);


      const timestamp =
        Date.now();


      const filePath =
        vendorSession.vendor_id +
        "/" +
        folder +
        "/" +
        timestamp +
        "-" +
        randomPart +
        "." +
        extension;


      /*
        Upload vers Supabase Storage
      */

      const {
        data,
        error
      } =
        await supabaseClient.storage
          .from(STORAGE_BUCKET)
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            }
          );


      if (error) {

        console.error(
          "Storage upload error:",
          error
        );

        throw new Error(
          "Impossible d'envoyer l'image : " +
          error.message
        );
      }


      /*
        URL publique
      */

      const {
        data: publicData
      } =
        supabaseClient.storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(
            data.path
          );


      return publicData.publicUrl;
    }


    /*
      CRÉER CLIENT
    */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        submitButton.disabled =
          true;

        submitButton.textContent =
          "Création en cours...";


        message.style.display =
          "none";


        try {

          /*
            Vérifier session
          */

          const valid =
            await verifySession();


          if (!valid) {

            return;
          }


          /*
            Récupérer données
          */

          const name =
            document
              .getElementById("name")
              .value
              .trim();


          const description =
            document
              .getElementById("description")
              .value
              .trim();


          const instagram =
            document
              .getElementById("instagram")
              .value
              .trim();


          const facebook =
            document
              .getElementById("facebook")
              .value
              .trim();


          const tiktok =
            document
              .getElementById("tiktok")
              .value
              .trim();


          const snapchat =
            document
              .getElementById("snapchat")
              .value
              .trim();


          const website =
            document
              .getElementById("website")
              .value
              .trim();


          const phone =
            document
              .getElementById("phone")
              .value
              .trim();


          const whatsapp =
            document
              .getElementById("whatsapp")
              .value
              .trim();


          const googleMaps =
            document
              .getElementById("googleMaps")
              .value
              .trim();


          /*
            Fichiers
          */

          const profileFileValue =
            profileFile.files[0];


          const coverFileValue =
            coverFile.files[0];


          /*
            Upload profile
          */

          submitButton.textContent =
            "Envoi de la photo de profil...";


          const profileImage =
            await uploadImage(
              profileFileValue,
              "profile"
            );


          /*
            Upload cover
          */

          submitButton.textContent =
            "Envoi de la couverture...";


          const coverImage =
            await uploadImage(
              coverFileValue,
              "cover"
            );


          /*
            Créer le client
          */

          submitButton.textContent =
            "Création du client...";


          const {
            data,
            error
          } =
            await supabaseClient.rpc(
              "create_vendor_client",
              {

                p_session_token:
                  vendorSession.session_token,

                p_name:
                  name,

                p_description:
                  description,

                p_profile_image:
                  profileImage,

                p_cover_image:
                  coverImage,

                p_instagram:
                  instagram,

                p_facebook:
                  facebook,

                p_tiktok:
                  tiktok,

                p_snapchat:
                  snapchat,

                p_website:
                  website,

                p_phone:
                  phone,

                p_whatsapp:
                  whatsapp,

                p_google_maps:
                  googleMaps

              }
            );


          if (error) {

            console.error(
              "Create client error:",
              error
            );

            throw new Error(
              error.message
            );
          }


          /*
            Succès
          */

          showMessage(
            "Client créé avec succès !",
            "success"
          );


          form.reset();


          profilePreview.style.display =
            "none";

          coverPreview.style.display =
            "none";

          profileStatus.style.display =
            "none";

          coverStatus.style.display =
            "none";


          submitButton.textContent =
            "Client créé";


          /*
            Retour dashboard
          */

          setTimeout(
            function() {

              window.location.href =
                "vendor-dashboard.html";

            },
            1000
          );


        } catch (error) {

          console.error(error);


          showMessage(
            error.message ||
            "Une erreur est survenue.",
            "error"
          );


          submitButton.disabled =
            false;

          submitButton.textContent =
            "Créer le client";
        }

      }
    );

  </script>

</body>
</html>
