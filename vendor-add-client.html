<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ajouter un client - TAPTAPCARD</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        135deg,
        #faf9f7,
        #eef1f4,
        #e4e8ed
      );
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      background: white;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    textarea:focus {
      border-color: #999;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 10px;
    }

    .preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
      display: none;
    }

    .section-title {
      margin-top: 28px;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
      font-size: 18px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: white;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-btn {
      background: #eee;
      color: #222;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #e8f7ed;
      color: #217a3c;
    }

    .error {
      background: #fdeaea;
      color: #a32929;
    }

    .compression-info {
      display: none;
      margin-top: 8px;
      font-size: 12px;
      color: #777;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
        border-radius: 18px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Ajouter un client</h1>

  <div class="subtitle">
    Créez une nouvelle page TAPTAPCARD
  </div>

  <form id="clientForm">

    <!-- Informations -->
    <div class="section-title">
      Informations
    </div>

    <div class="field">
      <label for="name">
        Nom du client
      </label>

      <input
        type="text"
        id="name"
        placeholder="Nom du client"
        required
      >
    </div>

    <div class="field">
      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Description de l'activité"
      ></textarea>
    </div>


    <!-- Images -->
    <div class="section-title">
      Images
    </div>

    <div class="field">

      <label for="profileImage">
        Photo de profil
      </label>

      <input
        type="file"
        id="profileImage"
        accept="image/*"
      >

      <img
        id="profilePreview"
        class="preview"
        alt="Aperçu"
      >

      <div
        id="profileCompression"
        class="compression-info"
      ></div>

    </div>


    <div class="field">

      <label for="coverImage">
        Image de couverture
      </label>

      <input
        type="file"
        id="coverImage"
        accept="image/*"
      >

      <img
        id="coverPreview"
        class="preview"
        alt="Aperçu"
      >

      <div
        id="coverCompression"
        class="compression-info"
      ></div>

    </div>


    <!-- Réseaux sociaux -->
    <div class="section-title">
      Réseaux sociaux
    </div>

    <div class="field">

      <label for="instagram">
        Instagram
      </label>

      <input
        type="url"
        id="instagram"
        placeholder="https://instagram.com/..."
      >

    </div>


    <div class="field">

      <label for="facebook">
        Facebook
      </label>

      <input
        type="url"
        id="facebook"
        placeholder="https://facebook.com/..."
      >

    </div>


    <div class="field">

      <label for="tiktok">
        TikTok
      </label>

      <input
        type="url"
        id="tiktok"
        placeholder="https://tiktok.com/@..."
      >

    </div>


    <div class="field">

      <label for="snapchat">
        Snapchat
      </label>

      <input
        type="text"
        id="snapchat"
        placeholder="@username"
      >

    </div>


    <div class="field">

      <label for="website">
        Website
      </label>

      <input
        type="url"
        id="website"
        placeholder="https://..."
      >

    </div>


    <!-- Contact -->
    <div class="section-title">
      Contact
    </div>


    <div class="field">

      <label for="phone">
        Téléphone
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="0550..."
      >

    </div>


    <div class="field">

      <label for="whatsapp">
        WhatsApp
      </label>

      <input
        type="tel"
        id="whatsapp"
        placeholder="0550..."
      >

    </div>


    <div class="field">

      <label for="googleMaps">
        Google Maps
      </label>

      <input
        type="url"
        id="googleMaps"
        placeholder="https://maps.google.com/..."
      >

    </div>


    <button
      type="submit"
      id="submitBtn"
    >
      Ajouter le client
    </button>


    <button
      type="button"
      class="back-btn"
      onclick="window.location.href='vendor-dashboard.html'"
    >
      Retour
    </button>

  </form>


  <div
    id="successMessage"
    class="message success"
  ></div>


  <div
    id="errorMessage"
    class="message error"
  ></div>

</div>


<script>

/* =====================================================
   SESSION VENDEUR
===================================================== */

const vendorSession =
  JSON.parse(
    localStorage.getItem("vendor_session")
  );


if (
  !vendorSession ||
  !vendorSession.session_token ||
  !vendorSession.vendor_id
) {

  window.location.href =
    "vendor.html";

}


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById(
    "clientForm"
  );

const submitBtn =
  document.getElementById(
    "submitBtn"
  );

const profileInput =
  document.getElementById(
    "profileImage"
  );

const coverInput =
  document.getElementById(
    "coverImage"
  );

const profilePreview =
  document.getElementById(
    "profilePreview"
  );

const coverPreview =
  document.getElementById(
    "coverPreview"
  );

const profileCompression =
  document.getElementById(
    "profileCompression"
  );

const coverCompression =
  document.getElementById(
    "coverCompression"
  );

const successMessage =
  document.getElementById(
    "successMessage"
  );

const errorMessage =
  document.getElementById(
    "errorMessage"
  );


/* =====================================================
   FORMAT SIZE
===================================================== */

function formatKB(bytes) {

  return (
    (bytes / 1024).toFixed(1)
    + " KB"
  );

}


/* =====================================================
   PREVIEW IMAGE
===================================================== */

function showPreview(
  input,
  preview
) {

  const file =
    input.files[0];

  if (!file) {

    preview.style.display =
      "none";

    return;
  }


  const url =
    URL.createObjectURL(file);


  preview.src =
    url;

  preview.style.display =
    "block";

}


/* =====================================================
   COMPRESS IMAGE
===================================================== */

async function compressImage(
  file,
  folder
) {

  if (!file) {
    return null;
  }


  if (!file.type.startsWith("image/")) {

    throw new Error(
      "Le fichier doit être une image."
    );

  }


  /*
    Maximum original:
    25 MB
  */

  if (
    file.size >
    25 * 1024 * 1024
  ) {

    throw new Error(
      "L'image originale doit faire moins de 25 MB."
    );

  }


  /* =================================================
     LOAD IMAGE
  ================================================= */

  const image =
    new Image();

  const objectUrl =
    URL.createObjectURL(file);


  await new Promise(
    (resolve, reject) => {

      image.onload =
        resolve;

      image.onerror =
        () => {

          reject(
            new Error(
              "Impossible de lire l'image."
            )
          );

        };

      image.src =
        objectUrl;

    }
  );


  URL.revokeObjectURL(
    objectUrl
  );


  /* =================================================
     DIMENSIONS
  ================================================= */

  let maxWidth =
    folder === "profile"
      ? 700
      : 1200;


  let width =
    image.naturalWidth;

  let height =
    image.naturalHeight;


  if (
    width > maxWidth
  ) {

    const ratio =
      maxWidth / width;


    width =
      Math.round(
        width * ratio
      );


    height =
      Math.round(
        height * ratio
      );

  }


  /* =================================================
     CANVAS
  ================================================= */

  const canvas =
    document.createElement(
      "canvas"
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: false
      }
    );


  canvas.width =
    width;

  canvas.height =
    height;


  /*
    White background
    pour PNG transparent
  */

  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    image,
    0,
    0,
    width,
    height
  );


  /* =================================================
     TARGET SIZE
  ================================================= */

  const MIN_SIZE =
    50 * 1024;

  const MAX_SIZE =
    100 * 1024;


  let quality =
    0.82;


  let blob =
    null;


  /* =================================================
     FIRST COMPRESSION
  ================================================= */

  for (
    let i = 0;
    i < 10;
    i++
  ) {

    blob =
      await new Promise(
        resolve => {

          canvas.toBlob(
            resolve,
            "image/jpeg",
            quality
          );

        }
      );


    if (!blob) {

      throw new Error(
        "Impossible de compresser l'image."
      );

    }


    const size =
      blob.size;


    /*
      Between 50 and 100 KB
    */

    if (
      size >= MIN_SIZE &&
      size <= MAX_SIZE
    ) {

      break;

    }


    /*
      Bigger than 100 KB
    */

    if (
      size > MAX_SIZE
    ) {

      quality -=
        0.07;


      if (
        quality < 0.25
      ) {

        quality =
          0.25;

      }

    }


    /*
      Less than 50 KB
      We accept it.
    */

    if (
      size < MIN_SIZE
    ) {

      break;

    }

  }


  /* =================================================
     REDUCE DIMENSIONS IF STILL TOO BIG
  ================================================= */

  if (
    blob &&
    blob.size > MAX_SIZE
  ) {

    for (
      let i = 0;
      i < 5;
      i++
    ) {

      width =
        Math.round(
          width * 0.85
        );


      height =
        Math.round(
          height * 0.85
        );


      canvas.width =
        width;

      canvas.height =
        height;


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      blob =
        await new Promise(
          resolve => {

            canvas.toBlob(
              resolve,
              "image/jpeg",
              0.72
            );

          }
        );


      if (!blob) {

        throw new Error(
          "Impossible de compresser l'image."
        );

      }


      if (
        blob.size <= MAX_SIZE
      ) {

        break;

      }

    }

  }


  /* =================================================
     FINAL FILE
  ================================================= */

  const compressedFile =
    new File(
      [blob],
      "image.jpg",
      {
        type:
          "image/jpeg",

        lastModified:
          Date.now()
      }
    );


  console.log(
    "Original :",
    formatKB(
      file.size
    )
  );


  console.log(
    "Compressed :",
    formatKB(
      compressedFile.size
    )
  );


  return compressedFile;

}


/* =====================================================
   PROFILE IMAGE
   COMPRESSION STARTS IMMEDIATELY
===================================================== */

profileInput.addEventListener(
  "change",
  async function () {

    const file =
      profileInput.files[0];


    if (!file) {

      profilePreview.style.display =
        "none";

      profileCompression.style.display =
        "none";

      profileInput.compressedFile =
        null;

      return;

    }


    /*
      Preview original image
    */

    showPreview(
      profileInput,
      profilePreview
    );


    profileCompression.style.display =
      "block";


    profileCompression.textContent =
      "Compression en cours...";


    try {

      const compressedFile =
        await compressImage(
          file,
          "profile"
        );


      /*
        Save compressed file
      */

      profileInput.compressedFile =
        compressedFile;


      /*
        Show final size
      */

      profileCompression.textContent =
        "Image compressée : " +
        formatKB(
          compressedFile.size
        );


    } catch (error) {

      console.error(
        error
      );


      profileInput.compressedFile =
        null;


      profileCompression.textContent =
        "Erreur : " +
        error.message;

    }

  }
);


/* =====================================================
   COVER IMAGE
   COMPRESSION STARTS IMMEDIATELY
===================================================== */

coverInput.addEventListener(
  "change",
  async function () {

    const file =
      coverInput.files[0];


    if (!file) {

      coverPreview.style.display =
        "none";

      coverCompression.style.display =
        "none";

      coverInput.compressedFile =
        null;

      return;

    }


    /*
      Preview original
    */

    showPreview(
      coverInput,
      coverPreview
    );


    coverCompression.style.display =
      "block";


    coverCompression.textContent =
      "Compression en cours...";


    try {

      const compressedFile =
        await compressImage(
          file,
          "cover"
        );


      /*
        Save compressed file
      */

      coverInput.compressedFile =
        compressedFile;


      /*
        Show final size
      */

      coverCompression.textContent =
        "Image compressée : " +
        formatKB(
          compressedFile.size
        );


    } catch (error) {

      console.error(
        error
      );


      coverInput.compressedFile =
        null;


      coverCompression.textContent =
        "Erreur : " +
        error.message;

    }

  }
);


/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadImage(
  folder
) {

  let compressedFile =
    null;


  if (
    folder === "profile"
  ) {

    compressedFile =
      profileInput.compressedFile;

  } else {

    compressedFile =
      coverInput.compressedFile;

  }


  if (!compressedFile) {

    throw new Error(
      "Impossible de compresser l'image."
    );

  }


  /* =================================================
     PATH
  ================================================= */

  const randomPart =
    Math.random()
      .toString(36)
      .substring(
        2,
        10
      );


  const timestamp =
    Date.now();


  const filePath =
    vendorSession.vendor_id +
    "/" +
    folder +
    "/" +
    timestamp +
    "-" +
    randomPart +
    ".jpg";


  /* =================================================
     UPLOAD COMPRESSED FILE
  ================================================= */

  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        "client-images"
      )
      .upload(
        filePath,
        compressedFile,
        {
          cacheControl:
            "3600",

          upsert:
            false,

          contentType:
            "image/jpeg"
        }
      );


  if (error) {

    console.error(
      "Storage error:",
      error
    );


    throw new Error(
      "Impossible d'envoyer l'image : " +
      error.message
    );

  }


  /* =================================================
     PUBLIC URL
  ================================================= */

  const {
    data: publicData
  } =
    supabaseClient
      .storage
      .from(
        "client-images"
      )
      .getPublicUrl(
        data.path
      );


  return (
    publicData.publicUrl
  );

}


/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();


    successMessage.style.display =
      "none";

    errorMessage.style.display =
      "none";


    submitBtn.disabled =
      true;


    submitBtn.textContent =
      "Création du client...";


    try {

      /* =================================================
         BASIC DATA
      ================================================= */

      const name =
        document
          .getElementById(
            "name"
          )
          .value
          .trim();


      const description =
        document
          .getElementById(
            "description"
          )
          .value
          .trim();


      const instagram =
        document
          .getElementById(
            "instagram"
          )
          .value
          .trim();


      const facebook =
        document
          .getElementById(
            "facebook"
          )
          .value
          .trim();


      const tiktok =
        document
          .getElementById(
            "tiktok"
          )
          .value
          .trim();


      const snapchat =
        document
          .getElementById(
            "snapchat"
          )
          .value
          .trim();


      const website =
        document
          .getElementById(
            "website"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const whatsapp =
        document
          .getElementById(
            "whatsapp"
          )
          .value
          .trim();


      const googleMaps =
        document
          .getElementById(
            "googleMaps"
          )
          .value
          .trim();


      if (!name) {

        throw new Error(
          "Veuillez entrer le nom du client."
        );

      }


      /* =================================================
         CHECK IMAGE COMPRESSION
      ================================================= */

      let profileImage =
        "";

      let coverImage =
        "";


      if (
        profileInput.files &&
        profileInput.files.length > 0
      ) {

        if (
          !profileInput.compressedFile
        ) {

          throw new Error(
            "La photo de profil n'est pas encore compressée. Veuillez patienter."
          );

        }


        submitBtn.textContent =
          "Envoi de la photo de profil...";


        profileImage =
          await uploadImage(
            "profile"
          );

      }


      if (
        coverInput.files &&
        coverInput.files.length > 0
      ) {

        if (
          !coverInput.compressedFile
        ) {

          throw new Error(
            "L'image de couverture n'est pas encore compressée. Veuillez patienter."
          );

        }


        submitBtn.textContent =
          "Envoi de la couverture...";


        coverImage =
          await uploadImage(
            "cover"
          );

      }


      /* =================================================
         CREATE CLIENT
      ================================================= */

      submitBtn.textContent =
        "Création du client...";


      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            "create_vendor_client",
            {

              p_session_token:
                vendorSession.session_token,

              p_name:
                name,

              p_description:
                description,

              p_profile_image:
                profileImage,

              p_cover_image:
                coverImage,

              p_instagram:
                instagram,

              p_facebook:
                facebook,

              p_tiktok:
                tiktok,

              p_snapchat:
                snapchat,

              p_website:
                website,

              p_phone:
                phone,

              p_whatsapp:
                whatsapp,

              p_google_maps:
                googleMaps

            }
          );


      if (error) {

        console.error(
          "RPC error:",
          error
        );


        throw new Error(
          error.message
        );

      }


      /* =================================================
         SUCCESS
      ================================================= */

      successMessage.textContent =
        "Client ajouté avec succès.";


      successMessage.style.display =
        "block";


      form.reset();


      profileInput.compressedFile =
        null;


      coverInput.compressedFile =
        null;


      profilePreview.style.display =
        "none";


      coverPreview.style.display =
        "none";


      profileCompression.style.display =
        "none";


      coverCompression.style.display =
        "none";


      submitBtn.textContent =
        "Client ajouté ✓";


      /*
        Redirect dashboard
      */

      setTimeout(
        () => {

          window.location.href =
            "vendor-dashboard.html";

        },
        1500
      );


    } catch (error) {

      console.error(
        error
      );


      errorMessage.textContent =
        error.message ||
        "Une erreur est survenue.";


      errorMessage.style.display =
        "block";


      submitBtn.disabled =
        false;


      submitBtn.textContent =
        "Ajouter le client";

    }

  }
);

</script>

</body>
</html>
