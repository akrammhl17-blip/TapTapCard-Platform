<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard — Administration</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .logout {
      border: none;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
    }

    main {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    .welcome {
      margin-bottom: 22px;
    }

    .welcome h2 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .welcome p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .card span {
      display: block;
      color: #777;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .card strong {
      font-size: 27px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-button {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 15px 18px;
      border-radius: 11px;
      cursor: pointer;
      font-size: 15px;
      text-align: left;
    }

    .action-button:hover {
      opacity: .9;
    }

    .action-button.secondary {
      background: white;
      color: #222;
      border: 1px solid #e5e5e5;
    }

    .message {
      margin-top: 18px;
      padding: 14px;
      background: #fff;
      border-radius: 12px;
      color: #777;
      font-size: 14px;
      display: none;
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      main {
        padding-top: 22px;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>TapTapCard</h1>

  <button id="logoutButton" class="logout">
    Déconnexion
  </button>

</header>


<main>

  <div class="welcome">

    <h2 id="welcomeName">
      Bienvenue 👋
    </h2>

    <p>
      Tableau de bord de l'administration.
    </p>

  </div>


  <div class="cards">

    <div class="card">

      <span>
        Total vendeurs
      </span>

      <strong id="vendorCount">
        0
      </strong>

    </div>


    <div class="card">

      <span>
        Vendeurs actifs
      </span>

      <strong id="activeVendorCount">
        0
      </strong>

    </div>

  </div>


  <div class="actions">

    <button
      id="vendorsButton"
      class="action-button"
    >
      👥 &nbsp; Gérer les vendeurs
    </button>


    <button
      id="clientsButton"
      class="action-button secondary"
    >
      📋 &nbsp; Voir les clients
    </button>

  </div>


  <div id="message" class="message"></div>

</main>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

  // =========================
  // Vérification administration
  // =========================

  async function checkAdmin() {

    const {
      data: { user },
      error: authError
    } = await supabaseClient.auth.getUser();


    if (authError || !user) {

      window.location.href = "index.html";

      return;
    }


    // البحث عن حساب الإدارة

    const { data: admin, error } = await supabaseClient
      .from("vendors")
      .select("id, name, role, status")
      .eq("user_id", user.id)
      .single();


    if (error || !admin || admin.role !== "admin" || admin.status !== "active") {

      await supabaseClient.auth.signOut();

      window.location.href = "index.html";

      return;
    }


    document.getElementById("welcomeName").textContent =
      "Bienvenue, " + admin.name + " 👋";


    loadStats();

  }


  // =========================
  // إحصائيات البائعين
  // =========================

  async function loadStats() {

    const { data, error } = await supabaseClient
      .from("vendors")
      .select("id, role, status");


    if (error) {

      console.error(error);

      showMessage(
        "Impossible de charger les statistiques."
      );

      return;
    }


    const vendors = (data || []).filter(
      vendor => vendor.role === "vendor"
    );


    const activeVendors = vendors.filter(
      vendor => vendor.status === "active"
    );


    document.getElementById("vendorCount").textContent =
      vendors.length;


    document.getElementById("activeVendorCount").textContent =
      activeVendors.length;

  }


  // =========================
  // إدارة البائعين
  // =========================

  document
    .getElementById("vendorsButton")
    .addEventListener("click", () => {

      window.location.href = "admin-vendors.html";

    });


  // =========================
  // العملاء
  // =========================

  document
    .getElementById("clientsButton")
    .addEventListener("click", () => {

      showMessage(
        "La gestion des clients sera disponible depuis la gestion des vendeurs."
      );

    });


  // =========================
  // تسجيل الخروج
  // =========================

  document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      window.location.href = "index.html";

    });


  // =========================
  // رسالة
  // =========================

  function showMessage(text) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.style.display = "block";

  }


  // =========================
  // تشغيل
  // =========================

  checkAdmin();

</script>

</body>
</html>
