<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TapTapCard — Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .logout {
      border: none;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 25px 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin: 0 0 5px;
    }

    .welcome p {
      margin: 0;
      color: #777;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .card span {
      display: block;
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card strong {
      font-size: 28px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-button {
      border: none;
      background: #111;
      color: white;
      padding: 13px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>TapTapCard</h1>

    <button id="logoutButton" class="logout">
      Déconnexion
    </button>

  </header>


  <main>

    <div class="welcome">

      <h2 id="welcomeName">
        Bienvenue 👋
      </h2>

      <p>
        Gérez vos clients et leurs pages digitales.
      </p>

    </div>


    <div class="cards">

      <div class="card">

        <span>
          Nombre de clients
        </span>

        <strong id="clientCount">
          0
        </strong>

      </div>


      <div class="card">

        <span>
          Statut
        </span>

        <strong id="vendorStatus">
          —
        </strong>

      </div>

    </div>


    <div class="actions">

      <button class="action-button">
        ➕ Ajouter un client
      </button>

      <button class="action-button">
        📋 Mes clients
      </button>

    </div>

  </main>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>


  <script>

    // =========================
    // Vérifier la connexion
    // =========================

    async function checkUser() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {

        window.location.href = "index.html";

        return;
      }

      loadVendor(user.id);
    }


    // =========================
    // Charger معلومات البائع
    // =========================

    async function loadVendor(userId) {

      const { data, error } = await supabaseClient
        .from("vendors")
        .select("name, status")
        .eq("user_id", userId)
        .single();

      if (error) {

        console.error(error);

        return;
      }

      document.getElementById("welcomeName").textContent =
        "Bienvenue, " + data.name + " 👋";

      document.getElementById("vendorStatus").textContent =
        data.status;
    }


    // =========================
    // تسجيل الخروج
    // =========================

    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {

        await supabaseClient.auth.signOut();

        window.location.href = "index.html";

      });


    // تشغيل التحقق
    checkUser();

  </script>

</body>
        </html>
